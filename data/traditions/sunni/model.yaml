# Individuals only. Bible verses are parallels to the Qur'anic account, not Islamic proof texts.
nodes:
  - id: sun.allah
    label: Allah
    category: Creator
    referent: ref.godhead
    description: The One God. He "neither begets nor is born".
    attributes:
      - name: Has a son?
        topics: [allah]
        value: No. "It is not [befitting] for Allah to take a son"
        citations:
          scripture: { bible: none-cited, other: [{ ref: Quran 19:35, highlight: "It is not [befitting] for Allah to take a son" }, Quran 112:3, Quran 4:171] }
          authority:
            - source: Qur'an
              ref: Maryam 19:35
              tier: quran
            - source: Ibn Kathir, Tafsir (abridged)
              ref: on 2:117
              tier: tafsir
              url: https://quran.com/2:117/tafsirs/en-tafisr-ibn-kathir
              quote: He is the Supreme Master Whom there is no equal or rival, everything and everyone was created by Him, so how can He have a son from among them
    citations:
      scripture: { bible: [Deut 6:4], other: [Quran 112:1-4] }
      authority:
        - source: Qur'an
          ref: Surah al-Ikhlas 112
          tier: quran

  - id: sun.isa
    label: Isa (Jesus), son of Maryam
    category: Messenger
    referent: ref.jesus
    description: A messenger and servant of Allah, created by the word "Be" without a father, like Adam.
    attributes:
      - name: '"His Word" and "a spirit from Him"'
        value: The Messiah (al-Masih), created by Allah's word "Be" sent with Jibril to Maryam, and a created spirit through the breath of Jibril by Allah's leave.
        topics:
          - messengers
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 4:171
              - Quran 3:45
          authority:
            - source: Qur'an
              ref: An-Nisa 4:171
              tier: quran
              url: https://quran.com/4/171
              quote: The Messiah, Jesus, son of Mary, was no more than a messenger of Allah and the fulfilment of His Word through Mary and a spirit ˹created by a command˺ from Him.
            - source: Ibn Kathir, Tafsir (abridged)
              ref: on 4:171
              tier: tafsir
              url: https://quran.com/4/171/tafsirs
              quote: "`Isa is only one of Allah's servants and one of His creatures. Allah said to him, `Be', and he was, and He sent him as a Messenger. `Isa was a word from Allah that He bestowed on Maryam, meaning He created him with the word `Be' that He sent with Jibril to Maryam. Jibril blew the life of `Isa into Maryam by Allah's leave, and `Isa came to existence as a result."
            - source: Ibn Kathir, Tafsir (abridged)
              ref: on 3:45
              tier: tafsir
              url: https://quran.com/3/45/tafsirs
              quote: "`Isa was called \"Al-Masih\" (the Messiah) because when he touched (Mash) those afflicted with an illness, they would be healed by Allah's leave."
      - name: Crucified?
        value: No. "They did not kill him, nor did they crucify him; but [another] was made to resemble him to them"
        topics:
          - messengers
        citations:
          scripture:
            bible: none-cited
            other:
              - ref: Quran 4:157
                highlight: they did not kill him, nor did they crucify him; but [another] was made to resemble him to them
          authority:
            - source: Qur'an
              ref: An-Nisa 4:157
              tier: quran
              url: https://quran.com/4/157
              quote: and for boasting, “We killed the Messiah, Jesus, son of Mary, the messenger of Allah.” But they neither killed nor crucified him—it was only made to appear so.
            - source: Ibn Kathir, Tafsir (abridged)
              ref: on 4:157
              tier: tafsir
              url: https://quran.com/4/157/tafsirs
              quote: When `Isa ascended, those who were in the house came out. When those surrounding the house saw the man who looked like `Isa, they thought that he was `Isa. So they took him at night, crucified him and placed a crown of thorns on his head.
      - name: Return
        value: He will shortly descend as a just ruler, break the cross, kill the swine, and abolish the jizya
        topics:
          - last-day
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 4:159
          authority:
            - source: Sahih al-Bukhari 2222
              ref: Sahih al-Bukhari 2222
              tier: sahih-hadith
              url: https://sunnah.com/bukhari:2222
              quote: By Him in Whose Hands my soul is, son of Mary (Jesus) will shortly descend ... amongst you people (Muslims) as a just ruler and will break the Cross and kill the pig and abolish the ... Jizya
      - name: Miracles
        value: Granted miracles performed strictly by Allah's permission, including speaking in the cradle, forming living birds from clay, healing the blind and leper, and raising the dead, supported by the Holy Spirit (Jibril).
        topics:
          - messengers
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 5:110
          authority:
            - source: Qur'an
              ref: Al-Ma'idah 5:110
              tier: quran
              url: https://quran.com/5/110
              quote: how I supported you with the holy spirit ... so you spoke to people in ˹your˺ infancy and adulthood. How I taught you writing, wisdom, the Torah, and the Gospel. How you moulded a bird from clay—by My Will—and breathed into it and it became a ˹real˺ bird—by My Will. How you healed the blind and the lepers—by My Will. How you brought the dead to life—by My Will.
      - name: Scripture
        value: Given the Gospel (al-Injil) by Allah as divine revelation containing guidance and light, confirming the Torah (at-Tawrat).
        topics:
          - books
          - messengers
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 5:46
          authority:
            - source: Qur'an
              ref: Al-Ma'idah 5:46
              tier: quran
              url: https://quran.com/5/46
              quote: Then in the footsteps of the prophets, We sent Jesus, son of Mary, confirming the Torah revealed before him. And We gave him the Gospel containing guidance and light and confirming what was revealed in the Torah—a guide and a lesson to the God-fearing.
      - name: Disavowal of worship
        value: On the Day of Resurrection, Jesus disavows and repudiates any claim that he or his mother Maryam be taken as deities besides Allah.
        topics:
          - last-day
          - messengers
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 5:116
          authority:
            - source: Qur'an
              ref: Al-Ma'idah 5:116
              tier: quran
              url: https://quran.com/5/116
              quote: And ˹on Judgment Day˺ Allah will say, “O Jesus, son of Mary! Did you ever ask the people to worship you and your mother as gods besides Allah?” He will answer, “Glory be to You! How could I ever say what I had no right to say? If I had said such a thing, you would have certainly known it.
      - name: Relation to Muhammad
        value: The Prophet Muhammad is the closest of all people to Jesus, with no prophet between them; prophets are paternal brothers with one religion, and Jesus foretold Muhammad's coming under the name Ahmad.
        topics:
          - messengers
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 61:6
          authority:
            - source: Sahih al-Bukhari 3442
              ref: Sahih al-Bukhari 3442
              tier: sahih-hadith
              url: https://sunnah.com/bukhari:3442
              quote: I am the nearest of all the people to the son of Mary, and all the ... prophets are paternal brothers, and there has been no prophet between me and him
            - source: Qur'an
              ref: As-Saf 61:6
              tier: quran
              url: https://quran.com/61/6
              quote: And ˹remember˺ when Jesus, son of Mary, said, “O children of Israel! I am truly Allah’s messenger to you, confirming the Torah which came before me, and giving good news of a messenger after me whose name will be Aḥmad.”
    citations:
      scripture:
        bible: none-cited
        other:
          - Quran 5:75
          - Quran 3:59
          - Quran 19:30
      authority:
        - source: Qur'an
          ref: Maryam 19:30
          tier: quran
          url: https://quran.com/19/30
          quote: Jesus declared, “I am truly a servant of Allah. He has destined me to be given the Scripture and to be a prophet.
        - source: Ibn Kathir, Tafsir (abridged)
          ref: on 4:171
          tier: tafsir
          url: https://quran.com/4/171/tafsirs
          quote: "`Isa is only one of Allah's servants and one of His creatures. Allah said to him, `Be', and he was, and He sent him as a Messenger. `Isa was a word from Allah that He bestowed on Maryam, meaning He created him with the word `Be' that He sent with Jibril to Maryam. Jibril blew the life of `Isa into Maryam by Allah's leave, and `Isa came to existence as a result."

  - id: sun.jibril
    label: Jibril (Ruh al-Qudus, the Holy Spirit)
    category: Angel
    referent: ref.holy-spirit
    description: The angel of revelation. The Qur'an's "Pure Spirit" (Ruh al-Qudus) and "Our Spirit" sent to Maryam.
    citations:
      scripture: { bible: [Luke 1:26], other: [Quran 2:87, Quran 16:102, Quran 19:17] }
      authority:
        - source: Ibn Kathir, Tafsir (abridged)
          ref: on 16:102
          tier: tafsir
          url: https://quran.com/16:102/tafsirs/en-tafisr-ibn-kathir
          quote: '(Say: "Ruh-ul-Qudus has brought it...") meaning, Jibril'

  - id: sun.maryam
    label: Maryam (Mary)
    category: Human
    referent: ref.mary
    description: Chosen and purified by Allah, a virgin who bore Isa.
    attributes:
      - name: Chosen
        value: Allah has "chosen you above the women of the worlds"
        citations:
          scripture: { bible: [{ ref: Luke 1:28, highlight: "blessed art thou among women" }], other: [{ ref: Quran 3:42, highlight: "chosen you above the women of the worlds" }] }
          authority:
            - source: Ibn Kathir, Tafsir (abridged)
              ref: on 3:42
              tier: tafsir
              url: https://quran.com/3:42/tafsirs/en-tafisr-ibn-kathir
              quote: Allah also chose her because of her virtue over the women of the world.
    citations:
      scripture:
        bible:
          - together: [Luke 1:26-27, Luke 1:34]
            note: 'Parallel to Maryam 19:16-20: the angel sent to a virgin, who asks how she can have a son when no man has touched her.'
        other: [Quran 19:20, Quran 3:47]
      authority:
        - source: Qur'an
          ref: Maryam 19:16-22
          tier: quran

  - id: sun.heavens-earth
    label: The heavens and the earth
    category: HeavensEarth
    referent: ref.heavens-earth
    attributes:
      - name: Made from
        topics: [creation]
        value: Nothing; "out of nothing and without precedent"
        citations:
          scripture: { bible: [Gen 1:1], other: [Quran 2:117] }
          authority:
            - source: Ibn Kathir, Tafsir (abridged), quoting Ibn Jarir al-Tabari
              ref: on 2:117
              tier: tafsir
              url: https://quran.com/2:117/tafsirs/en-tafisr-ibn-kathir
              quote: Allah stated that He created the heavens and earth out of nothing and without precedent.
    citations:
      scripture: { bible: [Gen 1:1], other: [Quran 21:30] }
      authority:
        - source: Qur'an
          ref: Al-Anbiya 21:30
          tier: quran


  - id: sun.adam
    label: Adam
    category: Human
    referent: ref.adam
    description: The first human and father of humankind, placed on earth as a khalifah (successor).
    attributes:
      - name: Created from
        topics: [adam]
        value: Dust (clay), then Allah said "Be"; angels were commanded to prostrate to him
        citations:
          scripture: { bible: [{ ref: Gen 2:7, highlight: "formed man of the dust of the ground" }], other: [Quran 3:59, Quran 7:11, Quran 38:71-72] }
          authority:
            - source: Ibn Kathir, Tafsir (abridged)
              ref: on 3:59
              tier: tafsir
              url: https://quran.com/3:59/tafsirs/en-tafisr-ibn-kathir
              quote: Allah created Adam without a father or a mother
            - source: Ibn Kathir, Tafsir (abridged)
              ref: on 7:11
              tier: tafsir
              url: https://quran.com/7:11/tafsirs/en-tafisr-ibn-kathir
              quote: Allah informs the Children of Adam about the honor of their father
      - name: Slip and repentance
        topics: [adam]
        value: Adam disobeyed, then repented; "his Lord chose him and turned to him in forgiveness". No inherited guilt is taught
        citations:
          scripture: { bible: [Gen 3:6], other: [Quran 2:37, { ref: Quran 20:122, highlight: "Then his Lord chose him and turned to him in forgiveness" }, Quran 7:23] }
          authority:
            - source: Ibn Kathir, Tafsir (abridged)
              ref: on 2:37
              tier: tafsir
              url: https://quran.com/2:37/tafsirs/en-tafisr-ibn-kathir
              quote: 'They said: "Our Lord! We have wronged ourselves. If You forgive us not, and bestow not upon us Your mercy, we shall certainly be of the losers."'
      - name: Role
        topics: [adam]
        value: Khalifah on earth, "people reproducing generation after generation"
        citations:
          scripture: { bible: [Gen 1:28], other: [Quran 2:30] }
          authority:
            - source: Ibn Kathir, Tafsir (abridged)
              ref: on 2:30
              tier: tafsir
              url: https://quran.com/2:30/tafsirs/en-tafisr-ibn-kathir
              quote: Meaning people reproducing generation after generation, century after century
    citations:
      scripture: { bible: [Gen 2:7], other: [Quran 2:30, Quran 3:59] }
      authority:
        - source: Qur'an
          ref: Al-Baqarah 2:30-37
          tier: quran

  - id: sun.hawwa
    label: Hawwa' (Eve)
    category: Human
    referent: ref.eve
    description: Adam's wife, created from him. Both were deceived, both repented, and both were forgiven.
    citations:
      scripture: { bible: [Gen 2:21-22], other: [Quran 4:1, Quran 7:22-23] }
      authority:
        - source: Ibn Kathir, Tafsir (abridged)
          ref: on 4:1
          tier: tafsir
          url: https://quran.com/4:1/tafsirs/en-tafisr-ibn-kathir
          quote: Hawwa' (Eve), who was created from Adam's left rib, from his back while he was sleeping

edges:
  - id: sun.e.allah-creates-isa
    source: sun.allah
    rel: creates
    target: sun.isa
    note: '"Like Adam": created without a father by the word "Be".'
    citations:
      scripture: { bible: [Gen 2:7], other: [Quran 3:59] }
      authority:
        - source: Ibn Kathir, Tafsir (abridged)
          ref: on 3:59
          tier: tafsir
          url: https://quran.com/3:59/tafsirs/en-tafisr-ibn-kathir
          quote: He created him without a father ... for Allah created Adam without a father or a mother

  - id: sun.e.allah-creates-cosmos
    source: sun.allah
    rel: creates
    target: sun.heavens-earth
    citations:
      scripture: { bible: [Gen 1:1], other: [Quran 2:117] }
      authority:
        - source: Qur'an
          ref: Al-Baqarah 2:117
          tier: quran

  - id: sun.e.allah-sends-jibril
    source: sun.allah
    rel: sends
    target: sun.jibril
    note: To Maryam, appearing "in the form of a man in all respects".
    citations:
      scripture: { bible: [Luke 1:26], other: [Quran 19:17] }
      authority:
        - source: Ibn Kathir, Tafsir (abridged)
          ref: on 19:17
          tier: tafsir
          url: https://quran.com/19:17/tafsirs/en-tafisr-ibn-kathir
          quote: 'then We sent to her Our Ruh ... "It means Jibril."'

  - id: sun.e.allah-sends-isa
    source: sun.allah
    rel: sends
    target: sun.isa
    citations:
      scripture: { bible: none-cited, other: [Quran 5:75, Quran 61:6] }
      authority:
        - source: Qur'an
          ref: Al-Ma'idah 5:75
          tier: quran

  - id: sun.e.jibril-supports-isa
    source: sun.jibril
    rel: supports
    target: sun.isa
    citations:
      scripture: { bible: none-cited, other: [Quran 2:87] }
      authority:
        - source: Ibn Kathir, Tafsir (abridged)
          ref: on 2:87
          tier: tafsir
          url: https://quran.com/2:87/tafsirs/en-tafisr-ibn-kathir
          quote: Allah also aided him with Ruh Al-Qudus, and that refers to Jibril.

  - id: sun.e.maryam-bears-isa
    source: sun.maryam
    rel: bears
    target: sun.isa
    note: Conceived miraculously without male parentage through the breathing of the Spirit (Jibril) into Maryam by Allah's leave.
    citations:
      scripture:
        bible:
          - Luke 1:31
        other:
          - Quran 19:22
          - Quran 3:45
          - Quran 21:91
      authority:
        - source: Qur'an
          ref: Maryam 19:22
          tier: quran
        - source: Qur'an
          ref: Al-Anbya 21:91
          tier: quran
          url: https://quran.com/21/91
          quote: And ˹remember˺ the one who guarded her chastity, so We breathed into her through Our angel, ˹Gabriel,˺ ... making her and her son a sign for all peoples.

  - id: sun.e.allah-raises-isa
    source: sun.allah
    rel: raises
    target: sun.isa
    note: Raised to Allah without being killed. He will return before the end.
    citations:
      scripture: { bible: none-cited, other: [Quran 4:157-158] }
      authority:
        - source: Qur'an
          ref: An-Nisa 4:158
          tier: quran
        - source: Ibn Kathir, Tafsir (abridged)
          ref: on 4:157
          tier: tafsir
          url: https://quran.com/4:157/tafsirs/en-tafisr-ibn-kathir
          quote: '`Isa ascended to heaven from a hole in the house'


  - id: sun.e.allah-creates-adam
    source: sun.allah
    rel: creates
    target: sun.adam
    citations:
      scripture: { bible: [Gen 2:7], other: [Quran 3:59, Quran 38:71-72] }
      authority:
        - source: Qur'an
          ref: Al Imran 3:59; Sad 38:71-72
          tier: quran

  - id: sun.e.hawwa-from-adam
    source: sun.hawwa
    rel: formedFrom
    target: sun.adam
    citations:
      scripture: { bible: [Gen 2:21-22], other: [Quran 4:1, Quran 7:189] }
      authority:
        - source: Qur'an
          ref: An-Nisa 4:1
          tier: quran
        - source: Ibn Kathir, Tafsir (abridged)
          ref: on 4:1
          tier: tafsir
          url: https://quran.com/4:1/tafsirs/en-tafisr-ibn-kathir
          quote: Hawwa' (Eve), who was created from Adam's left rib

  - id: sun.e.isa-like-adam
    source: sun.isa
    rel: isLike
    target: sun.adam
    note: Both were created without a father, by the word "Be".
    citations:
      scripture: { bible: none-cited, other: [Quran 3:59] }
      authority:
        - source: Qur'an
          ref: Al Imran 3:59
          tier: quran
        - source: Ibn Kathir, Tafsir (abridged)
          ref: on 3:59
          tier: tafsir
          url: https://quran.com/3:59/tafsirs/en-tafisr-ibn-kathir
          quote: He Who created Adam without a father or a mother is able to create
