tradition:
  id: sunni
  name: Ahl al-Sunnah wa-l-Jamāʿah (Sunni Islam)
  shortName: Sunni
  scripture: { bible: kjv, other: quran-sahih }
  # The Old and New Testaments are not Islamic scripture. Bible verses appear only as labeled parallels.
  bibleRole: parallel
  otherScriptureLabel: Qur'an
  tiers:
    - { id: quran, label: "Qur'an" }
    - { id: sahih-hadith, label: "Sahih hadith (al-Bukhari, Muslim)" }
    - { id: tafsir, label: "Classical tafsir (Ibn Kathir, al-Tabari)" }
  hermeneutic:
    summary: >-
      The Qur'an explains itself: unclear verses (mutashabihat) are understood by referring them to the clear
      foundational verses (muhkamat), together with the Sunnah and the explanations of the Companions.
    citations:
      scripture: { bible: none-cited, other: [Quran 3:7] }
      authority:
        - source: Ibn Kathir, Tafsir (abridged)
          ref: on 3:7
          tier: tafsir
          url: https://quran.com/3:7/tafsirs/en-tafisr-ibn-kathir
          quote: So those who refer to the Muhkam Ayat to understand the Mutashabih Ayat, will have acquired the correct guidance
  allowedDomains: [quran.com, sunnah.com, tanzil.net]

# The tradition's own outline of teaching, in its own words. Data is organized by these topics:
# every relationship type declares its topics, and edges inherit them.
topics:
  - { id: allah, label: "Belief in Allah", registry: [topic.god], source: { source: "Qur'an (six articles of faith)", ref: "Quran 4:136", tier: quran, url: "https://quran.com/4:136" } }
  - { id: angels, label: "Belief in His angels", registry: [topic.angels], source: { source: "Qur'an (six articles of faith)", ref: "Quran 4:136", tier: quran, url: "https://quran.com/4:136" } }
  - { id: books, label: "Belief in His books", registry: [topic.scripture], source: { source: "Qur'an (six articles of faith)", ref: "Quran 4:136", tier: quran, url: "https://quran.com/4:136" } }
  - { id: messengers, label: "Belief in His messengers", registry: [topic.prophethood, topic.christ], source: { source: "Qur'an (six articles of faith)", ref: "Quran 4:136", tier: quran, url: "https://quran.com/4:136" } }
  - { id: last-day, label: "Belief in the Last Day", registry: [topic.afterlife, topic.resurrection, topic.last-things], source: { source: "Qur'an (six articles of faith)", ref: "Quran 4:136", tier: quran, url: "https://quran.com/4:136" } }
  - { id: qadar, label: "Belief in the divine decree (qadar)", registry: [topic.predestination], source: { source: "Qur'an (six articles of faith)", ref: "Quran 54:49", tier: quran, url: "https://quran.com/54:49" } }
  - { id: creation, label: "Creation by the command “Be”", registry: [topic.creation], inOutline: false, source: { source: "Qur'an", ref: "Quran 2:117", tier: quran, url: "https://quran.com/2:117" } }
  - { id: adam, label: "Adam and the human being", registry: [topic.humanity, topic.fall], inOutline: false, source: { source: "Qur'an", ref: "Quran 2:30-37", tier: quran, url: "https://quran.com/2:30" } }
stances:
  - debate: debate.trinity
    stance: rejects
    claims: ["sun.allah#Has a son?"]
    summary: 'Allah is One. The Qur''an forbids saying "Three".'
    citations:
      scripture: { bible: none-cited, other: [Quran 4:171, Quran 112:1-4] }
      authority:
        - { source: "Qur'an", ref: An-Nisa 4:171, tier: quran }
  - debate: debate.son-created
    stance: affirms
    claims: ["sun.e.allah-creates-isa", "sun.e.isa-like-adam"]
    summary: Isa is a created servant and messenger of Allah, created like Adam.
    citations:
      scripture: { bible: none-cited, other: [Quran 3:59, Quran 4:171] }
      authority:
        - { source: "Ibn Kathir, Tafsir (abridged)", ref: on 4:171, tier: tafsir, url: "https://quran.com/4:171/tafsirs/en-tafisr-ibn-kathir", quote: "`Isa is only one of Allah's servants and one of His creatures." }
  - debate: debate.two-natures
    stance: rejects
    claims: ["sun.e.allah-sends-isa"]
    summary: Isa is a human messenger, not divine.
    citations:
      scripture: { bible: none-cited, other: [Quran 5:75] }
      authority:
        - { source: "Ibn Kathir, Tafsir (abridged)", ref: on 5:75, tier: tafsir, url: "https://quran.com/5:75/tafsirs/en-tafisr-ibn-kathir", quote: "`Isa is just like the previous Prophets, and he is one of the servants of Allah and one of His honorable Messengers." }
  - debate: debate.ex-nihilo
    stance: affirms
    claims: ["sun.e.allah-creates-cosmos", "sun.heavens-earth#Made from"]
    summary: Allah created the heavens and the earth "out of nothing and without precedent".
    citations:
      scripture: { bible: none-cited, other: [Quran 2:117] }
      authority:
        - { source: "Ibn Kathir, Tafsir (abridged), quoting Ibn Jarir al-Tabari", ref: on 2:117, tier: tafsir, url: "https://quran.com/2:117/tafsirs/en-tafisr-ibn-kathir", quote: "Allah stated that He created the heavens and earth out of nothing and without precedent." }
  - debate: debate.inherited-guilt
    stance: rejects
    claims: ["sun.adam#Slip and repentance"]
    summary: Adam repented and was forgiven, and no soul bears another's burden.
    citations:
      scripture: { bible: none-cited, other: [Quran 6:164, Quran 20:122] }
      authority:
        - { source: "Qur'an", ref: "Al-An'am 6:164", tier: quran }
  - debate: debate.crucifixion
    stance: rejects
    claims: ["sun.isa#Crucified?", "sun.e.allah-raises-isa"]
    summary: Isa was neither killed nor crucified. Another was made to resemble him, and Allah raised him up.
    citations:
      scripture: { bible: none-cited, other: [{ ref: Quran 4:157, highlight: "they did not kill him, nor did they crucify him" }] }
      authority:
        - { source: "Qur'an", ref: An-Nisa 4:157, tier: quran }

categories:
  - id: Creator
    label: Allah, the Creator
    group: true
    definition: '"He is Allah, [who is] One ... He neither begets nor is born, nor is there to Him any equivalent."'
    citations:
      scripture: { bible: [Deut 6:4, Mark 12:29], other: [Quran 112:1-4] }
      authority:
        - source: Qur'an
          ref: Surah al-Ikhlas 112:1-4
          tier: quran
        - source: Ibn Kathir, Tafsir (abridged)
          ref: on 112
          tier: tafsir
          url: https://quran.com/112:1/tafsirs/en-tafisr-ibn-kathir
          quote: He begets not, nor was He begotten, and there is none comparable to Him.

  - id: Creation
    label: Creation
    group: true
    definition: Everything other than Allah, brought into being by His command "Be".
    citations:
      scripture: { bible: [Gen 1:1], other: [Quran 2:117, Quran 6:101] }
      authority:
        - source: Ibn Kathir, Tafsir (abridged), quoting Ibn Jarir al-Tabari
          ref: on 2:117
          tier: tafsir
          url: https://quran.com/2:117/tafsirs/en-tafisr-ibn-kathir
          quote: Allah stated that He created the heavens and earth out of nothing and without precedent.

  - id: Angel
    label: Angel (malak)
    parent: Creation
    definition: A created being sent by Allah as a messenger. Jibril is the angel of revelation.
    citations:
      scripture: { bible: [Luke 1:26], other: [Quran 19:17, Quran 16:102] }
      authority:
        - source: Ibn Kathir, Tafsir (abridged)
          ref: on 19:17
          tier: tafsir
          url: https://quran.com/19:17/tafsirs/en-tafisr-ibn-kathir
          quote: when the angel (Jibril) appeared to her in the form of a man

  - id: Human
    label: Human (servant of Allah)
    parent: Creation
    definition: A created human being and servant of Allah.
    citations:
      scripture: { bible: [Gen 2:7], other: [Quran 3:59] }
      authority:
        - source: Qur'an
          ref: Al Imran 3:59
          tier: quran

  - id: Messenger
    label: Messenger (rasul)
    parent: Human
    definition: A human prophet sent by Allah with a message. "Isa is just like the previous Prophets".
    citations:
      scripture: { bible: none-cited, other: [Quran 5:75] }
      authority:
        - source: Ibn Kathir, Tafsir (abridged)
          ref: on 5:75
          tier: tafsir
          url: https://quran.com/5:75/tafsirs/en-tafisr-ibn-kathir
          quote: '`Isa is just like the previous Prophets, and he is one of the servants of Allah and one of His honorable Messengers.'

  - id: HeavensEarth
    label: The heavens and the earth
    parent: Creation
    definition: The created cosmos, "joined together" and then separated.
    citations:
      scripture: { bible: [Gen 1:1], other: [Quran 21:30] }
      authority:
        - source: Ibn Kathir, Tafsir (abridged)
          ref: on 21:30
          tier: tafsir
          url: https://quran.com/21:30/tafsirs/en-tafisr-ibn-kathir
          quote: in the beginning they were all one piece, attached to one another and piled up on top of one another, then He separated them

relationships:
  - id: creates
    label: creates
    definition: Allah brings something into being by His command "Be" (kun).
    domain: [Creator]
    range: [Creation]
    topics: [creation, allah]
    citations:
      scripture: { bible: [Gen 1:1], other: [Quran 2:117, Quran 3:59] }
      authority:
        - source: Qur'an
          ref: Al-Baqarah 2:117
          tier: quran

  - id: sends
    label: sends
    definition: Allah sends an angel or a messenger.
    domain: [Creator]
    range: [Angel, Messenger]
    topics: [messengers, angels]
    citations:
      scripture: { bible: [Luke 1:26], other: [Quran 19:17, Quran 5:75] }
      authority:
        - source: Qur'an
          ref: Maryam 19:17
          tier: quran

  - id: supports
    label: supports
    definition: '"We ... supported him with the Pure Spirit" (Ruh al-Qudus), which Ibn Kathir identifies as Jibril.'
    domain: [Angel]
    range: [Messenger]
    topics: [angels, messengers]
    citations:
      scripture: { bible: none-cited, other: [Quran 2:87] }
      authority:
        - source: Ibn Kathir, Tafsir (abridged)
          ref: on 2:87
          tier: tafsir
          url: https://quran.com/2:87/tafsirs/en-tafisr-ibn-kathir
          quote: Allah also aided him with Ruh Al-Qudus, and that refers to Jibril.

  - id: bears
    label: bears
    definition: A woman conceives and gives birth.
    domain: [Human]
    range: [Human]
    topics: [messengers]
    citations:
      scripture: { bible: [Luke 1:31], other: [Quran 19:22] }
      authority:
        - source: Qur'an
          ref: Maryam 19:22
          tier: quran

  - id: raises
    label: raises
    definition: Allah raises Isa up to Himself.
    domain: [Creator]
    range: [Messenger]
    topics: [messengers, last-day]
    citations:
      scripture: { bible: none-cited, other: [Quran 4:158] }
      authority:
        - source: Qur'an
          ref: An-Nisa 4:158
          tier: quran


  - id: formedFrom
    label: formed from
    definition: '"He created you from one soul and created from it its mate."'
    domain: [Human]
    range: [Human]
    topics: [adam]
    citations:
      scripture: { bible: [Gen 2:21-22], other: [Quran 4:1, Quran 7:189] }
      authority:
        - source: Qur'an
          ref: An-Nisa 4:1
          tier: quran

  - id: isLike
    label: is like
    definition: 'Likeness in origin: "the example of Jesus to Allah is like that of Adam".'
    domain: [Messenger]
    range: [Human]
    topics: [messengers, adam]
    citations:
      scripture: { bible: none-cited, other: [Quran 3:59] }
      authority:
        - source: Qur'an
          ref: Al Imran 3:59
          tier: quran
