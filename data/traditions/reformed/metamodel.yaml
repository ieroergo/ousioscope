stances:
  - debate: debate.trinity
    stance: affirms
    claims: ["wcf.e.father-is", "wcf.e.son-is", "wcf.e.spirit-is"]
    summary: Three persons "of one substance, power, and eternity".
    citations:
      scripture: { bible: [Matt 28:19, 2 Cor 13:14] }
      authority:
        - { source: Westminster Confession of Faith, ref: WCF 2.3, tier: confessional, url: "https://www.opc.org/wcf.html#Chapter_02", quote: "In the unity of the Godhead there be three persons, of one substance, power, and eternity" }
  - debate: debate.son-created
    stance: rejects
    claims: ["wcf.e.father-begets"]
    summary: The Son is "very and eternal God", eternally begotten, not created.
    citations:
      scripture: { bible: [John 1:1, John 1:14] }
      authority:
        - { source: Westminster Confession of Faith, ref: WCF 8.2, tier: confessional, url: "https://www.opc.org/wcf.html#Chapter_08", quote: "The Son of God, the second person in the Trinity, being very and eternal God, of one substance and equal with the Father" }
  - debate: debate.two-natures
    stance: affirms
    claims: ["wcf.e.son-takes-manhood", "wcf.son#Natures and person"]
    summary: Two whole, perfect, and distinct natures in one person, following Chalcedon.
    citations:
      scripture: { bible: [Col 2:9, Rom 9:5] }
      authority:
        - { source: Westminster Confession of Faith, ref: WCF 8.2, tier: confessional, url: "https://www.opc.org/wcf.html#Chapter_08", quote: "two whole, perfect, and distinct natures, the Godhead and the manhood, were inseparably joined together in one person" }
  - debate: debate.theotokos
    stance: none
    claims: ["wcf.e.mary-bears"]
    summary: The Standards do not use the title. They confess Christ "conceived ... in the womb of the virgin Mary, of her substance" (WCF 8.2).
  - debate: debate.filioque
    stance: affirms
    claims: ["wcf.e.spirit-from-father", "wcf.e.spirit-from-son"]
    summary: The Holy Ghost proceeds "from the Father and the Son".
    citations:
      scripture: { bible: [John 15:26, Gal 4:6] }
      authority:
        - { source: Westminster Confession of Faith, ref: WCF 2.3, tier: confessional, url: "https://www.opc.org/wcf.html#Chapter_02", quote: "the Holy Ghost eternally proceeding from the Father and the Son" }
  - debate: debate.ex-nihilo
    stance: affirms
    claims: ["wcf.e.father-creates", "wcf.e.son-creates", "wcf.e.spirit-creates", "wcf.world#Made from"]
    summary: God made the world "of nothing".
    citations:
      scripture: { bible: [Heb 11:3] }
      authority:
        - { source: Westminster Confession of Faith, ref: WCF 4.1, tier: confessional, url: "https://www.opc.org/wcf.html#Chapter_04", quote: "to create, or make of nothing, the world, and all things therein whether visible or invisible" }
  - debate: debate.god-embodied
    stance: rejects
    claims: ["wcf.godhead#Body?"]
    summary: God is "a most pure spirit ... without body, parts, or passions".
    citations:
      scripture: { bible: [John 4:24] }
      authority:
        - { source: Westminster Confession of Faith, ref: WCF 2.1, tier: confessional, url: "https://www.opc.org/wcf.html#Chapter_02", quote: "a most pure spirit, invisible, without body, parts, or passions" }
  - debate: debate.immortal-soul
    stance: affirms
    claims: ["category:Soul", "axiom:ax.soul-reunites-body"]
    summary: Souls "neither die nor sleep" and return to God at death.
    citations:
      scripture: { bible: [Luke 23:43, Eccl 12:7] }
      authority:
        - { source: Westminster Confession of Faith, ref: WCF 32.1, tier: confessional, url: "https://www.opc.org/wcf.html#Chapter_32", quote: "their souls, which neither die nor sleep, having an immortal subsistence, immediately return to God who gave them" }
  - debate: debate.inherited-guilt
    stance: affirms
    claims: ["wcf.e.adam-conveys-manhood", "wcf.adam#Imputed guilt"]
    summary: Adam's guilt is imputed to all his posterity, and a corrupted nature is conveyed to them.
    citations:
      scripture: { bible: [Rom 5:12, Rom 5:19, 1 Cor 15:22] }
      authority:
        - { source: Westminster Confession of Faith, ref: WCF 6.3, tier: confessional, url: "https://www.opc.org/wcf.html#Chapter_06", quote: "They being the root of all mankind, the guilt of this sin was imputed" }
  - debate: debate.crucifixion
    stance: affirms
    summary: Christ "was crucified, and died".
    citations:
      scripture: { bible: [Phil 2:8] }
      authority:
        - { source: Westminster Confession of Faith, ref: WCF 8.4, tier: confessional, url: "https://www.opc.org/wcf.html#Chapter_08", quote: "was crucified, and died" }
  - debate: debate.bodily-resurrection
    stance: affirms
    claims: ["wcf.son#Resurrection"]
    summary: He arose "with the same body in which he suffered".
    citations:
      scripture: { bible: [John 20:27] }
      authority:
        - { source: Westminster Confession of Faith, ref: WCF 8.4, tier: confessional, url: "https://www.opc.org/wcf.html#Chapter_08", quote: "On the third day he arose from the dead, with the same body in which he suffered" }

# Scripture: the Standards' own proof texts (1647), quoted in the ESV. Confession text: OPC edition.
categories:
  - id: God
    label: God (uncreated)
    group: true
    definition: '"One only, living, and true God ... a most pure spirit, invisible, without body, parts, or passions".'
    citations:
      scripture: { bible: [Deut 6:4, 1 Cor 8:4, John 4:24] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 2.1
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_02
          quote: There is but one only, living, and true God, who is infinite in being and perfection, a most pure spirit, invisible, without body, parts, or passions

  - id: Godhead
    label: Godhead
    parent: God
    definition: The one divine substance in which the three persons are united ("the unity of the Godhead").
    citations:
      scripture: { bible: [Matt 3:16-17, Matt 28:19, 2 Cor 13:14] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 2.3
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_02
          quote: In the unity of the Godhead there be three persons, of one substance, power, and eternity

  - id: DivinePerson
    label: Divine Person
    parent: God
    definition: Father, Son, or Holy Ghost, "distinguished by their personal properties" (begetting, being begotten, proceeding).
    citations:
      scripture: { bible: [Heb 1:5-6, John 1:14, John 15:26, Gal 4:6] }
      authority:
        - source: Westminster Larger Catechism
          ref: WLC 9-10
          tier: confessional
          url: https://thewestminsterstandard.org/westminster-larger-catechism/
          quote: It is proper to the Father to beget the Son, and to the Son to be begotten of the Father, and to the Holy Ghost to proceed from the Father and the Son from all eternity.

  - id: Creature
    label: Creature (made of nothing)
    group: true
    definition: Everything God made "of nothing ... whether visible or invisible".
    citations:
      scripture: { bible: [Acts 17:24, Col 1:16, Heb 11:3] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 4.1
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_04
          quote: to create, or make of nothing, the world, and all things therein whether visible or invisible

  - id: World
    label: The world
    parent: Creature
    definition: '"The world, and all things therein".'
    citations:
      scripture: { bible: [Acts 17:24] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 4.1
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_04

  - id: Manhood
    label: Man's nature (manhood)
    parent: Creature
    definition: 'Human nature "with all the essential properties, and common infirmities thereof": a true body and a reasonable soul.'
    citations:
      scripture: { bible: [Heb 2:14, Heb 4:15] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 8.2
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_08
          quote: take upon him man's nature, with all the essential properties, and common infirmities thereof, yet without sin

  - id: Man
    label: Man (human person)
    parent: Creature
    definition: A human being, created "male and female, with reasonable and immortal souls ... after his own image".
    citations:
      scripture: { bible: [Gen 1:27] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 4.2
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_04
          quote: he created man, male and female, with reasonable and immortal souls

  - id: Soul
    label: Reasonable, immortal soul
    parent: Creature
    definition: The soul, which does not die or sleep but has "an immortal subsistence".
    citations:
      scripture:
        bible:
          - together: [Gen 2:7, Eccl 12:7, Matt 10:28, Luke 23:43]
            note: 'WCF 4.2 cites these as one proof: "Gen. 2:7 with Eccles. 12:7 and Matt. 10:28 and Luke 23:43".'
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 4.2, 32.1
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_32
          quote: their souls, which neither die nor sleep, having an immortal subsistence, immediately return to God who gave them

  - id: Body
    label: Body
    parent: Creature
    definition: The human body, which returns to dust at death and will be raised "with the selfsame bodies".
    citations:
      scripture: { bible: [Job 19:26-27, 1 Cor 15:42-44] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 32.1-2
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_32

relationships:
  - id: is
    label: is
    definition: 'Each person is the one God: "these three are one true, eternal God, the same in substance".'
    domain: [DivinePerson]
    range: [Godhead]
    topics: [wcf2]
    citations:
      scripture: { bible: [Matt 3:16-17, Matt 28:19, 2 Cor 13:14, John 10:30] }
      authority:
        - source: Westminster Larger Catechism
          ref: WLC 9
          tier: confessional
          url: https://thewestminsterstandard.org/westminster-larger-catechism/
          quote: these three are one true, eternal God, the same in substance, equal in power and glory; although distinguished by their personal properties

  - id: begets
    label: begets
    definition: '"The Son is eternally begotten of the Father."'
    domain: [DivinePerson]
    range: [DivinePerson]
    topics: [wcf2]
    citations:
      scripture: { bible: [John 1:14, John 1:18] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 2.3
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_02

  - id: proceedsFrom
    label: proceeds from
    definition: '"The Holy Ghost eternally proceeding from the Father and the Son."'
    domain: [DivinePerson]
    range: [DivinePerson]
    topics: [wcf2]
    citations:
      scripture: { bible: [John 15:26, Gal 4:6] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 2.3
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_02

  - id: takesUpon
    label: takes upon
    definition: 'Incarnation: the Son "did, when the fullness of time was come, take upon him man''s nature".'
    domain: [DivinePerson]
    range: [Manhood]
    topics: [wcf8]
    citations:
      scripture: { bible: [John 1:1, John 1:14, Gal 4:4, Phil 2:6, 1 John 5:20] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 8.2
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_08

  - id: bears
    label: bears
    definition: 'Christ was "conceived ... in the womb of the Virgin Mary, of her substance, and born of her".'
    domain: [Man]
    range: [DivinePerson]
    topics: [wcf8]
    citations:
      scripture: { bible: [Luke 1:27, Luke 1:31, Luke 1:35, Gal 4:4] }
      authority:
        - source: Westminster Larger Catechism
          ref: WLC 37
          tier: confessional
          url: https://thewestminsterstandard.org/westminster-larger-catechism/
          quote: being conceived by the power of the Holy Ghost in the womb of the Virgin Mary, of her substance, and born of her, yet without sin

  - id: overshadows
    label: overshadows
    definition: Christ was "conceived by the power of the Holy Ghost".
    domain: [DivinePerson]
    range: [Man]
    topics: [wcf8]
    citations:
      scripture: { bible: [{ ref: Luke 1:35, highlight: "the power of the Most High will overshadow you" }] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 8.2
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_08

  - id: creates
    label: creates
    definition: Makes "of nothing". The Father, Son, and Holy Ghost together are the Creator.
    domain: [DivinePerson]
    range: [World, Man]
    topics: [wcf4]
    citations:
      scripture: { bible: [Acts 17:24, Col 1:16, Heb 11:3] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 4.1
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_04

  - id: hasPart
    label: has part
    definition: 'Composition: Christ took "a true body, and a reasonable soul".'
    domain: [Manhood, Man]
    range: [Soul, Body]
    topics: [wcf4]
    citations:
      scripture: { bible: [John 1:14, Matt 26:38] }
      authority:
        - source: Westminster Larger Catechism
          ref: WLC 37
          tier: confessional
          url: https://thewestminsterstandard.org/westminster-larger-catechism/
          quote: by taking to himself a true body, and a reasonable soul

  - id: reunitesWith
    label: reunites with
    definition: 'Resurrection: the dead are raised "with the selfsame bodies ... which shall be united again to their souls forever".'
    domain: [Soul]
    range: [Body]
    topics: [wcf32]
    citations:
      scripture: { bible: [Job 19:26-27, 1 Cor 15:42-44] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 32.2
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_32


  - id: formedFrom
    label: formed from
    definition: 'God "formed the body of the man of the dust of the ground, and the woman of the rib of the man".'
    domain: [Man]
    range: [Man]
    topics: [wcf4]
    citations:
      scripture: { bible: [Gen 2:22] }
      authority:
        - source: Westminster Larger Catechism
          ref: WLC 17
          tier: confessional
          url: https://thewestminsterstandard.org/westminster-larger-catechism/

  - id: conveys
    label: conveys
    definition: '"The same death in sin and corrupted nature conveyed to all their posterity descending from them by ordinary generation."'
    domain: [Man]
    range: [Manhood]
    topics: [wcf6]
    citations:
      scripture: { bible: [Gen 5:3, Job 14:4, Ps 51:5] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 6.3
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_06

axioms:
  - id: ax.manhood-has-soul
    source: Manhood
    rel: hasPart
    target: Soul
    quantifier: some
