tradition:
  id: reformed
  name: Presbyterian & Reformed Churches (Westminster Standards)
  shortName: Presbyterian & Reformed
  scripture: { bible: esv, other: esv }
  otherScriptureLabel: Other
  tiers:
    - { id: confessional, label: "Confessional standard (Westminster Confession & Catechisms)" }
    - { id: church-published, label: "Denominational report / publication" }
    - { id: theologian, label: "Reformed theologian (e.g. Calvin, Turretin)" }
  hermeneutic:
    summary: >-
      Scripture interprets Scripture. Unclear passages are read by clearer ones, and the Holy Spirit speaking in
      Scripture is the final judge of all controversies.
    citations:
      scripture: { bible: [Acts 15:15, 2 Pet 1:20-21] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 1.9-10
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_01
          quote: The infallible rule of interpretation of Scripture is the Scripture itself
  allowedDomains: [opc.org, thewestminsterstandard.org, pcaac.org, esv.org]

