  - id: wcf.e.spirit-overshadows
    source: wcf.spirit
    rel: overshadows
    target: wcf.mary
    note: Miraculous conception without human paternity; the Holy Spirit preserved Christ from Mary's sinful corruption by an unrevealed divine mystery, not an explained biological mechanism.
    citations:
      scripture:
        bible:
          - ref: Luke 1:35
            highlight: the power of the Most High will overshadow you
          - Gal 4:4
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 8.2
          tier: confessional
          url: https://www.opc.org/wcf.html
          quote: The Son of God, the second person in the Trinity, being very and eternal God, of one substance and equal with the Father, did, when the fullness of time was come, take upon him man’s nature, with all the essential properties, and common infirmities thereof, yet without sin; being conceived by the power of the Holy Ghost, in the womb of the virgin Mary, of her substance.
        - source: "Question & Answer: The Orthodox Presbyterian Church, Question 531"
          ref: OPC QA 531
          tier: church-published
          url: https://www.opc.org/qa.html?question_id=531
          quote: God does not specify in greater detail than this how the conception of Jesus by-passed Mary’s own sinfulness to preserve Christ’s sinlessness, but the rest of Scripture, as I indicated above, affirms that Christ did not inherit our sin nature.
        - source: "New Horizons: The Virgin Birth (December 2002)"
          ref: New Horizons Dec 2002
          tier: church-published
          url: https://www.opc.org/nh.html?article_id=176
          quote: At his conception, there was somehow a preservation from any taint of sin, from that contamination that would have otherwise proceeded from Mary.

