# Individuals only. Every node is a registered referent.
nodes:
  - id: wcf.father
    label: God the Father
    category: DivinePerson
    referent: ref.father
    description: '"The Father is of none, neither begotten, nor proceeding."'
    citations:
      scripture: { bible: [Matt 3:16-17, Matt 28:19] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 2.3
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_02
          quote: the Father is of none, neither begotten, nor proceeding

  - id: wcf.son
    label: God the Son (Jesus Christ)
    category: DivinePerson
    referent: ref.jesus
    description: '"The second person in the Trinity, being very and eternal God, of one substance and equal with the Father".'
    attributes:
      - name: Natures and person
        topics: [wcf8]
        value: '"Two whole, perfect, and distinct natures, the Godhead and the manhood ... joined together in one person, without conversion, composition, or confusion"'
        citations:
          scripture: { bible: [Luke 1:35, Rom 9:5, Col 2:9, 1 Tim 3:16, 1 Pet 3:18] }
          authority:
            - source: Westminster Confession of Faith
              ref: WCF 8.2
              tier: confessional
              url: https://www.opc.org/wcf.html#Chapter_08
      - name: Resurrection
        topics: [wcf8]
        value: '"On the third day he arose from the dead, with the same body in which he suffered"'
        citations:
          scripture: { bible: [1 Cor 15:3-4, John 20:25, John 20:27] }
          authority:
            - source: Westminster Confession of Faith
              ref: WCF 8.4
              tier: confessional
              url: https://www.opc.org/wcf.html#Chapter_08
      - name: Offices of the Mediator
        value: Ordained in God's eternal purpose to be Mediator between God and man, executing the offices of Prophet, Priest, King, Head and Saviour of his Church, Heir of all things, and Judge of the world (WCF 8.1; WLC 42).
        topics:
          - wcf8
        citations:
          scripture:
            bible:
              - Isa 42:1
              - 1 Pet 1:19-20
              - 1 Tim 2:5
              - Acts 3:22
              - Heb 5:5-6
              - Ps 2:6
              - Eph 5:23
              - Heb 1:2
              - Acts 17:31
          authority:
            - source: Westminster Confession of Faith
              ref: WCF 8.1
              tier: confessional
              url: https://thewestminsterstandard.org/the-westminster-confession/
              quote: It pleased God, in his eternal purpose, to choose and ordain the Lord Jesus, his only-begotten Son, to be the Mediator between God and man...the Prophet...Priest...and King...the Head and Saviour of his Church...the Heir of all things...and Judge of the world
            - source: Westminster Larger Catechism
              ref: WLC 42
              tier: confessional
              url: https://thewestminsterstandard.org/westminster-larger-catechism/
              quote: Our Mediator was called Christ, because he was anointed with the Holy Ghost above measure; and so set apart, and fully furnished with all authority and ability, to execute the offices of prophet, priest, and king of his Church, in the estate both of his humiliation and exaltation.
      - name: Sanctification and spiritual endowments
        value: In his human nature united to the divine, he was sanctified and anointed with the Holy Spirit above measure, possessing all treasures of wisdom and knowledge, being holy, harmless, undefiled, and full of grace and truth (WCF 8.3).
        topics:
          - wcf8
        citations:
          scripture:
            bible:
              - Ps 45:7
              - John 3:34
              - Col 2:3
              - Heb 7:26
              - John 1:14
          authority:
            - source: Westminster Confession of Faith
              ref: WCF 8.3
              tier: confessional
              url: https://thewestminsterstandard.org/the-westminster-confession/
              quote: The Lord Jesus, in his human nature thus united to the divine, was sanctified and anointed with the Holy Spirit above measure...having in him all the treasures of wisdom and knowledge...to the end that, being holy, harmless, undefiled, and full of grace and truth...he might be thoroughly furnished to execute the office of a mediator and surety.
      - name: Federal headship (Second Adam)
        value: The covenant of grace was made with Christ as the second Adam, and in him with all the elect as his seed (WLC 31).
        topics:
          - wcf7
          - wcf8
        citations:
          scripture:
            bible:
              - Gal 3:16
              - Rom 5:15-21
              - Isa 53:10-11
          authority:
            - source: Westminster Larger Catechism
              ref: WLC 31
              tier: confessional
              url: https://thewestminsterstandard.org/westminster-larger-catechism/
              quote: The covenant of grace was made with Christ as the second Adam, and in him with all the elect as his seed.
      - name: Seed of the woman
        value: Revealed and signified from the beginning of the world in promises, types, and sacrifices to be the seed of the woman which should bruise the serpent's head, and the Lamb slain from the beginning of the world (WCF 8.6).
        topics:
          - wcf7
          - wcf8
        citations:
          scripture:
            bible:
              - Gen 3:15
              - Gal 4:4-5
              - Rev 13:8
          authority:
            - source: Westminster Confession of Faith
              ref: WCF 8.6
              tier: confessional
              url: https://thewestminsterstandard.org/the-westminster-confession/
              quote: the virtue, efficacy, and benefits thereof were communicated unto the elect, in all ages successively from the beginning of the world, in and by those promises, types, and sacrifices, wherein he was revealed, and signified to be the seed of the woman which should bruise the serpent’s head, and the Lamb slain from the beginning of the world
      - name: Satisfaction and redemption
        value: By his perfect obedience and sacrifice of himself offered through the eternal Spirit unto God, he fully satisfied divine justice and purchased reconciliation and an everlasting inheritance for the elect (WCF 8.5; WCF 8.8).
        topics:
          - wcf8
        citations:
          scripture:
            bible:
              - Rom 3:25-26
              - Rom 5:19
              - Heb 9:14
              - Eph 1:11
              - Eph 1:14
          authority:
            - source: Westminster Confession of Faith
              ref: WCF 8.5
              tier: confessional
              url: https://thewestminsterstandard.org/the-westminster-confession/
              quote: The Lord Jesus, by his perfect obedience and sacrifice of himself, which he through the eternal Spirit once offered up unto God, hath fully satisfied the justice of his Father...and purchased not only reconciliation, but an everlasting inheritance in the kingdom of heaven, for all those whom the Father hath given unto him.
            - source: Westminster Confession of Faith
              ref: WCF 8.8
              tier: confessional
              url: https://thewestminsterstandard.org/the-westminster-confession/
              quote: To all those for whom Christ hath purchased redemption he doth certainly and effectually apply and communicate the same...making intercession for them...and revealing unto them, in and by the Word, the mysteries of salvation...effectually persuading them by his Spirit to believe and obey; and governing their hearts by his Word and Spirit
      - name: Head of the Church
        value: The Lord Jesus Christ is the sole Head of the Church, and the Pope of Rome cannot in any sense be head thereof (WCF 25.6).
        topics:
          - wcf8
          - wcf25
        citations:
          scripture:
            bible:
              - Col 1:18
              - Eph 1:22
              - Matt 23:8-10
          authority:
            - source: Westminster Confession of Faith
              ref: WCF 25.6
              tier: confessional
              url: https://thewestminsterstandard.org/the-westminster-confession/
              quote: There is no other Head of the Church but the Lord Jesus Christ...nor can the Pope of Rome, in any sense be head thereof
      - name: Unrepresentability
        value: As God incarnate, Christ cannot be represented inwardly in mind or outwardly in any creaturely likeness; all physical representations of him are forbidden under the second commandment, his true portrait being given only in Scripture (WLC 109; OPC QA 133, 417).
        topics:
          - wcf8
          - wcf21
        citations:
          scripture:
            bible:
              - Deut 4:15-19
              - Acts 17:29
              - Rom 1:21-23
              - Rom 1:25
          authority:
            - source: Westminster Larger Catechism
              ref: WLC 109
              tier: confessional
              url: https://thewestminsterstandard.org/westminster-larger-catechism/
              quote: The sins forbidden in the second commandment are...the making any representation of God, of all, or of any of the three Persons, either inwardly in our mind, or outwardly in any kind of image or likeness of any creature whatsoever; all worshiping of it, or God in it or by it
            - source: "Question & Answer: The Orthodox Presbyterian Church, Question 133"
              ref: OPC QA 133
              tier: church-published
              url: https://www.opc.org/qa.html?question_id=133
              quote: Though Jesus was man, yet He is God incarnate in human flesh. And the Second Commandment forbids all material representations of God in worship...So we avoid all physical representations of Christ.
            - source: "Question & Answer: The Orthodox Presbyterian Church, Question 417"
              ref: OPC QA 417
              tier: church-published
              url: https://www.opc.org/qa.html?question_id=417
              quote: The answer to your specific question, then, is that it is not OK “to have images of God or Christ” even though “we do not worship them.” The fact is that the only accurate and reliable “portrait” of Christ is the word portrait that God has given us in the Bible.
      - name: Unrepeatable sacrifice
        value: In the sacrament of the Lord's Supper Christ is not offered up nor is any real sacrifice made; his sacrifice on the cross was offered once for all, and the Roman Mass is abominably injurious to his one only sacrifice, the alone propitiation for the elect (WCF 29.2).
        topics:
          - wcf8
          - wcf29
        citations:
          scripture:
            bible:
              - Heb 9:25-26
              - Heb 9:28
              - Heb 7:27
              - Heb 10:11-12
              - Heb 10:14
          authority:
            - source: Westminster Confession of Faith
              ref: WCF 29.2
              tier: confessional
              url: https://thewestminsterstandard.org/the-westminster-confession/
              quote: In this sacrament Christ is not offered up to his Father, nor any real sacrifice made at all for remission of sins of the quick or dead...so that the Popish sacrifice of the mass, as they call it, is most abominably injurious to Christ’s one only sacrifice, the alone propitiation for all the sins of the elect.
      - name: Exclusive Saviour
        value: There is salvation in none other but in Christ alone, who is the Saviour only of his body the Church; those who never hear the gospel cannot be saved by natural light or other religions (WLC 60).
        topics:
          - wcf8
        citations:
          scripture:
            bible:
              - Rom 10:14
              - Acts 4:12
              - Eph 5:23
          authority:
            - source: Westminster Larger Catechism
              ref: WLC 60
              tier: confessional
              url: https://thewestminsterstandard.org/westminster-larger-catechism/
              quote: They who, having never heard the gospel, know not Jesus Christ, and believe not in him, cannot be saved, be they never so diligent to frame their lives according to the light of nature, or the laws of that religion which they profess; neither is there salvation in any other, but in Christ alone, who is the Saviour only of his body the Church.
    citations:
      scripture: { bible: [John 1:1, John 1:14, 1 John 5:20] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 8.2
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_08
          quote: The Son of God, the second person in the Trinity, being very and eternal God, of one substance and equal with the Father

  - id: wcf.spirit
    label: God the Holy Ghost
    category: DivinePerson
    referent: ref.holy-spirit
    description: Third person of the Godhead, "God equal with the Father".
    citations:
      scripture: { bible: [Acts 5:3-4, 1 Cor 2:10-11, Gen 1:2] }
      authority:
        - source: Westminster Larger Catechism
          ref: WLC 11
          tier: confessional
          url: https://thewestminsterstandard.org/westminster-larger-catechism/
          quote: the Son and the Holy Ghost are God equal with the Father

  - id: wcf.godhead
    label: The Godhead
    category: Godhead
    referent: ref.godhead
    description: The one living and true God, in whom three persons are "of one substance, power, and eternity".
    attributes:
      - name: Body?
        topics: [wcf2]
        value: No; "a most pure spirit, invisible, without body, parts, or passions"
        citations:
          scripture:
            bible:
              - John 4:24
              - together: [John 4:24, Luke 24:39]
                note: 'WCF 2.1 cites "John 4:24 with Luke 24:39": God is spirit, and "a spirit does not have flesh and bones".'
              - Deut 4:15-16
          authority:
            - source: Westminster Confession of Faith
              ref: WCF 2.1
              tier: confessional
              url: https://www.opc.org/wcf.html#Chapter_02
    citations:
      scripture: { bible: [Deut 6:4, Matt 28:19, 2 Cor 13:14] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 2.1, 2.3
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_02
          quote: In the unity of the Godhead there be three persons, of one substance, power, and eternity

  - id: wcf.mary
    label: The virgin Mary
    category: Man
    referent: ref.mary
    description: Christ was conceived "in the womb of the virgin Mary, of her substance".
    citations:
      scripture: { bible: [Luke 1:27, Luke 1:31, Gal 4:4] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 8.2
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_08
    attributes:
      - name: Original sin
        value: Conceived by ordinary generation as a descendant of Adam, inheriting imputed guilt and a corrupted nature, from which Christ alone was exempted by his extraordinary conception.
        topics:
          - wcf6
        citations:
          scripture:
            bible:
              - Rom 5:12
              - Ps 51:5
          authority:
            - source: Westminster Confession of Faith
              ref: WCF 6.3
              tier: confessional
              url: https://www.opc.org/wcf.html
              quote: They being the root of all mankind, the guilt of this sin was imputed; and the same death in sin, and corrupted nature, conveyed to all their posterity descending from them by ordinary generation.
            - source: "Question & Answer: The Orthodox Presbyterian Church, Question 501"
              ref: OPC QA 501
              tier: church-published
              url: https://www.opc.org/qa.html?question_id=501
              quote: we do not believe in the immaculate conception of Mary, the mother of Jesus. We believe that only Jesus Christ was born without sin.
      - name: Fulfillment of Genesis 3:15
        value: A fallen daughter of Adam and Eve who could not save herself, chosen by sovereign grace to be the instrument fulfilling Genesis 3:15 by bearing the conqueror of the serpent.
        topics:
          - wcf7
          - wcf8
        citations:
          scripture:
            bible:
              - Gen 3:15
              - Luke 1:35
              - Luke 1:46-55
          authority:
            - source: "Question & Answer: The Orthodox Presbyterian Church, Question 629"
              ref: OPC QA 629
              tier: church-published
              url: https://www.opc.org/qa.html?question_id=629
              quote: Her blessedness comes not from herself but from the gracious choosing of God for her to be the instrument in his fulfilling Genesis 3:15, sending a conqueror through a woman, since a woman had sinned in eating the forbidden fruit. Many generations of women must have wondered and hoped that they would bear the promised Messiah, but Mary was the one God chose. Mary, like all of humanity descending from Adam and Eve, was in need of a Savior, for she could not save herself or atone for her own sins.
      - name: Immaculate Conception
        value: Rejected; Scripture nowhere teaches that Mary was without sin, and in the Magnificat she explicitly confessed God as her Savior, demonstrating that she needed salvation.
        topics:
          - wcf6
        citations:
          scripture:
            bible:
              - Luke 1:46-47
          authority:
            - source: "Question & Answer: The Orthodox Presbyterian Church, Question 366"
              ref: OPC QA 366
              tier: church-published
              url: https://www.opc.org/qa.html?question_id=366
              quote: ...as Presbyterians, we reject the doctrine of the Immaculate Conception. The Bible nowhere teaches that Mary was without sin...Rather, if you read the Magnificat in Luke 2 you will see that she called God her Savior—thus admitting she needed to be saved from her sin.
            - source: "New Horizons: Jesus and His Mother (December 2002)"
              ref: New Horizons Dec 2002
              tier: church-published
              url: https://www.opc.org/nh.html?article_id=175
              quote: This doctrine was defined by Pope Pius IX in 1854 and teaches that Mary herself, at the first instant of her conception, was preserved immaculate from the stain of original sin...But there is not the slightest support in Scripture for the doctrine of the immaculate conception of Mary...
      - name: Perpetual virginity
        value: The Westminster Standards do not affirm or deny perpetual virginity. While earlier Reformed writers defended it, modern denominational publications reject it as unsupported by Scripture, understanding Matthew 1:25 and passages naming Jesus' brothers as indicating subsequent children in an ordinary marriage.
        topics:
          - wcf8
          - wcf24
        citations:
          scripture:
            bible:
              - Matt 1:25
              - Matt 12:46
              - Matt 13:55
              - Mark 6:2-3
              - John 2:12
              - Acts 1:14
          authority:
            - source: "Question & Answer: The Orthodox Presbyterian Church, Question 566"
              ref: OPC QA 566
              tier: church-published
              url: https://www.opc.org/qa.html?question_id=566
              quote: '"It is true that our standards do not affirm the perpetual virginity of Mary, the mother of our Lord. Neither do the standards deny it: they do not address the question."'
            - source: "Question & Answer: The Orthodox Presbyterian Church, Question 19"
              ref: OPC QA 19
              tier: church-published
              url: https://www.opc.org/qa.html?question_id=19
              quote: The words "But he had no union with her until she gave birth to a son" certainly seem to suggest that after Mary gave birth to Jesus, Joseph did have union with her and that, having given birth to one Child, she gave birth to other children as well.
            - source: "New Horizons: Jesus and His Mother (December 2002)"
              ref: New Horizons Dec 2002
              tier: church-published
              url: https://www.opc.org/nh.html?article_id=175
              quote: The perpetual virginity of Mary is almost certainly not true. There is nothing explicit in Scripture or derived from Scripture by good and necessary reasoning that favors it. The impression one gains from Scripture is decidedly against it.
      - name: Assumption and heavenly titles
        value: Rejected; bodily assumption, enthronement as Queen of Heaven, and titles such as Mediatrix or Co-redemptrix have no scriptural warrant and dishonor Christ as the sole mediator.
        topics:
          - wcf8
          - wcf21
        citations:
          scripture:
            bible:
              - 1 Tim 2:5
              - Heb 2:14-15
              - Heb 7:26
          authority:
            - source: "New Horizons: Jesus and His Mother (December 2002)"
              ref: New Horizons Dec 2002
              tier: church-published
              url: https://www.opc.org/nh.html?article_id=175
              quote: This doctrine teaches that Mary's body was raised from the grave shortly after she died, that her body and soul were reunited, and that she was taken up and enthroned as Queen of Heaven...The problem with all this is that it lacks the sure foundation of the Word of God, and it is highly dishonoring to the person and work of our Lord Jesus Christ, "the only mediator between God and man" (1 Tim. 2:5).
      - name: Veneration and honor
        value: Honored as an exemplary servant of the Lord who trusted God in bearing the Messiah. Religious worship, veneration, hyperdulia, and prayers to her are forbidden, because religious worship belongs to God alone and must not be given to any creature or saint.
        topics:
          - wcf21
        citations:
          scripture:
            bible:
              - Luke 1:35
              - Luke 1:46-55
              - 1 Tim 2:5
              - Rom 1:25
              - Rev 19:10
          authority:
            - source: Westminster Confession of Faith
              ref: WCF 21.2
              tier: confessional
              url: https://thewestminsterstandard.org/the-westminster-confession/
              quote: Religious worship is to be given to God, the Father, Son, and Holy Ghost; and to him alone:...not to angels, saints, or any other creature:...and since the fall, not without a Mediator; nor in the mediation of any other but of Christ alone.
            - source: "Question & Answer: The Orthodox Presbyterian Church, Question 92"
              ref: OPC QA 92
              tier: church-published
              url: https://www.opc.org/qa.html?question_id=92
              quote: ...in the history of the church they have often been used in the interests of exalting Mary beyond Scriptural warrant as an object of devotion, worship, and prayer...Mary was a humble servant of the Lord (by His grace) who was given the unique and amazing privilege of bringing the promised Messiah into the world. He is the Redeemer, He is the Lord, He is the One we must worship...He is the only Mediator between God and men (1 Timothy 2:5).
            - source: "Question & Answer: The Orthodox Presbyterian Church, Question 629"
              ref: OPC QA 629
              tier: church-published
              url: https://www.opc.org/qa.html?question_id=629
              quote: The Reformed faith honors Mary as a woman who trusted God in a very hard thing, laying hold of God’s promise that her child would be the Son of God (Luke 1:35). The Reformed faith honors but does not exalt or look to Mary for blessings beyond what her Son, Jesus Christ, brings to repentant sinners.
      - name: Intercession
        value: Rejected; as a finite creature, Mary cannot hear prayer or search hearts, which is a divine prerogative. Prayer must be made to God alone through Christ's sole mediation; Mary's own witness directs sinners to do whatever Christ commands and pray to him directly.
        topics:
          - wcf21
        citations:
          scripture:
            bible:
              - 1 Tim 2:5
              - John 2:5
              - John 14:14
          authority:
            - source: Westminster Larger Catechism
              ref: WLC 181
              tier: confessional
              url: https://thewestminsterstandard.org/westminster-larger-catechism/
              quote: The sinfulness of man, and his distance from God by reason thereof, being so great, as that we can have no access into his presence without a mediator; and there being none in heaven or earth appointed to, or fit for, that glorious work but Christ alone, we are to pray in no other name but his only.
            - source: Westminster Larger Catechism
              ref: WLC 179
              tier: confessional
              url: https://thewestminsterstandard.org/westminster-larger-catechism/
              quote: God only being able to search the hearts, hear the requests, pardon the sins, and fulfill the desires of all; and only to be believed in, and worshiped with religious worship; prayer, which is a special part thereof, is to be made by all to him alone, and to none other.
            - source: "Question & Answer: The Orthodox Presbyterian Church, Question 566"
              ref: OPC QA 566
              tier: church-published
              url: https://www.opc.org/qa.html?question_id=566
              quote: It is also the case, however, that Calvin decidedly rejects the...erroneous doctrines of the intercession of the saints...which has impact on Mariological matters.
            - source: "New Horizons: Jesus and His Mother (December 2002)"
              ref: New Horizons Dec 2002
              tier: church-published
              url: https://www.opc.org/nh.html?article_id=175

  - id: wcf.world
    label: The world and all things therein
    category: World
    referent: ref.heavens-earth
    attributes:
      - name: Made from
        topics: [wcf4]
        value: Nothing. God made it "of nothing ... in the space of six days; and all very good"
        citations:
          scripture: { bible: [Heb 11:3, Acts 17:24, Col 1:16] }
          authority:
            - source: Westminster Confession of Faith
              ref: WCF 4.1
              tier: confessional
              url: https://www.opc.org/wcf.html#Chapter_04
    citations:
      scripture: { bible: [Gen 1:1] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 4.1
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_04


  - id: wcf.adam
    label: Adam
    category: Man
    referent: ref.adam
    description: The first man, and "a public person, not for himself only, but for his posterity" (WLC 22).
    attributes:
      - name: Covenant of works
        topics: [wcf7]
        value: '"Life was promised to Adam, and in him to his posterity, upon condition of perfect and personal obedience"'
        citations:
          scripture: { bible: [Gal 3:12, Rom 5:12-20, Gen 2:17] }
          authority:
            - source: Westminster Confession of Faith
              ref: WCF 7.2
              tier: confessional
              url: https://www.opc.org/wcf.html#Chapter_07
      - name: Imputed guilt
        topics: [wcf6]
        value: '"They being the root of all mankind, the guilt of this sin was imputed ... to all their posterity"'
        citations:
          scripture:
            bible:
              - together: [Gen 1:27-28, Gen 2:16-17, Acts 17:26, Rom 5:12, Rom 5:15-19, 1 Cor 15:21-22, 1 Cor 15:45, 1 Cor 15:49]
                note: 'WCF 6.3 cites these as one proof: "Gen. 1:27-28 and Gen. 2:16-17 and Acts 17:26 with Rom. 5:12, 15-19 and 1 Cor. 15:21-22, 45, 49".'
          authority:
            - source: Westminster Confession of Faith
              ref: WCF 6.3
              tier: confessional
              url: https://www.opc.org/wcf.html#Chapter_06
      - name: Effect of the Fall
        topics: [wcf6]
        value: '"Wholly defiled in all the faculties and parts of soul and body"'
        citations:
          scripture: { bible: [Gen 6:5, Jer 17:9, Rom 3:10-19] }
          authority:
            - source: Westminster Confession of Faith
              ref: WCF 6.2
              tier: confessional
              url: https://www.opc.org/wcf.html#Chapter_06
    citations:
      scripture: { bible: [Gen 1:27, Gen 2:7] }
      authority:
        - source: Westminster Larger Catechism
          ref: WLC 17, 22
          tier: confessional
          url: https://thewestminsterstandard.org/westminster-larger-catechism/
          quote: The covenant being made with Adam, as a public person, not for himself only, but for his posterity

  - id: wcf.eve
    label: Eve
    category: Man
    referent: ref.eve
    description: One of "our first parents", made "of the rib of the man".
    citations:
      scripture: { bible: [Gen 2:22, Gen 3:13, 2 Cor 11:3] }
      authority:
        - source: Westminster Confession of Faith
          ref: WCF 6.1
          tier: confessional
          url: https://www.opc.org/wcf.html#Chapter_06
          quote: Our first parents, being seduced by the subtlety and temptation of Satan, sinned in eating the forbidden fruit.

edges:
  - id: wcf.e.father-is
    source: wcf.father
    rel: is
    target: wcf.godhead
