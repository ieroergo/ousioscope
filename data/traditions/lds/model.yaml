# Individuals only. Every node is a registered referent.
# Edges point at an individual (`target`) or at a kind (`targetKind` + `quantifier`).
nodes:
  - id: lds.father
    label: Heavenly Father
    category: GodheadMember
    referent: ref.father
    description: God, the Eternal Father. The ultimate object of worship, and a glorified, physical being.
    citations:
      scripture: { bible: [Matt 6:9, Matt 3:17], other: [A of F 1:1] }
      authority:
        - source: 'Topical Guide, "God the Father, Elohim"'
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/god-the-father-elohim?lang=eng
        - source: Topics and Questions, "Godhead" (2023)
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng
          quote: They acknowledge the Father as the ultimate object of their worship

  - id: lds.jesus
    label: Jesus Christ
    category: GodheadMember
    referent: ref.jesus
    description: The Son. A being separate from the Father, "the Firstborn of the Father, the Only Begotten Son in the flesh".
    attributes:
      - name: Premortal identity
        topics: [christ, plan]
        value: Jehovah; "the Great Jehovah of the Old Testament"
        citations:
          scripture: { bible: [Ex 6:3, Ps 83:18, Isa 12:2], other: [{ ref: D&C 110:3-4, highlight: "even the voice of Jehovah" }] }
          authority:
            - source: The Living Christ (2000)
              tier: official-declaration
              url: https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng
              quote: He was the Great Jehovah of the Old Testament, the Messiah of the New.
            - source: Topical Guide, "Jesus Christ, Jehovah"
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/scriptures/tg/jesus-christ-jehovah?lang=eng
      - name: Existence before birth
        topics: [plan]
        value: '"I was in the beginning with the Father"; "His life ... neither began in Bethlehem nor concluded on Calvary"'
        citations:
          scripture: { bible: [John 17:5, John 8:58, John 1:1], other: [D&C 93:21] }
          authority:
            - source: 'Topical Guide, "Jesus Christ, Antemortal Existence of"'
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/scriptures/tg/jesus-christ-antemortal-existence-of?lang=eng
            - source: Doctrine and Covenants
              ref: D&C 93:21
              tier: standard-works
              url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/93?lang=eng&id=p21#p21
              quote: I was in the beginning with the Father, and am the Firstborn
            - source: The Living Christ (2000)
              tier: official-declaration
              url: https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng
      - name: Resurrection
        topics: [resurrection]
        value: >-
          His spirit was reunited with his body in an immortal state, a body of flesh and bones. He was
          "the first person on this earth to be resurrected"
        citations:
          scripture: { bible: [Luke 24:39], other: [D&C 130:22] }
          authority:
            - source: Topics and Questions, "Resurrection" (2023)
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/resurrection?lang=eng
              quote: When the resurrected Lord appeared to His Apostles, He helped them understand that He had a body of flesh and bones.
    citations:
      scripture: { bible: [John 1:3], other: [D&C 130:22] }
      authority:
        - source: The Living Christ (2000)
          tier: official-declaration
          url: https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng
          quote: He was the Firstborn of the Father, the Only Begotten Son in the flesh, the Redeemer of the world.
        - source: Topics and Questions, "Godhead" (2023)
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng

  - id: lds.holy-ghost
    label: Holy Ghost
    category: GodheadMember
    referent: ref.holy-spirit
    description: The third member of the Godhead. A personage of Spirit who bears witness of the Father and the Son, reveals truth, sanctifies the repentant, and serves as the Holy Spirit of Promise.
    attributes:
      - name: Body?
        value: Has not a body of flesh and bones, but is a personage of Spirit (D&C 130:22). As a spirit personage He has size and dimensions and cannot be everywhere present in person, but His influence and power are omnipresent throughout all the works of God and dwell with individuals.
        topics:
          - godhead
        citations:
          scripture:
            bible: none-cited
            other:
              - D&C 130:22
              - 1 Ne 11:11
          authority:
            - source: Doctrine and Covenants
              ref: D&C 130:22
              tier: standard-works
              url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/130?lang=eng
              quote: The Father has a body of flesh and bones as tangible as man’s; the Son also; but the Holy Ghost has not a body of flesh and bones, but is a personage of Spirit. Were it not so, the Holy Ghost could not dwell in us.
            - source: "Doctrines of the Gospel Student Manual, Chapter 5: The Holy Ghost"
              ref: Chapter 5, p. 11-12
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/doctrines-of-the-gospel-student-manual/5-the-holy-ghost?lang=eng
              quote: As a Spirit personage the Holy Ghost has size and dimensions. He does not fill the immensity of space, and cannot be everywhere present in person at the same time.
      - name: Holy Spirit of Promise and First Comforter
        value: The other Comforter promised by Jesus Christ to abide in hearts as the promise of eternal life and celestial glory (D&C 88:3-4). As the First Comforter, He gives peace, teaches, and testifies, distinct from the Second Comforter who is the personal presence of Jesus Christ.
        topics:
          - godhead
        citations:
          scripture:
            bible:
              - John 14:16
              - John 14:26
            other:
              - D&C 88:3-4
          authority:
            - source: Doctrine and Covenants
              ref: D&C 88:3-4
              tier: standard-works
              url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng
              quote: Wherefore, I now send upon you another Comforter, even upon you my friends, that it may abide in your hearts, even the Holy Spirit of promise; which other Comforter is the same that I promised unto my disciples, as is recorded in the testimony of John... This Comforter is the promise which I give unto you of eternal life, even the glory of the celestial kingdom;
            - source: New Testament Teacher Resource Manual, John 13-17
              ref: John 14
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/new-testament-teacher-resource-manual/the-gospel-according-to-saint-john/john-13-17?lang=eng
              quote: The First Comforter is the Holy Ghost, who gives comfort and peace, teaches, testifies, reminds us of the Lord’s teachings, and reproves sinners. The Second Comforter is Jesus Christ, who will one day reveal Himself to those who love and serve Him.
      - name: Sealing of covenants
        value: All covenants, contracts, and performances must be sealed by the Holy Spirit of promise to retain efficacy, virtue, and force in and after the resurrection (D&C 132:7).
        topics:
          - godhead
        citations:
          scripture:
            bible: none-cited
            other:
              - D&C 132:7
          authority:
            - source: Doctrine and Covenants
              ref: D&C 132:7
              tier: standard-works
              url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng
              quote: All covenants, contracts, bonds, obligations, oaths, vows, performances, connections, associations, or expectations, that are not made and entered into and sealed by the Holy Spirit of promise, of him who is anointed, both as well for time and for all eternity... are of no efficacy, virtue, or force in and after the resurrection from the dead
      - name: Distinction from the Light of Christ
        value: The Holy Ghost is a personal being with a spirit body, distinct from the Light of Christ, which is an impersonal divine energy, power, or influence proceeding from God through Christ that fills space and gives light to all things.
        topics:
          - godhead
        citations:
          scripture:
            bible: none-cited
            other:
              - D&C 88:12-13
              - Moro 7:16
          authority:
            - source: Gospel Topics, "Light of Christ"
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/light-of-christ?lang=eng
              quote: The Light of Christ is the divine energy, power, or influence that proceeds from God through Christ and gives life and light to all things... The Light of Christ should not be confused with the Holy Ghost. It is not a personage, as the Holy Ghost is.
      - name: Cleansing agent (fire)
        value: Acts as a cleansing agent to purify and sanctify from all sin those who receive the gift of the Holy Ghost, spoken of scripturally as baptism with fire.
        topics:
          - first-principles
        citations:
          scripture:
            bible:
              - Matt 3:11
            other:
              - 2 Ne 31:17
              - D&C 19:31
          authority:
            - source: Bible Dictionary, "Holy Ghost"
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/scriptures/bd/holy-ghost?lang=eng
              quote: For those who receive this gift, the Holy Ghost acts as a cleansing agent to purify them and sanctify them from all sin. Thus it is often spoken of as “fire”
      - name: Role in creation
        value: During the organization of the earth, the Spirit of God moved (or brooded) upon the face of the waters (Moses 2:2; Abr 4:2), exercising divine care rather than executing physical organization.
        topics:
          - creation
        citations:
          scripture:
            bible: none-cited
            other:
              - Moses 2:2
              - Abr 4:2
          authority:
            - source: Pearl of Great Price
              ref: Moses 2:2
              tier: standard-works
              url: https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/2?lang=eng
              quote: And the earth was without form, and void; and I caused darkness to come up upon the face of the deep; and my Spirit moved upon the face of the water; for I am God.
            - source: Pearl of Great Price
              ref: Abr 4:2
              tier: standard-works
              url: https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng
              quote: and the Spirit of the Gods was brooding upon the face of the waters.
      - name: Gift of the Holy Ghost
        value: There is an essential distinction between the Holy Ghost and the gift of the Holy Ghost. The gift of the Holy Ghost is bestowed through the laying on of hands following baptism, granting the right to the constant companionship of the Spirit.
        topics:
          - first-principles
        citations:
          scripture:
            bible: none-cited
            other:
              - A of F 1:4
          authority:
            - source: Articles of Faith
              ref: A of F 1:4
              tier: standard-works
              url: https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng
              quote: "We believe that the first principles and ordinances of the Gospel are: first, Faith in the Lord Jesus Christ; second, Repentance; third, Baptism by immersion for the remission of sins; fourth, Laying on of hands for the gift of the Holy Ghost."
            - source: "Gospel Principles, Chapter 21: The Gift of the Holy Ghost"
              ref: Chapter 21
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/gospel-principles/chapter-21-the-gift-of-the-holy-ghost?lang=eng
              quote: There is a difference between the Holy Ghost and the gift of the Holy Ghost. In this chapter we will learn what the gift of the Holy Ghost is and how we can receive this great gift from God.
    citations:
      scripture:
        bible:
          - Matt 28:19
          - John 14:26
        other:
          - A of F 1:1
          - D&C 130:22
      authority:
        - source: Guide to the Scriptures, "Holy Ghost"
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/gs/holy-ghost?lang=eng
          quote: The Holy Ghost performs several vital roles in the plan of salvation. (1) He bears witness of the Father and the Son... (2) He reveals the truth of all things... (3) He sanctifies those who have repented and become baptized... (4) He is the Holy Spirit of Promise
        - source: Topics and Questions, "Godhead" (2023)
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng
          quote: From the Prophet’s account of the First Vision and from his other teachings, we know that the members of the Godhead are three separate beings. The Father and the Son have tangible bodies of flesh and bones, and the Holy Ghost is a personage of spirit.

  - id: lds.godhead
    label: The Godhead
    category: Godhead
    referent: ref.godhead
    description: Three separate beings, "one in purpose and doctrine".
    citations:
      scripture: { bible: [Matt 28:19, John 10:30], other: [A of F 1:1, JS-H 1:17] }
      authority:
        - source: 'Topical Guide, "Godhead"'
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/godhead?lang=eng
        - source: Topics and Questions, "Godhead" (2023)
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng
          quote: we know that the members of the Godhead are three separate beings

  - id: lds.mary
    label: Mary
    category: ChildOfGod
    referent: ref.mary
    description: A virgin, "a precious and chosen vessel".
    attributes:
      - name: Title
        topics: [christ]
        value: '"The mother of the Son of God, after the manner of the flesh"'
        citations:
          scripture: { bible: [{ ref: Luke 1:34-35, highlight: "the power of the Highest shall overshadow thee" }, Matt 1:16], other: [1 Ne 11:18] }
          authority:
            - source: Book of Mormon
              ref: 1 Ne 11:18
              tier: standard-works
              url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/11?lang=eng&id=p18#p18
      - name: Children with Joseph
        value: Following the birth of Jesus Christ, Mary had other children; from Matthew 13:55-56 it appears she and Joseph had at least six children together, including four sons (James, Joses, Simon, and Judas) and more than one daughter.
        topics:
          - christ
        citations:
          scripture:
            bible:
              - Mark 6:3
              - Matt 13:55-56
              - Gal 1:19
          authority:
            - source: Guide to the Scriptures, "Mary, Mother of Jesus"
              ref: Mary, Mother of Jesus
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/scriptures/gs/mary-mother-of-jesus?lang=eng
              quote: In the New Testament, a virgin chosen by God the Father to be the mother of His Son in the flesh. After Jesus’ birth, Mary had other children ( Mark 6:3 ).
            - source: "New Testament Student Manual, Chapter 5: Matthew 13–15"
              ref: Matthew 13:55–56
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-matthew/chapter-5?lang=eng
              quote: "Matthew 13:55–56 provides the most detailed list in the four Gospels of Jesus Christ’s family members. From these verses it appears that following the birth of Jesus Christ, Joseph and Mary had at least six children: James, Joses, Simon, Judas, and more than one daughter."
      - name: Lineage
        value: Mary was of Davidic descent; because Jesus was not begotten by Joseph, the blood of King David's posterity was given to the body of Jesus through Mary alone.
        topics:
          - christ
        citations:
          scripture:
            bible:
              - Rom 1:3
              - Acts 2:30
              - 2 Tim 2:8
              - Luke 1:32
          authority:
            - source: Jesus the Christ
              ref: Chapter 7, paragraph 25
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-7?lang=eng
              quote: That Mary was of Davidic descent is plainly set forth in many scriptures; for since Jesus was to be born of Mary, yet was not begotten by Joseph, who was the reputed, and according to the law of the Jews, the legal, father, the blood of David’s posterity was given to the body of Jesus through Mary alone.
      - name: Later years
        value: There is no trustworthy history of her later years; Latter-day revelation confirms the biblical account and affirms that Mary was a pure and chosen vessel and the mother of the Son of God in the flesh, while non-biblical traditions are not accepted as trustworthy history.
        topics:
          - christ
          - scripture
        citations:
          scripture:
            bible: none-cited
            other:
              - 1 Ne 11:13-20
              - Mosiah 3:8
              - Alma 7:10
          authority:
            - source: Bible Dictionary, "Mary"
              ref: Entry Mary
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/scriptures/bd/mary?lang=eng
              quote: There is no trustworthy history of her later years. Latter-day revelation confirms the biblical account and affirms that Mary was a pure and a chosen vessel and the mother of the Son of God in the flesh ( 1 Ne. 11:13–20 ; Mosiah 3:8 ; Alma 7:10 ).
      - name: Premortal foreordination
        value: Noble and great in the premortal existence and foreordained to her ministry as the mortal mother of the Son of God. Elder Bruce R. McConkie deduced that she was the greatest female spirit, though this deduction is not canonized doctrine.
        topics:
          - plan
          - christ
        citations:
          scripture:
            bible:
              - Luke 1:28
            other:
              - 1 Ne 11:15
              - 1 Ne 11:18
              - Mosiah 3:8
              - Alma 7:10
          authority:
            - source: Ensign (Jan 2019), "Mary, the Mother of Jesus"
              ref: quoting Bruce R. McConkie, The Mortal Messiah
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/ensign/2019/01/mary-the-mother-of-jesus?lang=eng
              quote: "Elder Bruce R. McConkie (1915–85) of the Quorum of the Twelve Apostles has written: “Can we speak too highly of her whom the Lord has blessed above all women? There was only one Christ, and there is only one Mary. Each was noble and great in [the premortal existence], and each was foreordained to the ministry he or she performed. We cannot but think that the Father would choose the greatest female spirit to be the mother of his Son, even as he chose the male spirit like unto him to be the Savior. … We should … hold up Mary with that proper esteem which is hers.”"
    citations:
      scripture: { bible: [Isa 7:14, Luke 1:27], other: [Alma 7:10, Mosiah 3:8] }
      authority:
        - source: Book of Mormon
          ref: Alma 7:10
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/7?lang=eng&id=p10#p10
          quote: he shall be born of Mary ... she being a virgin, a precious and chosen vessel

  - id: lds.heavens-earth
    label: The heavens and the earth
    category: World
    referent: ref.heavens-earth
    description: Scripture says there are "worlds without number", each organized by the Son. This is the one described in detail.
    citations:
      scripture: { bible: [Gen 1:1], other: [Abr 4:1, Moses 1:33] }
      authority:
        - source: Pearl of Great Price
          ref: Abr 4:1
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng&id=p1#p1
          quote: they, that is the Gods, organized and formed the heavens and the earth
        - source: Pearl of Great Price
          ref: Moses 1:33
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng&id=p33#p33
          quote: worlds without number have I created ... and by the Son I created them, which is mine Only Begotten


  - id: lds.adam
    label: Adam (Michael)
    category: ChildOfGod
    referent: ref.adam
    description: The first man, "the father of all". Known before mortality as Michael, the archangel.
    attributes:
      - name: Premortal identity
        topics: [christ, plan]
        value: Michael, "the prince, the archangel"; "the ancient of days"
        citations:
          scripture: { bible: [Dan 7:9, Dan 10:13, Jude 1:9, Rev 12:7], other: [D&C 27:11, D&C 107:54] }
          authority:
            - source: Doctrine and Covenants
              ref: D&C 107:54
              tier: standard-works
              url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng&id=p54#p54
              quote: they rose up and blessed Adam, and called him Michael, the prince, the archangel
            - source: 'Topical Guide, "Adam"'
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/scriptures/tg/adam?lang=eng
      - name: The Fall
        topics: [fall]
        value: '"Adam fell that men might be; and men are, that they might have joy". Part of Heavenly Father''s plan'
        citations:
          scripture: { bible: [Gen 2:17, Gen 3:6, Rom 5:12], other: [{ ref: 2 Ne 2:25, highlight: "Adam fell that men might be" }] }
          authority:
            - source: Topics and Questions, "Fall of Adam and Eve"
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/fall-of-adam-and-eve?lang=eng
              quote: The Fall is an integral part of Heavenly Father's plan of salvation. It has a twofold direction—downward yet forward.
            - source: 'Topical Guide, "Fall of Man"'
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/scriptures/tg/fall-of-man?lang=eng
      - name: What descendants inherit
        topics: [fall]
        value: A fallen condition during mortality, not Adam's guilt
        citations:
          scripture: { bible: [Rom 5:12], other: [{ ref: A of F 1:2, highlight: "men will be punished for their own sins, and not for Adam's transgression" }] }
          authority:
            - source: Topics and Questions, "Fall of Adam and Eve"
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/fall-of-adam-and-eve?lang=eng
              quote: As descendants of Adam and Eve, we inherit a fallen condition during mortality.
            - source: Articles of Faith
              ref: A of F 1:2
              tier: standard-works
              quote: We believe that men will be punished for their own sins, and not for Adam's transgression.
      - name: Witness of the Holy Ghost
        value: The Holy Ghost fell upon Adam, bearing record of the Father and the Son, proclaiming redemption through the Only Begotten by divine investiture of authority (Moses 5:9).
        topics:
          - plan
        citations:
          scripture:
            bible: none-cited
            other:
              - Moses 5:9
          authority:
            - source: Pearl of Great Price
              ref: Moses 5:9
              tier: standard-works
              url: https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng
              quote: "And in that day the Holy Ghost fell upon Adam, which beareth record of the Father and the Son, saying: I am the Only Begotten of the Father from the beginning, henceforth and forever, that as thou hast fallen thou mayest be redeemed, and all mankind, even as many as will."
      - name: Baptism of fire and the Holy Ghost
        value: Adam was caught away by the Spirit, born of the Spirit, quickened in the inner man, and baptized with fire and with the Holy Ghost as the record of the Father and the Son (Moses 6:65-66).
        topics:
          - first-principles
        citations:
          scripture:
            bible: none-cited
            other:
              - Moses 6:65-66
          authority:
            - source: Pearl of Great Price
              ref: Moses 6:65-66
              tier: standard-works
              url: https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng
              quote: And thus he was baptized, and the Spirit of God descended upon him, and thus he was born of the Spirit, and became quickened in the inner man... Thou art baptized with fire, and with the Holy Ghost. This is the record of the Father, and the Son, from henceforth and forever;
    citations:
      scripture: { bible: [Gen 1:26, Gen 2:7, Luke 3:38], other: [D&C 27:11] }
      authority:
        - source: 'Topical Guide, "Adam"'
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/adam?lang=eng

  - id: lds.eve
    label: Eve
    category: ChildOfGod
    referent: ref.eve
    description: The first woman, who rejoiced in the blessings of the Fall.
    attributes:
      - name: Her view of the transgression
        topics: [fall]
        value: '"Were it not for our transgression we never should have had seed, and never should have known good and evil"'
        citations:
          scripture: { bible: [Gen 3:6, Gen 3:7], other: [{ ref: Moses 5:11, highlight: "Were it not for our transgression we never should have had seed" }] }
          authority:
            - source: Topics and Questions, "Fall of Adam and Eve"
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/fall-of-adam-and-eve?lang=eng
              quote: Adam and Eve expressed their gratitude for the blessings that came as a result of the Fall
    citations:
      scripture: { bible: [Gen 2:22, Gen 3:20], other: [Moses 4:26] }
      authority:
        - source: Topics and Questions, "Fall of Adam and Eve"
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/fall-of-adam-and-eve?lang=eng

edges:
  - id: lds.e.godhead-father
    source: lds.godhead
    rel: comprises
    target: lds.father
    citations: &godhead-cite
      scripture: { bible: [Matt 28:19], other: [A of F 1:1] }
      authority:
        - source: 'Topical Guide, "Godhead"'
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/godhead?lang=eng
