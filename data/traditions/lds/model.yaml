# Individuals only. Every node is a registered referent.
# Edges point at an individual (`target`) or at a kind (`targetKind` + `quantifier`).
nodes:
  - id: lds.father
    label: Heavenly Father
    category: GodheadMember
    referent: ref.father
    description: God, the Eternal Father. The ultimate object of worship, and a glorified, physical being.
    citations:
      scripture: { bible: [Matt 6:9, Matt 3:17], other: [A of F 1:1] }
      authority:
        - source: 'Topical Guide, "God the Father, Elohim"'
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/god-the-father-elohim?lang=eng
        - source: Topics and Questions, "Godhead" (2023)
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng
          quote: They acknowledge the Father as the ultimate object of their worship

  - id: lds.jesus
    label: Jesus Christ
    category: GodheadMember
    referent: ref.jesus
    description: The Son. A being separate from the Father, "the Firstborn of the Father, the Only Begotten Son in the flesh".
    attributes:
      - name: Premortal identity
        topics: [christ, plan]
        value: Jehovah; "the Great Jehovah of the Old Testament"
        citations:
          scripture: { bible: [Ex 6:3, Ps 83:18, Isa 12:2], other: [{ ref: D&C 110:3-4, highlight: "even the voice of Jehovah" }] }
          authority:
            - source: The Living Christ (2000)
              tier: official-declaration
              url: https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng
              quote: He was the Great Jehovah of the Old Testament, the Messiah of the New.
            - source: Topical Guide, "Jesus Christ, Jehovah"
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/scriptures/tg/jesus-christ-jehovah?lang=eng
      - name: Existence before birth
        topics: [plan]
        value: '"I was in the beginning with the Father"; "His life ... neither began in Bethlehem nor concluded on Calvary"'
        citations:
          scripture: { bible: [John 17:5, John 8:58, John 1:1], other: [D&C 93:21] }
          authority:
            - source: 'Topical Guide, "Jesus Christ, Antemortal Existence of"'
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/scriptures/tg/jesus-christ-antemortal-existence-of?lang=eng
            - source: Doctrine and Covenants
              ref: D&C 93:21
              tier: standard-works
              url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/93?lang=eng&id=p21#p21
              quote: I was in the beginning with the Father, and am the Firstborn
            - source: The Living Christ (2000)
              tier: official-declaration
              url: https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng
      - name: Resurrection
        topics: [resurrection]
        value: >-
          His spirit was reunited with his body in an immortal state, a body of flesh and bones. He was
          "the first person on this earth to be resurrected"
        citations:
          scripture: { bible: [Luke 24:39], other: [D&C 130:22] }
          authority:
            - source: Topics and Questions, "Resurrection" (2023)
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/resurrection?lang=eng
              quote: When the resurrected Lord appeared to His Apostles, He helped them understand that He had a body of flesh and bones.
    citations:
      scripture: { bible: [John 1:3], other: [D&C 130:22] }
      authority:
        - source: The Living Christ (2000)
          tier: official-declaration
          url: https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng
          quote: He was the Firstborn of the Father, the Only Begotten Son in the flesh, the Redeemer of the world.
        - source: Topics and Questions, "Godhead" (2023)
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng

  - id: lds.holy-ghost
    label: Holy Ghost
    category: GodheadMember
    referent: ref.holy-spirit
    description: The third member of the Godhead. A personage of spirit, and the messenger and revealer of the Father and the Son.
    attributes:
      - name: Body?
        topics: [godhead]
        value: No body of flesh and bones; "a personage of Spirit"
        citations:
          scripture: { bible: none-cited, other: [D&C 130:22] }
          authority:
            - source: Doctrine and Covenants
              ref: D&C 130:22
              tier: standard-works
              url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/130?lang=eng&id=p22#p22
              quote: the Holy Ghost has not a body of flesh and bones, but is a personage of Spirit
    citations:
      scripture: { bible: [Matt 28:19, John 14:26], other: [A of F 1:1, D&C 130:22] }
      authority:
        - source: 'Topical Guide, "Holy Ghost"'
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/holy-ghost?lang=eng
        - source: Topics and Questions, "Godhead" (2023)
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng
          quote: the Holy Spirit as the messenger and revealer of the Father and the Son

  - id: lds.godhead
    label: The Godhead
    category: Godhead
    referent: ref.godhead
    description: Three separate beings, "one in purpose and doctrine".
    citations:
      scripture: { bible: [Matt 28:19, John 10:30], other: [A of F 1:1, JS-H 1:17] }
      authority:
        - source: 'Topical Guide, "Godhead"'
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/godhead?lang=eng
        - source: Topics and Questions, "Godhead" (2023)
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng
          quote: we know that the members of the Godhead are three separate beings

  - id: lds.mary
    label: Mary
    category: ChildOfGod
    referent: ref.mary
    description: A virgin, "a precious and chosen vessel".
    attributes:
      - name: Title
        topics: [christ]
        value: '"The mother of the Son of God, after the manner of the flesh"'
        citations:
          scripture: { bible: [{ ref: Luke 1:34-35, highlight: "the power of the Highest shall overshadow thee" }, Matt 1:16], other: [1 Ne 11:18] }
          authority:
            - source: Book of Mormon
              ref: 1 Ne 11:18
              tier: standard-works
              url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/11?lang=eng&id=p18#p18
      - name: Children with Joseph
        value: Following the birth of Jesus Christ, Mary had other children; from Matthew 13:55-56 it appears she and Joseph had at least six children together, including four sons (James, Joses, Simon, and Judas) and more than one daughter.
        topics:
          - christ
        citations:
          scripture:
            bible:
              - Mark 6:3
              - Matt 13:55-56
              - Gal 1:19
          authority:
            - source: Guide to the Scriptures, "Mary, Mother of Jesus"
              ref: Mary, Mother of Jesus
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/scriptures/gs/mary-mother-of-jesus?lang=eng
              quote: In the New Testament, a virgin chosen by God the Father to be the mother of His Son in the flesh. After Jesus’ birth, Mary had other children ( Mark 6:3 ).
            - source: "New Testament Student Manual, Chapter 5: Matthew 13–15"
              ref: Matthew 13:55–56
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-matthew/chapter-5?lang=eng
              quote: "Matthew 13:55–56 provides the most detailed list in the four Gospels of Jesus Christ’s family members. From these verses it appears that following the birth of Jesus Christ, Joseph and Mary had at least six children: James, Joses, Simon, Judas, and more than one daughter."
      - name: Lineage
        value: Mary was of Davidic descent; because Jesus was not begotten by Joseph, the blood of King David's posterity was given to the body of Jesus through Mary alone.
        topics:
          - christ
        citations:
          scripture:
            bible:
              - Rom 1:3
              - Acts 2:30
              - 2 Tim 2:8
              - Luke 1:32
          authority:
            - source: Jesus the Christ
              ref: Chapter 7, paragraph 25
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-7?lang=eng
              quote: That Mary was of Davidic descent is plainly set forth in many scriptures; for since Jesus was to be born of Mary, yet was not begotten by Joseph, who was the reputed, and according to the law of the Jews, the legal, father, the blood of David’s posterity was given to the body of Jesus through Mary alone.
      - name: Later years
        value: There is no trustworthy history of her later years; Latter-day revelation confirms the biblical account and affirms that Mary was a pure and chosen vessel and the mother of the Son of God in the flesh, while non-biblical traditions are not accepted as trustworthy history.
        topics:
          - christ
          - scripture
        citations:
          scripture:
            bible: none-cited
            other:
              - 1 Ne 11:13-20
              - Mosiah 3:8
              - Alma 7:10
          authority:
            - source: Bible Dictionary, "Mary"
              ref: Entry Mary
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/scriptures/bd/mary?lang=eng
              quote: There is no trustworthy history of her later years. Latter-day revelation confirms the biblical account and affirms that Mary was a pure and a chosen vessel and the mother of the Son of God in the flesh ( 1 Ne. 11:13–20 ; Mosiah 3:8 ; Alma 7:10 ).
      - name: Premortal foreordination
        value: Noble and great in the premortal existence and foreordained to her ministry as the mortal mother of the Son of God. Elder Bruce R. McConkie deduced that she was the greatest female spirit, though this deduction is not canonized doctrine.
        topics:
          - plan
          - christ
        citations:
          scripture:
            bible:
              - Luke 1:28
            other:
              - 1 Ne 11:15
              - 1 Ne 11:18
              - Mosiah 3:8
              - Alma 7:10
          authority:
            - source: Ensign (Jan 2019), "Mary, the Mother of Jesus"
              ref: quoting Bruce R. McConkie, The Mortal Messiah
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/ensign/2019/01/mary-the-mother-of-jesus?lang=eng
              quote: "Elder Bruce R. McConkie (1915–85) of the Quorum of the Twelve Apostles has written: “Can we speak too highly of her whom the Lord has blessed above all women? There was only one Christ, and there is only one Mary. Each was noble and great in [the premortal existence], and each was foreordained to the ministry he or she performed. We cannot but think that the Father would choose the greatest female spirit to be the mother of his Son, even as he chose the male spirit like unto him to be the Savior. … We should … hold up Mary with that proper esteem which is hers.”"
    citations:
      scripture: { bible: [Isa 7:14, Luke 1:27], other: [Alma 7:10, Mosiah 3:8] }
      authority:
        - source: Book of Mormon
          ref: Alma 7:10
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/7?lang=eng&id=p10#p10
          quote: he shall be born of Mary ... she being a virgin, a precious and chosen vessel

  - id: lds.heavens-earth
    label: The heavens and the earth
    category: World
    referent: ref.heavens-earth
    description: Scripture says there are "worlds without number", each organized by the Son. This is the one described in detail.
    citations:
      scripture: { bible: [Gen 1:1], other: [Abr 4:1, Moses 1:33] }
      authority:
        - source: Pearl of Great Price
          ref: Abr 4:1
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng&id=p1#p1
          quote: they, that is the Gods, organized and formed the heavens and the earth
        - source: Pearl of Great Price
          ref: Moses 1:33
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng&id=p33#p33
          quote: worlds without number have I created ... and by the Son I created them, which is mine Only Begotten


  - id: lds.adam
    label: Adam (Michael)
    category: ChildOfGod
    referent: ref.adam
    description: The first man, "the father of all". Known before mortality as Michael, the archangel.
    attributes:
      - name: Premortal identity
        topics: [christ, plan]
        value: Michael, "the prince, the archangel"; "the ancient of days"
        citations:
          scripture: { bible: [Dan 7:9, Dan 10:13, Jude 1:9, Rev 12:7], other: [D&C 27:11, D&C 107:54] }
          authority:
            - source: Doctrine and Covenants
              ref: D&C 107:54
              tier: standard-works
              url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng&id=p54#p54
              quote: they rose up and blessed Adam, and called him Michael, the prince, the archangel
            - source: 'Topical Guide, "Adam"'
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/scriptures/tg/adam?lang=eng
      - name: The Fall
        topics: [fall]
        value: '"Adam fell that men might be; and men are, that they might have joy". Part of Heavenly Father''s plan'
        citations:
          scripture: { bible: [Gen 2:17, Gen 3:6, Rom 5:12], other: [{ ref: 2 Ne 2:25, highlight: "Adam fell that men might be" }] }
          authority:
            - source: Topics and Questions, "Fall of Adam and Eve"
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/fall-of-adam-and-eve?lang=eng
              quote: The Fall is an integral part of Heavenly Father's plan of salvation. It has a twofold direction—downward yet forward.
            - source: 'Topical Guide, "Fall of Man"'
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/scriptures/tg/fall-of-man?lang=eng
      - name: What descendants inherit
        topics: [fall]
        value: A fallen condition during mortality, not Adam's guilt
        citations:
          scripture: { bible: [Rom 5:12], other: [{ ref: A of F 1:2, highlight: "men will be punished for their own sins, and not for Adam's transgression" }] }
          authority:
            - source: Topics and Questions, "Fall of Adam and Eve"
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/fall-of-adam-and-eve?lang=eng
              quote: As descendants of Adam and Eve, we inherit a fallen condition during mortality.
            - source: Articles of Faith
              ref: A of F 1:2
              tier: standard-works
              quote: We believe that men will be punished for their own sins, and not for Adam's transgression.
    citations:
      scripture: { bible: [Gen 1:26, Gen 2:7, Luke 3:38], other: [D&C 27:11] }
      authority:
        - source: 'Topical Guide, "Adam"'
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/adam?lang=eng

  - id: lds.eve
    label: Eve
    category: ChildOfGod
    referent: ref.eve
    description: The first woman, who rejoiced in the blessings of the Fall.
    attributes:
      - name: Her view of the transgression
        topics: [fall]
        value: '"Were it not for our transgression we never should have had seed, and never should have known good and evil"'
        citations:
          scripture: { bible: [Gen 3:6, Gen 3:7], other: [{ ref: Moses 5:11, highlight: "Were it not for our transgression we never should have had seed" }] }
          authority:
            - source: Topics and Questions, "Fall of Adam and Eve"
              tier: church-published
              url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/fall-of-adam-and-eve?lang=eng
              quote: Adam and Eve expressed their gratitude for the blessings that came as a result of the Fall
    citations:
      scripture: { bible: [Gen 2:22, Gen 3:20], other: [Moses 4:26] }
      authority:
        - source: Topics and Questions, "Fall of Adam and Eve"
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/fall-of-adam-and-eve?lang=eng

edges:
  - id: lds.e.godhead-father
    source: lds.godhead
    rel: comprises
    target: lds.father
    citations: &godhead-cite
      scripture: { bible: [Matt 28:19], other: [A of F 1:1] }
      authority:
        - source: 'Topical Guide, "Godhead"'
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/godhead?lang=eng
        - source: Topics and Questions, "Godhead" (2023)
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng
          quote: These three beings make up the Godhead.

  - id: lds.e.godhead-jesus
    source: lds.godhead
    rel: comprises
    target: lds.jesus
    citations: *godhead-cite

  - id: lds.e.godhead-holy-ghost
    source: lds.godhead
    rel: comprises
    target: lds.holy-ghost
    citations: *godhead-cite

  - id: lds.e.father-has-body
    source: lds.father
    rel: hasPart
    targetKind: PhysicalBody
    quantifier: some
    note: '"A body of flesh and bones as tangible as man''s"'
    citations:
      scripture: { bible: [John 14:9, Acts 17:28, Heb 1:3], other: [D&C 130:22] }
      authority:
        - source: Doctrine and Covenants
          ref: D&C 130:22
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/130?lang=eng&id=p22#p22
          quote: The Father has a body of flesh and bones as tangible as man's

  - id: lds.e.father-begets-jesus-spirit
    source: lds.father
    rel: begets
    topics: [godhead, christ]
    target: lds.jesus
    asTo: SpiritBody
    note: '"The Firstborn of the Father", before the world was.'
    citations:
      scripture: { bible: [Col 1:15, Rom 8:29, Heb 1:6], other: [D&C 93:21] }
      authority:
        - source: The Living Christ (2000)
          tier: official-declaration
          url: https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng
          quote: He was the Firstborn of the Father
        - source: Topical Guide, "Jesus Christ, Firstborn"
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/jesus-christ-firstborn?lang=eng

  - id: lds.e.father-begets-jesus-flesh
    source: lds.father
    rel: begets
    topics: [godhead, christ]
    target: lds.jesus
    asTo: PhysicalBody
    note: '"The Only Begotten Son in the flesh."'
    citations:
      scripture: { bible: [Luke 1:32, { ref: Luke 1:35, highlight: "shall be called the Son of God" }], other: [D&C 76:23, Moses 1:33, 1 Ne 11:21] }
      authority:
        - source: 'Topical Guide, "Jesus Christ, Divine Sonship"'
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/jesus-christ-divine-sonship?lang=eng
        - source: The Living Christ (2000)
          tier: official-declaration
          url: https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng
          quote: the Only Begotten Son in the flesh

  - id: lds.e.mary-bears-jesus
    source: lds.mary
    rel: bears
    target: lds.jesus
    asTo: PhysicalBody
    note: '"The mother of the Son of God, after the manner of the flesh" (1 Ne 11:18). From his mortal mother Mary, Jesus inherited mortality and subjection to hunger, thirst, fatigue, pain, and death.'
    citations:
      scripture:
        bible:
          - together:
              - Isa 7:14
              - Luke 1:27
            note: The footnote to "born" in Alma 7:10 pairs Isaiah's prophecy with Luke's account of its fulfillment.
          - Matt 1:16
          - John 10:17-18
        other:
          - Alma 7:10
          - 1 Ne 11:18
          - Mosiah 3:8
      authority:
        - source: Book of Mormon
          ref: Alma 7:10
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/7?lang=eng
          quote: And behold, he shall be born of Mary, at Jerusalem which is the land of our forefathers, she being a virgin, a precious and chosen vessel, who shall be overshadowed and conceive by the power of the Holy Ghost, and bring forth a son, yea, even the Son of God.
        - source: Book of Mormon
          ref: 1 Ne 11:18
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/11?lang=eng
          quote: "And he said unto me: Behold, the virgin whom thou seest is the mother of the Son of God, after the manner of the flesh."
        - source: Gospel Principles
          ref: "Chapter 11: The Life of Christ, paragraph 19"
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-principles/chapter-11-the-life-of-christ?lang=eng
          quote: Jesus is the only person on earth to be born of a mortal mother and an immortal Father. That is why He is called the Only Begotten Son. He inherited divine powers from His Father. From His mother He inherited mortality and was subject to hunger, thirst, fatigue, pain, and death.

  - id: lds.e.holy-ghost-overshadows-mary
    source: lds.holy-ghost
    rel: overshadows
    target: lds.mary
    citations:
      scripture: { bible: [{ ref: Luke 1:34-35, highlight: "the power of the Highest shall overshadow thee" }, Matt 1:20], other: [Alma 7:10, 1 Ne 11:19] }
      authority:
        - source: Book of Mormon
          ref: Alma 7:10
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/7?lang=eng&id=p10#p10
          quote: who shall be overshadowed and conceive by the power of the Holy Ghost

  - id: lds.e.jesus-has-spirit
    source: lds.jesus
    rel: hasPart
    targetKind: SpiritBody
    quantifier: some
    citations:
      scripture: { bible: [Gen 2:7, Ezek 37:14], other: [D&C 88:15, D&C 93:21, D&C 93:23] }
      authority:
        - source: Doctrine and Covenants
          ref: D&C 88:15
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng&id=p15#p15
          quote: And the spirit and the body are the soul of man.

  - id: lds.e.jesus-has-body
    source: lds.jesus
    rel: hasPart
    targetKind: PhysicalBody
    quantifier: some
    note: '"Made flesh my tabernacle" (D&C 93:4); now resurrected, of flesh and bones (D&C 130:22).'
    citations:
      scripture: { bible: [Luke 24:39], other: [D&C 93:4, D&C 130:22, Alma 7:8] }
      authority:
        - source: Doctrine and Covenants
          ref: D&C 130:22
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/130?lang=eng&id=p22#p22
          quote: The Father has a body of flesh and bones as tangible as man's; the Son also

  - id: lds.e.father-directs-jesus
    source: lds.father
    rel: directs
    target: lds.jesus
    note: In creation. "By the Son I created them" (Moses 1:33).
    citations:
      scripture: { bible: [John 1:3, Heb 1:2], other: [Moses 1:33] }
      authority:
        - source: The Living Christ (2000)
          tier: official-declaration
          url: https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng
          quote: Under the direction of His Father, He was the creator of the earth.

  - id: lds.e.jesus-organizes-earth
    source: lds.jesus
    rel: organizes
    target: lds.heavens-earth
    note: >-
      Abraham 3:24 has "one ... like unto God" say "we will make an earth". The scripture footnotes tie
      this to Jesus Christ as Creator (TG "Jesus Christ, Creator"). Abraham 4 says "the Gods" organized.
    citations:
      scripture: { bible: [John 1:3, Gen 1:1], other: [Abr 3:24, Abr 4:1, Moses 1:33] }
      authority:
        - source: The Living Christ (2000)
          tier: official-declaration
          url: https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng
          quote: Under the direction of His Father, He was the creator of the earth.
        - source: Pearl of Great Price
          ref: Abr 4:1
          tier: standard-works
