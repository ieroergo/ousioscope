  - id: lds.e.mary-bears-jesus
    source: lds.mary
    rel: bears
    target: lds.jesus
    asTo: PhysicalBody
    note: '"The mother of the Son of God, after the manner of the flesh" (1 Ne 11:18). From his mortal mother Mary, Jesus inherited mortality and subjection to hunger, thirst, fatigue, pain, and death.'
    citations:
      scripture:
        bible:
          - together:
              - Isa 7:14
              - Luke 1:27
            note: The footnote to "born" in Alma 7:10 pairs Isaiah's prophecy with Luke's account of its fulfillment.
          - Matt 1:16
          - John 10:17-18
        other:
          - Alma 7:10
          - 1 Ne 11:18
          - Mosiah 3:8
      authority:
        - source: Book of Mormon
          ref: Alma 7:10
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/7?lang=eng
          quote: And behold, he shall be born of Mary, at Jerusalem which is the land of our forefathers, she being a virgin, a precious and chosen vessel, who shall be overshadowed and conceive by the power of the Holy Ghost, and bring forth a son, yea, even the Son of God.
        - source: Book of Mormon
          ref: 1 Ne 11:18
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/11?lang=eng
          quote: "And he said unto me: Behold, the virgin whom thou seest is the mother of the Son of God, after the manner of the flesh."
        - source: Gospel Principles
          ref: "Chapter 11: The Life of Christ, paragraph 19"
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-principles/chapter-11-the-life-of-christ?lang=eng
          quote: Jesus is the only person on earth to be born of a mortal mother and an immortal Father. That is why He is called the Only Begotten Son. He inherited divine powers from His Father. From His mother He inherited mortality and was subject to hunger, thirst, fatigue, pain, and death.

