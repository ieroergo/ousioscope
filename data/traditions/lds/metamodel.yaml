tradition:
  id: lds
  name: The Church of Jesus Christ of Latter-day Saints
  shortName: Latter-day Saints
  scripture: { bible: lds, other: lds }
  otherScriptureLabel: Restoration scripture
  tiers:
    - { id: standard-works, label: "Standard Works (canonized scripture)" }
    - { id: official-declaration, label: "Official declaration / proclamation" }
    - { id: church-published, label: "Church-published teaching" }
    - { id: general-authority, label: "General authority teaching" }
  hermeneutic:
    summary: >-
      The Bible is the word of God "as far as it is translated correctly", read with the Book of Mormon, Doctrine
      and Covenants, and Pearl of Great Price, and with continuing revelation through living prophets.
    citations:
      scripture:
        bible: none-cited
        other:
          - { ref: A of F 1:8, highlight: "as far as it is translated correctly" }
          - { ref: A of F 1:9, highlight: "all that He does now reveal" }
      authority:
        - source: Articles of Faith
          ref: A of F 1:8-9
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng
  allowedDomains: [churchofjesuschrist.org]

# The tradition's own outline of teaching, in its own words. Data is organized by these topics:
# every relationship type declares its topics, and edges inherit them.
topics:
  - { id: godhead, label: "The Godhead: the Father, the Son, and the Holy Ghost", registry: [topic.godhead, topic.god], source: { source: "Articles of Faith", ref: "A of F 1:1", tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng&id=p1#p1" } }
  - { id: fall, label: "Punished for our own sins, not for Adam's transgression", registry: [topic.fall], source: { source: "Articles of Faith", ref: "A of F 1:2", tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng&id=p2#p2" } }
  - { id: atonement, label: "Saved through the Atonement of Christ", registry: [topic.atonement, topic.salvation], source: { source: "Articles of Faith", ref: "A of F 1:3", tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng&id=p3#p3" } }
  - { id: first-principles, label: "Faith, repentance, baptism, and the gift of the Holy Ghost", registry: [topic.salvation, topic.sacraments, topic.holy-spirit], source: { source: "Articles of Faith", ref: "A of F 1:4", tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng&id=p4#p4" } }
  - { id: priesthood, label: "Called of God by prophecy and the laying on of hands", registry: [topic.church], source: { source: "Articles of Faith", ref: "A of F 1:5", tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng&id=p5#p5" } }
  - { id: church, label: "The same organization as the Primitive Church", registry: [topic.church], source: { source: "Articles of Faith", ref: "A of F 1:6", tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng&id=p6#p6" } }
  - { id: gifts, label: "Gifts of the Spirit", registry: [topic.holy-spirit], source: { source: "Articles of Faith", ref: "A of F 1:7", tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng&id=p7#p7" } }
  - { id: scripture, label: "The Bible and the Book of Mormon as the word of God", registry: [topic.scripture], source: { source: "Articles of Faith", ref: "A of F 1:8", tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng&id=p8#p8" } }
  - { id: revelation, label: "Continuing revelation", registry: [topic.scripture, topic.prophethood], source: { source: "Articles of Faith", ref: "A of F 1:9", tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng&id=p9#p9" } }
  - { id: gathering, label: "The gathering of Israel, Zion, and Christ's reign on earth", registry: [topic.last-things], source: { source: "Articles of Faith", ref: "A of F 1:10", tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng&id=p10#p10" } }
  - { id: worship, label: "Worship according to conscience", registry: [topic.worship], source: { source: "Articles of Faith", ref: "A of F 1:11", tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng&id=p11#p11" } }
  - { id: government, label: "Subject to kings, presidents, rulers, and magistrates", registry: [topic.society], source: { source: "Articles of Faith", ref: "A of F 1:12", tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng&id=p12#p12" } }
  - { id: virtues, label: "Honest, true, chaste, benevolent, virtuous", registry: [topic.ethics], source: { source: "Articles of Faith", ref: "A of F 1:13", tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng&id=p13#p13" } }
  - { id: christ, label: "The Living Christ: premortal, mortal, and risen", registry: [topic.christ, topic.incarnation], inOutline: false, source: { source: "The Living Christ", ref: "2000", tier: official-declaration, url: "https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng" } }
  - { id: plan, label: "Spirit children of God: premortal life and mortality", registry: [topic.humanity], inOutline: false, source: { source: "Topical Guide", ref: "Man, a Spirit Child of Heavenly Father", tier: church-published, url: "https://www.churchofjesuschrist.org/study/scriptures/tg/man-a-spirit-child-of-heavenly-father?lang=eng" } }
  - { id: creation, label: "Creation: the Gods organized the heavens and the earth", registry: [topic.creation], inOutline: false, source: { source: "Pearl of Great Price", ref: "Abraham 4", tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng" } }
  - { id: resurrection, label: "Resurrection", registry: [topic.resurrection, topic.afterlife], inOutline: false, source: { source: "Topics and Questions", ref: "Resurrection", tier: church-published, url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/resurrection?lang=eng" } }
stances:
  - debate: debate.trinity
    stance: rejects
    summary: The Father, Son, and Holy Ghost are three separate beings, one in purpose and doctrine, not three persons in one substance.
    claims:
      - lds.e.godhead-father
      - lds.e.godhead-jesus
      - lds.e.godhead-holy-ghost
      - lds.e.jesus-one-with-father
      - lds.holy-ghost#Body?
    citations:
      scripture:
        bible:
          - Matt 28:19
          - John 17:20-23
        other:
          - A of F 1:1
          - JS-H 1:17
      authority:
        - source: Topics and Questions, "Godhead"
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng
          quote: where Latter-day Saints differ from other Christian religions is in their belief that God and Jesus Christ are glorified, physical beings and that each member of the Godhead is a separate being... From the Prophet’s account of the First Vision and from his other teachings, we know that the members of the Godhead are three separate beings. The Father and the Son have tangible bodies of flesh and bones, and the Holy Ghost is a personage of spirit.
        - source: Elder Jeffrey R. Holland, "The Only True God and Jesus Christ Whom He Hath Sent" (General Conference, October 2007)
          tier: general-authority
          url: https://www.churchofjesuschrist.org/study/general-conference/2007/10/the-only-true-god-and-jesus-christ-whom-he-hath-sent?lang=eng
          quote: I think it is accurate to say we believe They are one in every significant and eternal aspect imaginable except believing Them to be three persons combined in one substance, a Trinitarian notion never set forth in the scriptures because it is not true... We declare it is self-evident from the scriptures that the Father, the Son, and the Holy Ghost are separate persons, three divine beings
  - debate: debate.son-created
    stance: reframes
    claims: ["lds.e.father-begets-jesus-spirit", "lds.jesus#Existence before birth"]
    summary: >-
      The Son is the Firstborn spirit child of the Father. Intelligence itself "was not created or made".
    citations:
      scripture: { bible: [Col 1:15], other: [D&C 93:21, D&C 93:29] }
      authority:
        - { source: Doctrine and Covenants, ref: D&C 93:21, tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/93?lang=eng&id=p21#p21", quote: "I was in the beginning with the Father, and am the Firstborn" }
  - debate: debate.theotokos
    stance: reframes
    summary: Mary is "the mother of the Son of God, after the manner of the flesh". In 1837, the Book of Mormon text was revised from "the mother of God" to "the mother of the Son of God" to clarify that Mary is mother of the Son in the flesh, distinguishing the Son from the Father.
    claims:
      - lds.e.mary-bears-jesus
      - lds.mary#Title
    citations:
      scripture:
        bible:
          - Luke 1:35
        other:
          - 1 Ne 11:18
      authority:
        - source: Book of Mormon
          ref: 1 Ne 11:18
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/11?lang=eng
          quote: "And he said unto me: Behold, the virgin whom thou seest is the mother of the Son of God, after the manner of the flesh."
        - source: Changes to the Book of Mormon, Church History Topics
          ref: Paragraph 3
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/history/topics/changes-to-the-book-of-mormon?lang=eng
          quote: For instance, they adjusted references about Jesus in 1 Nephi rendered in the manuscripts and 1830 edition as “the mother of God,” “the Eternal Father,” and “the Everlasting God” to “the mother of the Son of God,” “the Son of the Eternal Father,” and “the Son of the everlasting God,” respectively.
  - debate: debate.ex-nihilo
    stance: rejects
    claims: ["lds.e.jesus-organizes-earth", "lds.e.earth-from-element"]
    summary: The Gods organized the world from existing materials, and "the elements are eternal".
    citations:
      scripture: { bible: none-cited, other: [Abr 3:24, D&C 93:33] }
      authority:
        - { source: Pearl of Great Price, ref: Abr 3:24, tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng&id=p24#p24", quote: "we will take of these materials, and we will make an earth" }
  - debate: debate.god-embodied
    stance: affirms
    summary: The Father and the Son have tangible bodies of flesh and bones, while the Holy Ghost is a separate personage of spirit.
    claims:
      - lds.e.father-has-body
      - lds.e.jesus-has-body
      - lds.holy-ghost#Body?
    citations:
      scripture:
        bible:
          - Luke 24:39
        other:
          - D&C 130:22
      authority:
        - source: Doctrine and Covenants
          ref: D&C 130:22
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/130?lang=eng
          quote: The Father has a body of flesh and bones as tangible as man’s; the Son also; but the Holy Ghost has not a body of flesh and bones, but is a personage of Spirit. Were it not so, the Holy Ghost could not dwell in us.
        - source: Gospel Topics, "Godhead"
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng
          quote: From the Prophet’s account of the First Vision and from his other teachings, we know that the members of the Godhead are three separate beings. The Father and the Son have tangible bodies of flesh and bones, and the Holy Ghost is a personage of spirit.
  - debate: debate.inherited-guilt
    stance: rejects
    claims: ["lds.adam#What descendants inherit"]
    summary: People are punished for their own sins, not for Adam's transgression. They inherit only a fallen condition.
    citations:
      scripture: { bible: none-cited, other: [A of F 1:2] }
      authority:
        - { source: Articles of Faith, ref: A of F 1:2, tier: standard-works, url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng&id=p2#p2", quote: "We believe that men will be punished for their own sins, and not for Adam's transgression." }
  - debate: debate.bodily-resurrection
    stance: affirms
    claims: ["lds.jesus#Resurrection", "lds.e.jesus-has-body"]
    summary: The risen Christ has a body of flesh and bones.
    citations:
      scripture: { bible: [Luke 24:39] }
      authority:
        - { source: 'Topics and Questions, "Resurrection"', tier: church-published, url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/resurrection?lang=eng", quote: "When the resurrected Lord appeared to His Apostles, He helped them understand that He had a body of flesh and bones." }

# Category tree (is-a). `group: true` categories are drawn as containers in the graph.
# The top of this tree has three roots and no single created/uncreated split. In these
# sources, "uncreated" is an attribute of intelligence and element, not the main division.
categories:
  - id: Intelligence
    label: Intelligence
    term:
      kind: own
      ref: D&C 93:29
      quote: Intelligence, or the light of truth, was not created or made, neither indeed can be.
    group: true
    definition: '"Intelligence, or the light of truth, was not created or made, neither indeed can be."'
    citations:
      scripture: { bible: [Prov 8:23], other: [D&C 93:29, Abr 3:18, Abr 3:22] }
      authority:
        - source: Doctrine and Covenants
          ref: D&C 93:29
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/93?lang=eng&id=p29#p29

  - id: Matter
    label: Matter
    term:
      kind: own
      ref: D&C 131:7
      quote: There is no such thing as immaterial matter. All spirit is matter
    group: true
    definition: All that exists in space, including spirit. "There is no such thing as immaterial matter."
    citations:
      scripture: { bible: none-cited, other: [{ ref: D&C 131:7-8, highlight: "All spirit is matter" }] }
      authority:
        - source: Doctrine and Covenants
          ref: D&C 131:7
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/131?lang=eng&id=p7#p7
          quote: There is no such thing as immaterial matter. All spirit is matter, but it is more fine or pure

  - id: SpiritMatter
    label: Spirit (refined matter)
    term:
      kind: own
      ref: D&C 131:7
      quote: All spirit is matter, but it is more fine or pure, and can only be discerned by purer eyes
    parent: Matter
    group: true
    definition: Matter that is "more fine or pure, and can only be discerned by purer eyes".
    citations:
      scripture: { bible: none-cited, other: [{ ref: D&C 131:7-8, highlight: "All spirit is matter" }] }
      authority:
        - source: Doctrine and Covenants
          ref: D&C 131:7-8
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/131?lang=eng&id=p7#p7

  - id: SpiritBody
    label: Spirit body
    term:
      kind: own
      url: https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/3?lang=eng
      quote: Christ shows His spirit body to the brother of Jared
    parent: SpiritMatter
    definition: An individual spirit. Spirits "have no beginning"; mortals were "in the beginning with the Father".
    citations:
      scripture: { bible: [John 4:24], other: [D&C 93:23, D&C 93:33, Abr 3:18] }
      authority:
        - source: Pearl of Great Price
          ref: Abr 3:18
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng&id=p18#p18
          quote: these two spirits ... have no beginning; they existed before, they shall have no end

  - id: Element
    label: Element (physical matter)
    term:
      kind: own
      ref: D&C 93:33
      quote: The elements are eternal, and spirit and element, inseparably connected, receive a fulness of joy
    parent: Matter
    group: true
    definition: Physical matter. "The elements are eternal."
    citations:
      scripture: { bible: none-cited, other: [D&C 93:33] }
      authority:
        - source: Doctrine and Covenants
          ref: D&C 93:33
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/93?lang=eng&id=p33#p33
          quote: The elements are eternal

  - id: PhysicalBody
    label: Tabernacle (physical body)
    term:
      kind: own
      ref: D&C 93:4
      quote: I was in the world and made flesh my tabernacle, and dwelt among the sons of men
    parent: Element
    definition: A body of flesh (and, when resurrected, flesh and bones), described as a "tabernacle".
    citations:
      scripture: { bible: [Luke 24:39], other: [D&C 93:4, D&C 130:22, Alma 7:8] }
      authority:
        - source: Doctrine and Covenants
          ref: D&C 93:4
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/93?lang=eng&id=p4#p4
          quote: made flesh my tabernacle, and dwelt among the sons of men

  - id: World
    label: The heavens and the earth (organized)
    term:
      kind: own
      url: https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng&id=p1#p1
      quote: And they went down at the beginning, and they, that is the Gods , organized and formed the heavens and the earth.
    parent: Element
    definition: An earth or heaven organized and formed from existing materials.
    citations:
      scripture: { bible: [Gen 1:1], other: [Abr 4:1, Moses 1:33] }
      authority:
        - source: Pearl of Great Price
          ref: Abr 4:1
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng&id=p1#p1
          quote: they, that is the Gods, organized and formed the heavens and the earth

  - id: Being
    label: Being
    term:
      kind: own
      url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng
      quote: God and Jesus Christ are glorified, physical beings
    group: true
    definition: A personal being. Each member of the Godhead is "a separate being".
    citations:
      scripture: { bible: [{ together: [Matt 3:17, Luke 3:22], note: 'Both listed under Topical Guide "Godhead": at the baptism the Father speaks from heaven and the Holy Ghost descends "in a bodily shape like a dove" upon the Son.' }], other: [JS-H 1:17, D&C 130:22] }
      authority:
        - source: 'Topical Guide, "Godhead"'
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/godhead?lang=eng
        - source: Topics and Questions, "Godhead" (2023)
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng
          quote: God and Jesus Christ are glorified, physical beings and ... each member of the Godhead is a separate being

  - id: GodheadMember
    label: Member of the Godhead
    term:
      kind: own
      url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng
      quote: each member of the Godhead is a separate being
    parent: Being
    definition: One of the three beings who make up the Godhead and "preside over this world".
    citations:
      scripture: { bible: [Matt 28:19], other: [A of F 1:1] }
      authority:
        - source: 'Topical Guide, "Godhead"'
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/godhead?lang=eng
        - source: Topics and Questions, "Godhead" (2023)
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng
          quote: These three beings make up the Godhead. They preside over this world and all other creations of our Father in Heaven.

  - id: ChildOfGod
    label: Spirit child of Heavenly Father (human)
    term:
      kind: own
      url: https://www.churchofjesuschrist.org/study/scriptures/tg/man-a-spirit-child-of-heavenly-father?lang=eng
      quote: Man, a Spirit Child of Heavenly Father
    parent: Being
    definition: A human being, a spirit begotten "unto God", living on earth in a physical body.
    citations:
      scripture: { bible: [Acts 17:29, Heb 12:9, Rom 8:16], other: [D&C 76:24, { ref: Abr 3:22-23, highlight: "the intelligences that were organized before the world was" }, D&C 88:15] }
      authority:
        - source: 'Topical Guide, "Man, a Spirit Child of Heavenly Father"'
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/man-a-spirit-child-of-heavenly-father?lang=eng
        - source: The Living Christ (2000)
          ref: quoting D&C 76:24
          tier: official-declaration
          url: https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng
          quote: the inhabitants thereof are begotten sons and daughters unto God

  - id: Godhead
    label: Godhead
    term:
      kind: own
      url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng
      quote: These three beings make up the Godhead.
    group: true
    definition: The three separate beings who together "preside over this world and all other creations of our Father in Heaven".
    citations:
      scripture: { bible: [Matt 28:19], other: [A of F 1:1] }
      authority:
        - source: 'Topical Guide, "Godhead"'
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/godhead?lang=eng
        - source: Topics and Questions, "Godhead" (2023)
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng
          quote: These three beings make up the Godhead.

relationships:
  - id: begets
    label: begets
    definition: >-
      Fatherhood of a being. Qualified "as to" what is begotten: a spirit ("Firstborn") or, for Jesus
      alone, a body "in the flesh" ("Only Begotten").
    domain: [Being]
    range: [Being]
    topics: [plan]
    citations:
      scripture: { bible: [Heb 12:9, Num 16:22, Acts 17:29], other: [D&C 76:24] }
      authority:
        - source: 'Topical Guide, "Man, a Spirit Child of Heavenly Father"'
          tier: church-published
          url: https://www.churchofjesuschrist.org/study/scriptures/tg/man-a-spirit-child-of-heavenly-father?lang=eng
        - source: The Living Christ (2000)
          tier: official-declaration
          url: https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng
          quote: He was the Firstborn of the Father, the Only Begotten Son in the flesh

  - id: bears
    label: bears
    definition: Motherhood. A woman conceives and brings forth a son.
    domain: [ChildOfGod]
    range: [Being]
    topics: [christ]
    citations:
      scripture: { bible: [Isa 7:14, Luke 1:27], other: [Alma 7:10] }
      authority:
        - source: Book of Mormon
          ref: Alma 7:10
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/7?lang=eng&id=p10#p10

  - id: overshadows
    label: overshadows
    definition: The Holy Ghost comes upon Mary so that she conceives by his power.
    domain: [GodheadMember]
    range: [ChildOfGod]
    topics: [christ]
    citations:
      scripture: { bible: [{ ref: Luke 1:34-35, highlight: "the power of the Highest shall overshadow thee" }, Matt 1:20], other: [Alma 7:10, 1 Ne 11:19] }
      authority:
        - source: Book of Mormon
          ref: Alma 7:10
          tier: standard-works
          url: https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/7?lang=eng&id=p10#p10
          quote: who shall be overshadowed and conceive by the power of the Holy Ghost

  - id: hasPart
    label: has part
    definition: Composition. "The spirit and the body are the soul of man."
    domain: [Being]
    range: [SpiritBody, PhysicalBody]
    topics: [plan]
    citations:
      scripture: { bible: [Gen 2:7, Ezek 37:14], other: [D&C 88:15, D&C 93:33] }
