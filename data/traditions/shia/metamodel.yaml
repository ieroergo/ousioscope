tradition:
  id: shia
  name: Shīʿah Ithnā ʿAshariyyah (Twelver Shia Islam)
  shortName: Twelver Shia
  scripture: { bible: kjv, other: quran-qarai }
  # The Old and New Testaments are not Islamic scripture. Bible verses appear only as labeled parallels.
  bibleRole: parallel
  otherScriptureLabel: Qur'an
  tiers:
    - { id: quran, label: "Qur'an" }
    - { id: hadith-sahih, label: "Hadith of the Imams graded sahih (al-Kafi)" }
    - { id: hadith, label: "Hadith of the Imams, other grading (al-Kafi)" }
    - { id: scholarly-creed, label: "Scholarly creed (marja', e.g. Principles of Faith)" }
  hermeneutic:
    summary: >-
      The Qur'an's true interpretation is known by the Prophet and the Imams of his family, "those firmly
      grounded in knowledge" (3:7). Their hadith are the key to interpretation.
    citations:
      scripture: { bible: none-cited, other: [Quran 3:7] }
      authority:
        - source: Al-Kafi, Kitab al-Hujja
          ref: vol. 1, book 4, ch. 22, hadith 1 (graded sahih by al-Majlisi)
          tier: hadith-sahih
          url: https://thaqalayn.net/hadith/1/4/22/1
          quote: We are the people well-grounded in knowledge and we are the ones who know how to interpret it.
  allowedDomains: [thaqalayn.net, al-islam.org, tanzil.net, quran.com]

# The tradition's own outline of teaching, in its own words. Data is organized by these topics:
# every relationship type declares its topics, and edges inherit them.
topics:
  - { id: tawhid, label: "Tawhid: divine unity", registry: [topic.god], source: { source: "Wahid Khorasani, Principles of Faith (Usul al-Din)", ref: "five roots of religion", tier: scholarly-creed, url: "https://al-islam.org/principles-faith-usul-al-din-husayn-wahid-khorasani/introduction" } }
  - { id: adl, label: "'Adl: divine justice", registry: [topic.predestination], source: { source: "Wahid Khorasani, Principles of Faith (Usul al-Din)", ref: "five roots of religion", tier: scholarly-creed, url: "https://al-islam.org/principles-faith-usul-al-din-husayn-wahid-khorasani/introduction" } }
  - { id: nubuwwah, label: "Nubuwwah: prophethood", registry: [topic.prophethood, topic.christ], source: { source: "Wahid Khorasani, Principles of Faith (Usul al-Din)", ref: "five roots of religion", tier: scholarly-creed, url: "https://al-islam.org/principles-faith-usul-al-din-husayn-wahid-khorasani/introduction" } }
  - { id: imamah, label: "Imamah: the divine leadership of the Imams", registry: [topic.imamate, topic.church], source: { source: "Wahid Khorasani, Principles of Faith (Usul al-Din)", ref: "five roots of religion", tier: scholarly-creed, url: "https://al-islam.org/principles-faith-usul-al-din-husayn-wahid-khorasani/introduction" } }
  - { id: maad, label: "Ma'ad: the return (resurrection and judgment)", registry: [topic.afterlife, topic.resurrection], source: { source: "Wahid Khorasani, Principles of Faith (Usul al-Din)", ref: "five roots of religion", tier: scholarly-creed, url: "https://al-islam.org/principles-faith-usul-al-din-husayn-wahid-khorasani/introduction" } }
  - { id: creation, label: "Creation “not from a thing”", registry: [topic.creation], inOutline: false, source: { source: "Al-Kafi, Kitab al-Tawhid", ref: "vol. 1, book 3, ch. 11, hadith 3", tier: hadith, url: "https://thaqalayn.net/hadith/1/3/11/3" } }
  - { id: spirit, label: "The Spirit (al-Ruh)", registry: [topic.holy-spirit, topic.angels], inOutline: false, source: { source: "Al-Kafi, Kitab al-Hujja", ref: "vol. 1, book 4, ch. 56", tier: hadith-sahih, url: "https://thaqalayn.net/hadith/1/4/56/1" } }
  - { id: humanity, label: "Adam and the human being", registry: [topic.humanity, topic.fall], inOutline: false, source: { source: "Qur'an", ref: "Quran 2:30", tier: quran, url: "https://quran.com/2:30" } }
stances:
  - debate: debate.trinity
    stance: rejects
    summary: Allah is but the One God. The Qur'an forbids saying "[God is] a trinity".
    claims:
      - shi.allah#Has a son?
      - shi.isa#Servitude ('ubudiyyah)
    citations:
      scripture:
        bible: none-cited
        other:
          - Quran 4:171
          - Quran 112:1-4
      authority:
        - source: Qur'an
          ref: An-Nisa 4:171
          tier: quran
        - source: Risalat al-I'tiqadat (Shaykh as-Saduq)
          ref: ch. 34
          tier: scholarly-creed
          url: https://www.al-islam.org/shiite-creed-shaykh-saduq/concerning-prophets-apostles-imams-and-angels
          quote: The Messiah will never scorn to be a slave to Allah, nor will the favored angels... Allah the Mighty and Glorious said this only because there are among the people some who believe in the divinity of Jesus and worship him, and these are a class amongst the Christians
  - debate: debate.son-created
    stance: affirms
    claims: ["shi.e.allah-creates-isa", "shi.e.isa-like-adam"]
    summary: Jesus is a created apostle of Allah, created like Adam.
    citations:
      scripture: { bible: none-cited, other: [Quran 3:59, Quran 4:171] }
      authority:
        - { source: "Qur'an", ref: Al Imran 3:59, tier: quran }
  - debate: debate.ex-nihilo
    stance: affirms
    claims: ["shi.e.allah-creates-cosmos", "shi.heavens-earth#Made from"]
    summary: Allah invented all things "not from a thing".
    citations:
      scripture: { bible: none-cited, other: [Quran 2:117] }
      authority:
        - { source: "Al-Kafi, Kitab al-Tawhid (Imam al-Rida)", ref: "vol. 1, book 3, ch. 11, hadith 3", tier: hadith, url: "https://thaqalayn.net/hadith/1/3/11/3", quote: "He is the inventor of all things, an invention that came from His power and wisdom but not from a thing" }
  - debate: debate.god-embodied
    stance: rejects
    claims: ["shi.allah#Body?"]
    summary: Allah is not a body and has no form.
    citations:
      scripture: { bible: none-cited, other: [Quran 42:11] }
      authority:
        - { source: "Al-Kafi, Kitab al-Tawhid", ref: "vol. 1, book 3, ch. 11, hadith 2", tier: hadith, url: "https://thaqalayn.net/hadith/1/3/11/2", quote: "Glorious is He similar to Who there is nothing. He is not a body nor has He any form." }
  - debate: debate.inherited-guilt
    stance: rejects
    claims: ["shi.adam#Slip and repentance"]
    summary: No bearer bears another's burden, and Adam was forgiven.
    citations:
      scripture: { bible: none-cited, other: [Quran 6:164, Quran 20:122] }
      authority:
        - { source: "Qur'an", ref: "Al-An'am 6:164", tier: quran }
  - debate: debate.crucifixion
    stance: rejects
    claims: ["shi.isa#Crucified?", "shi.e.allah-raises-isa"]
    summary: Jesus was neither killed nor crucified. Allah raised him to Himself.
    citations:
      scripture: { bible: none-cited, other: [Quran 4:157-158] }
      authority:
        - { source: "Qur'an", ref: An-Nisa 4:157-158, tier: quran }

categories:
  - id: Creator
    label: The Creator (Allah)
    term:
      kind: own
      url: https://thaqalayn.net/hadith/1/3/11/4
      quote: What can be more blasphemous and scandalous than to describe the Creator of all things by means of body, form, type of creation, limitations, limbs and organs.
    group: true
    definition: 'The One God, who "is not a body nor has He any form" and whom "no one knows how He is except He Himself".'
    citations:
      scripture: { bible: [Deut 4:15-16], other: [Quran 112:1-4, Quran 42:11] }
      authority:
        - source: Al-Kafi, Kitab al-Tawhid
          ref: vol. 1, book 3, ch. 11, hadith 2
          tier: hadith
          url: https://thaqalayn.net/hadith/1/3/11/2
          quote: Glorious is He similar to Who there is nothing. He is not a body nor has He any form.

  - id: Creation
    label: Creation
    term:
      kind: own
      url: https://thaqalayn.net/hadith/1/3/2/5
      quote: Allah is distinct from His creation, and his creation is distinct from Him
    group: true
    definition: Everything other than Allah, invented "not from a thing".
    citations:
      scripture: { bible: [Gen 1:1], other: [Quran 2:117] }
      authority:
        - source: Al-Kafi, Kitab al-Tawhid (Imam al-Rida)
          ref: vol. 1, book 3, ch. 11, hadith 3
          tier: hadith
          url: https://thaqalayn.net/hadith/1/3/11/3
          quote: He is the inventor of all things, an invention that came from His power and wisdom but not from a thing

  - id: Spirit
    label: The Spirit (al-Ruh)
    term:
      kind: own
      url: https://thaqalayn.net/hadith/1/4/56/1
      quote: Thus, We have revealed a Spirit to you, (Muhammad), by Our command.
    parent: Creation
    definition: '"A creature of the creatures of Allah ... greater than Jibril and Mika''il", with the Prophet and then the Imams.'
    citations:
      scripture: { bible: none-cited, other: [Quran 42:52, Quran 17:85] }
      authority:
        - source: Al-Kafi, Kitab al-Hujja
          ref: vol. 1, book 4, ch. 56, hadith 1 (graded sahih by al-Majlisi)
          tier: hadith-sahih
          url: https://thaqalayn.net/hadith/1/4/56/1
          quote: He is a creature of the creatures of Allah, the Most Holy and Most High, greater than Jibril and Mika'il.

  - id: Angel
    label: Angel (malak)
    term:
      kind: own
      ref: Quran 2:30
      quote: your Lord said to the angels, ‘Indeed I am going to set a viceroy on the earth,’ they said, ‘Will You set in it someone who will cause corruption in it and shed blood, while we celebrate Your praise and proclaim
    parent: Creation
    definition: A created messenger of Allah, such as Jibril.
    citations:
      scripture: { bible: [Luke 1:26], other: [Quran 19:17] }
      authority:
        - source: Qur'an
          ref: Maryam 19:17
          tier: quran

  - id: Human
    label: Human (servant of Allah)
    term:
      kind: own
      ref: Quran 19:17
      quote: Thus did she seclude herself from them, whereupon We sent to her Our Spirit and he became incarnate for her as a well-proportioned human.
    parent: Creation
    definition: A created human being and servant of Allah.
    citations:
      scripture: { bible: [Gen 2:7], other: [Quran 3:59] }
      authority:
        - source: Qur'an
          ref: Al Imran 3:59
          tier: quran

  - id: Prophet
    label: Prophet (and apostle)
    term:
      kind: own
      url: https://thaqalayn.net/hadith/1/4/55/2
      quote: “O Jabir, in the prophets and in the executors of their will there are five spirits.
    parent: Human
    definition: A human sent by Allah, in whom (with the Imams) "Allah has placed ... five spirits", one of them the Holy Spirit.
    citations:
      scripture: { bible: none-cited, other: [Quran 5:75, Quran 2:253] }
      authority:
        - source: Al-Kafi, Kitab al-Hujja
          ref: vol. 1, book 4, ch. 55, hadith 2
          tier: hadith-sahih
          url: https://thaqalayn.net/hadith/1/4/55/2
          quote: in the prophets and in the executors of their will there are five spirits. They are the Holy Spirit, the spirit of faith, the spirit of life, the spirit of power and the spirit of desire.

  - id: HeavensEarth
    label: The heavens and the earth
    term:
      kind: own
      ref: Quran 21:30
      quote: Have the faithless not regarded that the heavens and the earth were interwoven and We unravelled them, and We made every living thing out of water?
    parent: Creation
    definition: The created cosmos.
    citations:
      scripture: { bible: [Gen 1:1], other: [Quran 21:30] }
      authority:
        - source: Qur'an
          ref: Al-Anbiya 21:30
          tier: quran
  - id: UlulAzm
    label: "Ulul 'Azm (people with determination)"
    term:
      kind: own
      url: https://thaqalayn.net/hadith/1/4/2/3
      quote: saying, ‘The leaders and masters of the prophets and the messengers are five who are called ’ulul ‘Azm (people with determination) among the messengers who have the central
    parent: Prophet
    definition: One of the five premier arch-messengers who hold the central role in prophethood and brought universal divine law (Noah, Abraham, Moses, Jesus, Muhammad).
    citations:
      scripture:
        bible: none-cited
        other:
          - Quran 46:35
      authority:
        - source: Al-Kafi, Kitab al-Hujja
          ref: vol. 1, book 4, ch. 2, hadith 3
          tier: hadith-sahih
          url: https://thaqalayn.net/hadith/1/4/2/3
          quote: The leaders and masters of the prophets and the messengers are five who are called ’ulul ‘Azm (people with determination) among the messengers who have the central role. They are Noah, Abraham, Moses, Jesus and Muhammad

