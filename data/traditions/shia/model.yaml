# Individuals only. Bible verses are parallels to the Qur'anic account, not Islamic proof texts.
nodes:
  - id: shi.allah
    label: Allah
    category: Creator
    referent: ref.godhead
    description: The One God, beyond body, form, and limit.
    attributes:
      - name: Body?
        topics: [tawhid]
        value: No; "He is not a body nor has He any form"
        citations:
          scripture: { bible: [Deut 4:15-16], other: [Quran 42:11, Quran 6:103] }
          authority:
            - source: Al-Kafi, Kitab al-Tawhid
              ref: vol. 1, book 3, ch. 11, hadith 2
              tier: hadith
              url: https://thaqalayn.net/hadith/1/3/11/2
            - source: Al-Kafi, Kitab al-Tawhid (Imam Musa al-Kazim)
              ref: vol. 1, book 3, ch. 11, hadith 4
              tier: hadith
              url: https://thaqalayn.net/hadith/1/3/11/4
              quote: What can be more blasphemous and scandalous than to describe the Creator of all things by means of body, form, type of creation, limitations, limbs and organs.
      - name: Has a son?
        topics: [tawhid]
        value: No
        citations:
          scripture: { bible: none-cited, other: [Quran 112:3, Quran 19:35, Quran 4:171] }
          authority:
            - source: Qur'an
              ref: Al-Ikhlas 112:3
              tier: quran
    citations:
      scripture: { bible: [Deut 6:4], other: [Quran 112:1-4] }
      authority:
        - source: Qur'an
          ref: Al-Ikhlas 112
          tier: quran

  - id: shi.isa
    label: Jesus (Isa), son of Mary
    category: Prophet
    referent: ref.jesus
    description: An apostle of Allah, "His Word that He cast toward Mary and a spirit from Him", created like Adam.
    attributes:
      - name: Crucified?
        topics: [nubuwwah]
        value: No; he was raised to Allah
        citations:
          scripture: { bible: none-cited, other: [Quran 4:157-158] }
          authority:
            - source: Qur'an
              ref: An-Nisa 4:157-158
              tier: quran
      - name: Physical mortality
        value: Mortal messenger preceded by other messengers; ate food
        topics:
          - nubuwwah
          - humanity
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 5:75
          authority:
            - source: Qur'an
              ref: Al-Ma'idah 5:75
              tier: quran
              url: https://quran.com/5/75
              quote: The Messiah, son of Mary, was no more than a messenger. ˹Many˺ messengers had ˹come and˺ gone before him. His mother was a woman of truth. They both ate food.
      - name: Cradle declaration
        value: Spoke in infancy affirming servitude ('abd) to Allah, having been given the Book and appointed a prophet (Hujjah)
        topics:
          - nubuwwah
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 19:30
          authority:
            - source: Qur'an
              ref: Maryam 19:30
              tier: quran
              url: https://quran.com/19/30
              quote: Jesus declared, “I am truly a servant of Allah. He has destined me to be given the Scripture and to be a prophet.
            - source: Al-Kafi, Kitab al-Hujja
              ref: vol. 1, book 4, ch. 91, hadith 1
              tier: hadith
              url: https://thaqalayn.net/hadith/1/4/91/1
              quote: He said, “At that time he was a prophet, a Divine authority over the people but not a Mursal (Messenger). Have you not heard the words of Allah that say, “He said, “I am the servant of God. He has given me the Book and has appointed me to be a Prophet (19:30). He has blessed me no matter where I dwell, commanded me to worship Him and pay the religious tax for as long as I live.” (19:31)
      - name: "Rank: Ulul 'Azm"
        value: One of the five leaders and masters of the prophets and messengers who have the central role
        topics:
          - nubuwwah
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 46:35
          authority:
            - source: Al-Kafi, Kitab al-Hujja
              ref: vol. 1, book 4, ch. 2, hadith 3
              tier: hadith-sahih
              url: https://thaqalayn.net/hadith/1/4/2/3
              quote: The leaders and masters of the prophets and the messengers are five who are called ’ulul ‘Azm (people with determination) among the messengers who have the central role. They are Noah, Abraham, Moses, Jesus and Muhammad
      - name: Manifestation of Hujjah in childhood
        value: Rose with Divine Authority (al-Hujjah) at three years of age, demonstrating that divine leadership does not require physical adulthood
        topics:
          - nubuwwah
          - imamah
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 19:30
          authority:
            - source: Al-Kafi, Kitab al-Hujja
              ref: vol. 1, book 4, ch. 91, hadith 2
              tier: hadith-sahih
              url: https://thaqalayn.net/hadith/1/4/91/2
              quote: Jesus rose with Divine authority when he three years old only.
      - name: Stages of prophetic authority
        value: Prophet and Hujjah at birth defending Mary; at age seven spoke as an inspired prophet and messenger holding divine authority over John and all people
        topics:
          - nubuwwah
          - imamah
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 19:30-31
              - Quran 19:12
          authority:
            - source: Al-Kafi, Kitab al-Hujja
              ref: vol. 1, book 4, ch. 91, hadith 1
              tier: hadith
              url: https://thaqalayn.net/hadith/1/4/91/1
              quote: At that time Jesus was a sign from Allah and a blessing to Mary (Maryam) when he spoke on her behalf. He was a prophet and a Divine authority over all those who heard his words at that time... When Jesus became seven years he then spoke as a prophet and a messenger until Allah, the Most Holy sent him inspiration. Thus, Jesus was the Divine authority over John and over all the people.
      - name: Miracles by divine permission
        value: Fashions birds from clay and revives the dead solely by Allah's permission and speech, remaining a servant and son of Allah's maidservant
        topics:
          - nubuwwah
          - tawhid
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 3:49
              - Quran 5:110
          authority:
            - source: Al-Amālī, Assembly 78
              ref: hadith 1
              tier: hadith
              url: https://thaqalayn.net/hadith/29/1/78/1
              quote: O `Isa! You are the Messiah by My command, and you create from clay that which is in the form of a bird by My permission, and you revive the dead by My words... so long that you testify that you are My servant, the son of my maidservant.
      - name: Servitude ('ubudiyyah)
        value: Never scorns or disdains servitude to Allah, refuting Christian claims of his divinity and worship
        topics:
          - tawhid
          - nubuwwah
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 4:172
          authority:
            - source: Risalat al-I'tiqadat (Shaykh as-Saduq)
              ref: ch. 34
              tier: scholarly-creed
              url: https://www.al-islam.org/shiite-creed-shaykh-saduq/concerning-prophets-apostles-imams-and-angels
              quote: The Messiah will never scorn to be a slave to Allah, nor will the favored angels... Allah the Mighty and Glorious said this only because there are among the people some who believe in the divinity of Jesus and worship him, and these are a class amongst the Christians
      - name: Eschatological descent and prayer behind the Mahdi
        value: Descends from heaven upon the reappearance of the Mahdi and prays behind him as the Prophet's vicegerent, serving as a minister rather than a commander
        topics:
          - nubuwwah
          - imamah
          - maad
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 9:33
              - Quran 3:55
          authority:
            - source: Risalat al-I'tiqadat (Shaykh as-Saduq)
              ref: ch. 35
              tier: scholarly-creed
              url: https://www.al-islam.org/shiite-creed-shaykh-saduq/number-prophets-and-vicegerents
              quote: about whom the Prophet gave information that when he appears, Jesus... son of Mary, will descend upon the earth and pray behind him, and he who prays behind him is like one who prays behind the Prophet of Allah, because he is his vicegerent
            - source: Jesus through Shiite Narrations
              ref: "Chapter: His Second Coming, Paragraph 8"
              tier: scholarly-creed
              url: https://www.al-islam.org/jesus-through-shiite-narrations-mahdi-muntazir-qaim/his-second-coming
              quote: It is reported that Jesus will say to al-Mahdi, “I was raised as a minister not as a commander.”
      - name: Disavowal of deification
        value: Sought absolution from Allah regarding those who deified him, serving as the archetype for the Imams' disavowal of extremist delegators (ghulat and mufawwida)
        topics:
          - tawhid
          - nubuwwah
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 4:171
              - Quran 5:116
          authority:
            - source: Risalat al-I'tiqadat (Shaykh as-Saduq)
              ref: ch. 37
              tier: scholarly-creed
              url: https://www.al-islam.org/shiite-creed-shaykh-saduq/denial-excess-and-delegation
              quote: O God, he who asserts that we (the Imams) have the power of creation and providing (for mankind) - we (Imams) seek absolution from Thee in respect of him, an absolution similar to that of Jesus, son of Mary, in respect of the Christians.
    citations:
      scripture: { bible: none-cited, other: [{ ref: Quran 4:171, highlight: "His Word that He cast toward Mary and a spirit from Him" }, Quran 3:59] }
      authority:
        - source: Qur'an
          ref: An-Nisa 4:171
          tier: quran

  - id: shi.spirit
    label: The Spirit (al-Ruh)
    category: Spirit
    referent: ref.holy-spirit
    description: >-
      A creature greater than Jibril and Mika'il, sent to the Prophet and present with the Imams. Separately,
      al-Kafi names "the Holy Spirit" as one of five spirits placed in the prophets and Imams.
    attributes:
      - name: Holy Spirit (Ruh al-Qudus)
        topics: [spirit, imamah]
        value: One of "five spirits" in the prophets and Imams; "the Holy Spirit does not sleep or become unaware"
        citations:
          scripture: { bible: none-cited, other: [Quran 2:87, Quran 2:253] }
          authority:
            - source: Al-Kafi, Kitab al-Hujja
              ref: vol. 1, book 4, ch. 55, hadith 3
              tier: hadith
              url: https://thaqalayn.net/hadith/1/4/55/3
              quote: When the prophet passes away the Holy Spirit transfers and comes over to the Imam. The Holy Spirit does not sleep or become unaware.
      - name: Same as Jibril?
        topics: [spirit]
        value: No; "greater than Jibril and Mika'il" and "from the realm of the angels"
        citations:
          scripture: { bible: none-cited, other: [Quran 17:85] }
          authority:
            - source: Al-Kafi, Kitab al-Hujja
              ref: vol. 1, book 4, ch. 56, hadith 3 (graded sahih by al-Majlisi)
              tier: hadith-sahih
              url: https://thaqalayn.net/hadith/1/4/56/3
              quote: He is a creature greater than Jibril and Mika'il. He was with the Messenger of Allah and he is present with the Imams. He is from the realm of the angels.
    citations:
      scripture: { bible: none-cited, other: [Quran 42:52, Quran 17:85] }
      authority:
        - source: Al-Kafi, Kitab al-Hujja
          ref: vol. 1, book 4, ch. 56, hadith 1 (graded sahih by al-Majlisi)
          tier: hadith-sahih
          url: https://thaqalayn.net/hadith/1/4/56/1
          quote: He is a creature of the creatures of Allah, the Most Holy and Most High, greater than Jibril and Mika'il.

  - id: shi.mary
    label: Mary (Maryam)
    category: Human
    referent: ref.mary
    description: Daughter of 'Imran, chosen and purified as the truthful mistress of the women of her world; a devout virgin who guarded her chastity and bore Jesus through Allah's spirit and Word.
    citations:
      scripture:
        bible:
          - together:
              - Luke 1:26-27
              - Luke 1:34
            note: "Parallel to Maryam 19:16-20: the angel sent to a virgin, who asks how she can have a son when no man has touched her."
        other:
          - Quran 3:42
          - Quran 19:20
          - Quran 66:12
          - Quran 5:75
      authority:
        - source: Qur'an
          ref: Al Imran 3:42
          tier: quran
        - source: Qur'an
          ref: At-Tahrim 66:12
          tier: quran
        - source: Qur'an
          ref: Al-Ma'idah 5:75
          tier: quran
        - source: Ma'ani al-Akhbar
          ref: book 1, ch. 40, hadith 1
          tier: hadith
          url: https://thaqalayn.net/hadith/28/1/40/1
          quote: "I said to Abu Abdillah, peace be upon him: Inform me about the saying of Allah’s Messenger, Allah’s blessings be upon him and his Family, with regards to Fatima that she is the Mistress of the women of all the worlds, is she the Mistress of the women of her world? So he said: That is for Maryam; she was the Mistress of the women of her world, whereas Fatima is the Mistress of the women of all the worlds, from the first and the last."
    attributes:
      - name: Truthful woman (Siddiqah) and mortality
        value: A truthful woman (siddiqah) and mortal human who consumed earthly food alongside her son, demonstrating biological need and creatureliness rather than divinity
        topics:
          - tawhid
          - nubuwwah
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 5:75
          authority:
            - source: Qur'an
              ref: Al-Ma'idah 5:75
              tier: quran
      - name: Deity?
        value: No; she is not a deity (ilah) beside Allah, and Jesus explicitly disavows before Allah that he or his mother should ever be taken as gods
        topics:
          - tawhid
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 5:116
          authority:
            - source: Qur'an
              ref: Al-Ma'idah 5:116
              tier: quran
      - name: Creaturely contingency
        value: A created, contingent mortal whom Allah has the absolute power to destroy along with her son and all on earth
        topics:
          - tawhid
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 5:17
          authority:
            - source: Qur'an
              ref: Al-Ma'idah 5:17
              tier: quran
      - name: Devoutness and chastity
        value: Guarded her chastity, received the spirit breathed into her, and testified with sincere devotion (al-qanitin) to the words and scriptures of her Lord
        topics:
          - nubuwwah
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 66:12
          authority:
            - source: Qur'an
              ref: At-Tahrim 66:12
              tier: quran
      - name: Sign (ayah)
        value: Made together with her son a singular divine sign (ayah) for all peoples
        topics:
          - nubuwwah
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 21:91
          authority:
            - source: Qur'an
              ref: Al-Anbiya 21:91
              tier: quran
      - name: Rank among women
        value: Chosen and purified as the mistress of the women of her own world (her historical era), whereas Fatimah al-Zahra is the mistress of the women of all worlds from first to last
        topics:
          - nubuwwah
          - imamah
        citations:
          scripture:
            bible: none-cited
            other:
              - Quran 3:42
          authority:
            - source: Ma'ani al-Akhbar
              ref: book 1, ch. 40, hadith 1
              tier: hadith
              url: https://thaqalayn.net/hadith/28/1/40/1
              quote: "I said to Abu Abdillah, peace be upon him: Inform me about the saying of Allah’s Messenger, Allah’s blessings be upon him and his Family, with regards to Fatima that she is the Mistress of the women of all the worlds, is she the Mistress of the women of her world? So he said: That is for Maryam; she was the Mistress of the women of her world, whereas Fatima is the Mistress of the women of all the worlds, from the first and the last."
            - source: Qur'an
              ref: Al Imran 3:42
              tier: quran

  - id: shi.heavens-earth
    label: The heavens and the earth
    category: HeavensEarth
    referent: ref.heavens-earth
    attributes:
      - name: Made from
        topics: [creation]
        value: Nothing; an invention "not from a thing"
        citations:
          scripture: { bible: [Gen 1:1], other: [Quran 2:117] }
          authority:
            - source: Al-Kafi, Kitab al-Tawhid (Imam al-Rida)
              ref: vol. 1, book 3, ch. 11, hadith 3
              tier: hadith
              url: https://thaqalayn.net/hadith/1/3/11/3
              quote: an invention that came from His power and wisdom but not from a thing
    citations:
      scripture: { bible: [Gen 1:1], other: [Quran 21:30] }
      authority:
        - source: Qur'an
          ref: Al-Anbiya 21:30
          tier: quran


  - id: shi.adam
    label: Adam
    category: Human
    referent: ref.adam
    description: The first human, whom Allah chose and placed on earth as a vicegerent.
    attributes:
      - name: Created from
        topics: [humanity]
        value: Dust, then Allah said "Be"; the angels were commanded to prostrate to him
        citations:
          scripture: { bible: [{ ref: Gen 2:7, highlight: "formed man of the dust of the ground" }], other: [Quran 3:59, Quran 7:11, Quran 38:71-72] }
          authority:
            - source: Qur'an
              ref: Al Imran 3:59
              tier: quran
      - name: Slip and repentance
        topics: [humanity, adl]
        value: Adam disobeyed, then his Lord chose him and accepted his repentance
        citations:
          scripture: { bible: [Gen 3:6], other: [Quran 2:37, Quran 20:121-122, Quran 3:33] }
          authority:
            - source: Qur'an
              ref: Ta-Ha 20:122
              tier: quran
    citations:
      scripture: { bible: [Gen 2:7], other: [Quran 2:30, Quran 3:33] }
      authority:
        - source: Qur'an
          ref: Al-Baqarah 2:30
          tier: quran

  - id: shi.hawwa
    label: Hawwa' (Eve)
    category: Human
    referent: ref.eve
    description: Adam's mate, created from the same soul.
    citations:
      scripture: { bible: [Gen 2:21-22], other: [Quran 4:1, Quran 7:189] }
      authority:
        - source: Qur'an
          ref: An-Nisa 4:1
          tier: quran

edges:
