stances:
  - debate: debate.trinity
    stance: rejects
    summary: Jehovah alone is Almighty God. "There is no Scriptural basis for the Trinity doctrine."
    claims:
      - jw.jehovah#Trinity?
      - jw.jesus#Equal to Almighty God?
      - jw.holy-spirit#Part of Trinity?
    citations:
      scripture:
        bible:
          - Deut 6:4
          - Matt 24:36
          - John 17:3
          - Acts 7:55
      authority:
        - source: Is God a Trinity? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/trinity/
          quote: the God of the Bible is never described as being part of a Trinity
        - source: The Truth About the Father, the Son, and the Holy Spirit (Bible Teach)
          tier: watch-tower
          url: https://www.jw.org/en/library/books/bible-teach/father-son-holy-spirit-trinity/
          quote: Concerning that day and hour nobody knows, neither the angels of the heavens nor the Son, but only the Father... what about the holy spirit? If it is part of the same God as the Father, why does Jesus not say that it knows what the Father knows?
  - debate: debate.son-created
    stance: affirms
    claims: ["jw.e.jehovah-creates-jesus"]
    summary: Jesus is God's first creation, the only one created directly by God.
    citations:
      scripture: { bible: [Col 1:15, Rev 3:14] }
      authority:
        - { source: Why Is Jesus Called the Son of God? (jw.org), tier: watch-tower, url: "https://www.jw.org/en/bible-teachings/questions/jesus-son-of-god/", quote: "God created Jesus before he created anything else." }
  - debate: debate.immortal-soul
    stance: rejects
    claims: ["jw.adam#At death", "category:Soul"]
    summary: The soul is the whole living person, and it dies.
    citations:
      scripture: { bible: [Ezek 18:4] }
      authority:
        - { source: What Is the Soul? (jw.org), tier: watch-tower, url: "https://www.jw.org/en/bible-teachings/questions/what-is-a-soul/", quote: "The soul, then, is the entire creature, not something inside that survives the death of the body." }
  - debate: debate.inherited-guilt
    stance: reframes
    claims: ["jw.adam#What descendants inherit"]
    summary: Descendants inherit a sinful condition, like a genetic defect, but "God does not blame us for what Adam and Eve did".
    citations:
      scripture: { bible: [Rom 5:12, Ps 103:14] }
      authority:
        - { source: What Was the Original Sin? (jw.org), tier: watch-tower, url: "https://www.jw.org/en/bible-teachings/questions/original-sin/", quote: "Adam and Eve passed on their sinful condition to all their descendants." }
  - debate: debate.crucifixion
    stance: reframes
    summary: Jesus died by execution, but on an upright stake, not a cross.
    claims:
      - jw.jesus#Instrument of death
    citations:
      scripture:
        bible:
          - John 19:17
          - Acts 5:30
          - Gal 3:13
      authority:
        - source: "What Does the Bible Really Teach?, Appendix: Why True Christians Do Not Use the Cross in Worship"
          tier: watch-tower
          url: https://www.jw.org/en/library/books/bible-teach/origin-cross-symbol-pagan/
          quote: An important reason is that Jesus Christ did not die on a cross. The Greek word generally translated “cross” is stau·rosʹ. It basically means “an upright pale or stake.”... In several texts, Bible writers use another word for the instrument of Jesus’ death. It is the Greek word xyʹlon... This word simply means “timber” or “a stick, club, or tree.”
  - debate: debate.bodily-resurrection
    stance: rejects
    claims: ["jw.jesus#Resurrection", "jw.e.jesus-becomes-spirit"]
    summary: Jesus was raised as a spirit, not with his flesh-and-blood body.
    citations:
      scripture: { bible: [1 Pet 3:18] }
      authority:
        - { source: "After Jesus' Resurrection, Was His Body Flesh or Spirit? (jw.org)", tier: watch-tower, url: "https://www.jw.org/en/bible-teachings/questions/jesus-body/", quote: "Jesus' own words showed that he would not be resurrected with his flesh-and-blood body." }
  - debate: debate.theotokos
    stance: rejects
    summary: The Bible does not teach that Mary is the Mother of God, nor does it approve worshipping or venerating her. Mary gave birth to the Son of God, not God himself, and neither the expression Theotokos nor the idea appears in Scripture.
    claims:
      - jw.e.mary-bears-jesus
      - jw.jesus#Equal to Almighty God?
      - jw.jehovah#Beginning
    citations:
      scripture:
        bible:
          - Mark 1:1
          - Luke 1:32
      authority:
        - source: Is Mary the Mother of God? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/mother-mary-theotokos/
          quote: No, the Bible does not teach that Mary is the mother of God, nor does it suggest that Christians should either worship or venerate Mary.
        - source: Mary (Jesus’ Mother) (Reasoning From the Scriptures)
          tier: watch-tower
          url: https://www.jw.org/en/library/books/Reasoning-From-the-Scriptures/Mary-Jesus-Mother/
          quote: However, neither that expression nor the idea is found in the text of any translation of the Bible.
  - debate: debate.two-natures
    stance: rejects
    summary: The doctrine of the Trinity and the teaching that Jesus had two natures are rejected. The Father knows more than the Son, disproving equality in knowledge.
    claims:
      - jw.jesus#Equal to Almighty God?
    citations:
      scripture:
        bible:
          - Matt 24:36
          - John 1:18
          - John 17:3
      authority:
        - source: "What Does the Bible Really Teach?, Appendix: The Truth About the Father, the Son, and the Holy Spirit"
          tier: watch-tower
          url: https://www.jw.org/en/library/books/bible-teach/father-son-holy-spirit-trinity/
          quote: "Jesus says that the Father knows more than the Son does. If Jesus were part of Almighty God, however, he would know the same facts as his Father. So, then, the Son and the Father cannot be equal. Yet, some will say: ‘Jesus had two natures. Here he speaks as a man.’ But even if that were so, what about the holy spirit?"

# Categories use the vocabulary of Watch Tower publications on jw.org.
categories:
  - id: AlmightyGod
    label: Almighty God
    term:
      kind: own
      url: https://www.jw.org/en/bible-teachings/questions/trinity/
      quote: Is Jesus Christ the same as Almighty God?
    group: true
    definition: '"The only true God", whose name is Jehovah. Not a Trinity: "God is only one."'
    citations:
      scripture: { bible: [Deut 6:4, Ps 83:18, John 17:3, Gal 3:20] }
      authority:
        - source: Is God a Trinity? (jw.org, Bible Questions Answered)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/trinity/
          quote: the God of the Bible is never described as being part of a Trinity

  - id: ActiveForce
    label: Active force (impersonal)
    term:
      kind: own
      url: https://www.jw.org/en/bible-teachings/questions/what-is-the-holy-spirit/
      quote: The Bible’s answer The holy spirit is God’s power in action, his active force.
    group: true
    definition: God's power in action, which he projects to accomplish his will. It is not a person.
    citations:
      scripture: { bible: [Mic 3:8, Luke 1:35, Ps 104:30, Ps 139:7] }
      authority:
        - source: What Is the Holy Spirit? (jw.org, Bible Questions Answered)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/what-is-the-holy-spirit/
          quote: The holy spirit is God's power in action, his active force.

  - id: Creation
    label: Creation
    term:
      kind: own
      url: https://www.jw.org/en/bible-teachings/questions/jesus-son-of-god/
      quote: ( Luke 3:38 ) However, because Jesus was God’s first creation and the only one created directly by him, the Bible describes Jesus as the foremost Son of God.
    group: true
    definition: Everything other than God. Jesus was God's first creation, and everything else was created through him.
    citations:
      scripture: { bible: [Rev 4:11, Col 1:15-16] }
      authority:
        - source: Why Is Jesus Called the Son of God? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/jesus-son-of-god/
          quote: God worked through Jesus to bring every other creation into existence.

  - id: SpiritCreature
    label: Spirit creature
    term:
      kind: own
      url: https://www.jw.org/en/bible-teachings/questions/jesus-son-of-god/
      quote: Jesus was a spirit creature in heaven before he was born as a human on earth.
    parent: Creation
    definition: An invisible, heavenly creature (Jesus in his prehuman and resurrected life, and the angels). Spirit creatures can take on human form temporarily.
    citations:
      scripture: { bible: [John 6:38, 1 Pet 3:18, Gen 18:1-8] }
      authority:
        - source: Why Is Jesus Called the Son of God? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/jesus-son-of-god/
          quote: Jesus was a spirit creature in heaven before he was born as a human on earth.

  - id: Soul
    label: Living soul (human)
    term:
      kind: own
      url: https://www.jw.org/en/bible-teachings/questions/what-is-a-soul/
      quote: "Consider how the Bible shows that the human soul is the whole person: Adam was not given a soul​—he “became a living soul”"
    parent: Creation
    definition: '"The soul, then, is the entire creature, not something inside that survives the death of the body." A human does not have a soul; a human is a soul.'
    citations:
      scripture: { bible: [Gen 2:7, Ezek 18:4] }
      authority:
        - source: What Is the Soul? (jw.org, Bible Questions Answered)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/what-is-a-soul/
          quote: The soul, then, is the entire creature, not something inside that survives the death of the body.

  - id: Universe
    label: Physical universe
    term:
      kind: own
      url: https://www.jw.org/en/bible-teachings/questions/jesus-son-of-god/
      quote: This creation included all other spirit creatures , as well as the physical universe.
    parent: Creation
    definition: The material heavens and earth, created by God through his Son.
    citations:
      scripture: { bible: [Ps 33:6, Col 1:16] }
      authority:
        - source: Why Is Jesus Called the Son of God? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/jesus-son-of-god/
          quote: This creation included all other spirit creatures, as well as the physical universe.

