  - { id: jesus, label: "Jesus", registry: [topic.christ, topic.incarnation], source: { source: "What Do Jehovah's Witnesses Believe? (jw.org)", ref: "basic beliefs", tier: watch-tower, url: "https://www.jw.org/en/jehovahs-witnesses/faq/jehovah-witness-beliefs/" } }
