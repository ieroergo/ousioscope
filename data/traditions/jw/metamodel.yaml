tradition:
  id: jw
  name: Jehovah's Witnesses
  shortName: Jehovah's Witnesses
  scripture: { bible: nwt, other: nwt }
  otherScriptureLabel: Other
  tiers:
    - { id: watch-tower, label: "Watch Tower publication (jw.org, Watchtower, books)" }
    - { id: reference, label: "Reference work quoted by Watch Tower" }
  hermeneutic:
    summary: >-
      The Bible explains itself, and Christ's appointed "faithful and discreet slave" (the Governing Body)
      provides "food at the proper time". It is "neither inspired nor infallible", so understandings can be
      clarified.
    citations:
      scripture: { bible: [Matt 24:45] }
      authority:
        - source: 'The Watchtower, "Who Is Leading God''s People Today?"'
          ref: w17 February pp. 23-28, par. 10-12
          tier: watch-tower
          url: https://wol.jw.org/en/wol/d/r1/lp-e/2017283
          quote: The Governing Body is neither inspired nor infallible. Therefore, it can err in doctrinal matters or in organizational direction.
  allowedDomains: [jw.org, wol.jw.org]

# The tradition's own outline of teaching, in its own words. Data is organized by these topics:
