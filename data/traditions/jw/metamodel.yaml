  - { id: death, label: "Death", registry: [topic.afterlife, topic.resurrection, topic.humanity], source: { source: "What Do Jehovah's Witnesses Believe? (jw.org)", ref: "basic beliefs", tier: watch-tower, url: "https://www.jw.org/en/jehovahs-witnesses/faq/jehovah-witness-beliefs/" } }
