  - { id: salvation, label: "Salvation", registry: [topic.salvation, topic.atonement], source: { source: "What Do Jehovah's Witnesses Believe? (jw.org)", ref: "basic beliefs", tier: watch-tower, url: "https://www.jw.org/en/jehovahs-witnesses/faq/jehovah-witness-beliefs/" } }
  - { id: heaven, label: "Heaven", registry: [topic.afterlife, topic.angels], source: { source: "What Do Jehovah's Witnesses Believe? (jw.org)", ref: "basic beliefs", tier: watch-tower, url: "https://www.jw.org/en/jehovahs-witnesses/faq/jehovah-witness-beliefs/" } }
  - { id: earth, label: "Earth", registry: [topic.last-things, topic.afterlife], source: { source: "What Do Jehovah's Witnesses Believe? (jw.org)", ref: "basic beliefs", tier: watch-tower, url: "https://www.jw.org/en/jehovahs-witnesses/faq/jehovah-witness-beliefs/" } }
