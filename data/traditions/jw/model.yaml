# Individuals only. Every node is a registered referent.
nodes:
  - id: jw.jehovah
    label: Jehovah God (the Father)
    category: AlmightyGod
    referent: ref.father
    description: '"The only true God". The Father, the Creator and Source of all life.'
    attributes:
      - name: Trinity?
        topics: [god]
        value: No; "God is only one"
        citations:
          scripture: { bible: [Deut 6:4, Ps 83:18, John 17:3, Gal 3:20] }
          authority:
            - source: Is God a Trinity? (jw.org)
              tier: watch-tower
              url: https://www.jw.org/en/bible-teachings/questions/trinity/
      - name: Beginning
        value: God had no beginning and cannot have a mother; Mary could not have held him in her womb since even the heavens cannot contain him
        topics:
          - god
        citations:
          scripture:
            bible:
              - Ps 90:1-2
              - Isa 40:28
              - 1 Kgs 8:27
          authority:
            - source: Is Mary the Mother of God? (jw.org)
              tier: watch-tower
              url: https://www.jw.org/en/bible-teachings/questions/mother-mary-theotokos/
              quote: Since he had no beginning, he cannot have a mother. Furthermore, Mary could not have held God in her womb; the Bible makes clear that even the heavens cannot contain him.
    citations:
      scripture: { bible: [John 17:3, Ps 83:18, Ps 36:9] }
      authority:
        - source: Is God a Trinity? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/trinity/
          quote: '"You, whose name is Jehovah, you alone are the Most High over all the earth."'

  - id: jw.jesus
    label: Jesus Christ (the archangel Michael)
    category: SpiritCreature
    referent: ref.jesus
    description: God's firstborn Son and first creation. He lived in heaven before becoming human, and after his resurrection he is again a spirit creature.
    attributes:
      - name: Heavenly name
        topics: [jesus]
        value: '"Michael ... is evidently a name given to Jesus before and after his life on earth"'
        citations:
          scripture: { bible: [Jude 1:9, 1 Thess 4:16, Rev 12:7, Dan 12:1] }
          authority:
            - source: Who Is the Archangel Michael? (jw.org)
              tier: watch-tower
              url: https://www.jw.org/en/bible-teachings/questions/archangel-michael/
      - name: Equal to Almighty God?
        topics: [jesus, god]
        value: No; "The Father is greater than I am"
        citations:
          scripture: { bible: [John 14:28, Phil 2:9] }
          authority:
            - source: Is Jesus Almighty God? (jw.org)
              tier: watch-tower
              url: https://www.jw.org/en/bible-teachings/questions/is-jesus-almighty/
              quote: Jesus never claimed to be on the same level as Almighty God.
      - name: '"Son of God" means'
        topics: [jesus]
        value: God is the Creator or Source of Jesus' life; "the Bible does not teach that God literally fathered a child"
        citations:
          scripture: { bible: [John 1:49, Ps 36:9, Rev 4:11] }
          authority:
            - source: Why Is Jesus Called the Son of God? (jw.org)
              tier: watch-tower
              url: https://www.jw.org/en/bible-teachings/questions/jesus-son-of-god/
      - name: Resurrection
        topics: [jesus, death]
        value: '"Put to death in the flesh but made alive in the spirit". Not raised with his flesh-and-blood body; afterward he took on human forms temporarily'
        citations:
          scripture: { bible: [{ ref: 1 Pet 3:18, highlight: "made alive in the spirit" }, 1 Cor 15:45, Heb 9:11-12, John 20:19] }
          authority:
            - source: After Jesus' Resurrection, Was His Body Flesh or Spirit? (jw.org)
              tier: watch-tower
              url: https://www.jw.org/en/bible-teachings/questions/jesus-body/
              quote: Jesus' own words showed that he would not be resurrected with his flesh-and-blood body.
      - name: Lord in Luke 1:43
        value: Acknowledges Jesus as the foretold Messiah rather than Almighty God
        topics:
          - jesus
        citations:
          scripture:
            bible:
              - Luke 1:43
          authority:
            - source: Look! Jehovah's Slave Girl! (The Watchtower)
              tier: watch-tower
              url: https://www.jw.org/en/library/magazines/wp20080701/Look-Jehovahs-Slave-Girl/
              quote: Elizabeth heard Mary’s greeting and immediately felt the infant in her womb leap for joy. She was filled with holy spirit and spoke of Mary as “the mother of my Lord.” God revealed to Elizabeth that Mary’s son would become her Lord, the Messiah.
    citations:
      scripture: { bible: [John 1:1, John 17:5, John 6:38] }
      authority:
        - source: Why Is Jesus Called the Son of God? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/jesus-son-of-god/
          quote: When speaking of Jesus' prehuman life, the Bible calls Jesus "the Word."

  - id: jw.holy-spirit
    label: Holy spirit (God's active force)
    category: ActiveForce
    referent: ref.holy-spirit
    attributes:
      - name: Person?
        topics: [holy-spirit]
        value: No; "the Bible shows that the holy spirit is not a person"
        citations:
          scripture:
            bible:
              - Ex 15:8
              - together: [Isa 42:8, Luke 1:31, Acts 7:55]
                note: >-
                  The article reasons from these together: the Bible names Jehovah and Jesus but never names the
                  holy spirit, and in Stephen's vision he "saw only two persons, not three".
          authority:
            - source: What Is the Holy Spirit? (jw.org)
              tier: watch-tower
              url: https://www.jw.org/en/bible-teachings/questions/what-is-the-holy-spirit/
              quote: The Bible gives the names of Jehovah God and of his Son, Jesus Christ; yet, nowhere does it name the holy spirit.
      - name: Why titled holy
        value: Titled holy because it originates from Jehovah, who is clean and righteous to the highest degree, and because it is God's means to accomplish what is holy
        topics:
          - holy-spirit
        citations:
          scripture:
            bible:
              - Luke 1:35
              - Acts 1:8
          authority:
            - source: Holy Spirit (Bible Glossary)
              tier: watch-tower
              url: https://www.jw.org/en/library/books/bible-glossary/holy-spirit/
              quote: The invisible energizing force that God puts into action to accomplish his will. It is holy because it comes from Jehovah, who is clean and righteous to the highest degree, and because it is God’s means to accomplish what is holy.
      - name: Meaning of "spirit"
        value: The Hebrew word ruʹach and Greek word pneuʹma refer to that which is invisible to human sight and gives evidence of force in motion, including God's active force as distinct from wind, breath, and creature life-force
        topics:
          - holy-spirit
        citations:
          scripture:
            bible:
              - Ex 35:21
              - Ps 104:29
              - Luke 11:13
          authority:
            - source: Spirit (Bible Glossary)
              tier: watch-tower
              url: https://www.jw.org/en/library/books/bible-glossary/spirit/
              quote: The Hebrew word ruʹach and the Greek word pneuʹma, often translated “spirit,” have a number of meanings. All of them refer to that which is invisible to human sight and gives evidence of force in motion. The Hebrew and Greek words are used with reference to (1) wind, (2) the active life-force in earthly creatures... and (6) God’s active force, or holy spirit.
      - name: Impersonal operations
        value: Described through impersonal operations such as being filled with, baptized with, or poured out, demonstrating it is an impersonal force rather than an individual entity
        topics:
          - holy-spirit
        citations:
          scripture:
            bible:
              - Luke 1:41
              - Matt 3:11
              - Acts 10:38
              - Acts 10:44-45
          authority:
            - source: Is the Holy Spirit a Person? (The Bible's Viewpoint)
              tier: watch-tower
              url: https://www.jw.org/en/library/magazines/g200607/Is-the-Holy-Spirit-a-Person/
              quote: An honest Bible reader cannot help but conclude that the holy spirit differs from official church descriptions of it as a person... Elizabeth was filled with holy spirit... Is it reasonable that a person would be “filled” with another person?... That one will baptize you people with holy spirit... John could hardly have been referring to the holy spirit as a person when he spoke of baptizing people with it.
      - name: Personification as helper
        value: Scriptural personification as a helper is a grammatical figure of speech reflecting the masculine gender of the Greek noun parakletos, whereas the neuter noun pneuma takes genderless pronouns
        topics:
          - holy-spirit
        citations:
          scripture:
            bible:
              - Prov 1:20
              - John 14:16-17
              - John 16:7-15
              - Rom 5:17
              - Rom 5:21
          authority:
            - source: What Is the Holy Spirit? (jw.org)
              tier: watch-tower
              url: https://www.jw.org/en/bible-teachings/questions/what-is-the-holy-spirit/
              quote: The Scriptures do at times personify the holy spirit, but this does not prove that the holy spirit is a person. The Bible also personifies wisdom, death, and sin... when the apostle John quoted Jesus, he personified the holy spirit as a “helper” (paraclete)... because the Greek word for “helper”... is a masculine noun and requires a masculine pronoun according to the rules of Greek grammar. When John referred to the holy spirit using the neuter noun... he used the genderless pronoun “it.”
      - name: Part of Trinity?
        value: No; it is not a person in a triune Godhead, is not equal to the Father, and lacks omniscience since only the Father knows the day and hour
        topics:
          - holy-spirit
          - god
        citations:
          scripture:
            bible:
              - Matt 24:36
              - Acts 7:55
          authority:
            - source: The Truth About the Father, the Son, and the Holy Spirit (Bible Teach)
              tier: watch-tower
              url: https://www.jw.org/en/library/books/bible-teach/father-son-holy-spirit-trinity/
              quote: Concerning that day and hour nobody knows, neither the angels of the heavens nor the Son, but only the Father... what about the holy spirit? If it is part of the same God as the Father, why does Jesus not say that it knows what the Father knows?
      - name: Role in creation
        value: God employed his holy spirit as his active force in creating the universe, moving over the surface of the waters like a craftsman uses his hands
        topics:
          - holy-spirit
          - creation
        citations:
          scripture:
            bible:
              - Gen 1:2
              - Ps 33:6
              - Isa 66:1-2
          authority:
            - source: What Is the Holy Spirit? (jw.org)
              tier: watch-tower
              url: https://www.jw.org/en/bible-teachings/questions/what-is-the-holy-spirit/
              quote: Just as a craftsman uses his hands and fingers to do his work, God has used his spirit to produce such results as the following... The universe
      - name: Operation at Jesus' baptism
        value: Descended upon Jesus like a fluttering dove, serving as the active force by which God anointed him as Messiah, King, and High Priest and marked him as his spirit-begotten Son
        topics:
          - holy-spirit
          - jesus
        citations:
          scripture:
            bible:
              - Matt 3:16-17
              - John 3:3-6
              - Isa 42:1
          authority:
            - source: Study notes on Matthew 3:16, 17 (Study Bible)
              tier: watch-tower
              url: https://www.jw.org/en/library/bible/study-bible/books/matthew/3/
              quote: or active force, descended upon Jesus at his baptism, it may have looked like the fluttering of a dove as it nears its perch... By this declaration accompanied by the outpouring of holy spirit, God evidently indicated that the man Jesus was His spirit-begotten Son... and anointed by spirit to be God’s appointed King and High Priest
      - name: Grieving the spirit
        value: Grieving the spirit does not mean wounding personal feelings, but acting contrary to its direction, which saddens Jehovah God as its Source
        topics:
          - holy-spirit
        citations:
          scripture:
            bible:
              - Ps 51:11
              - Eph 4:30
              - Gal 5:16
              - Gal 5:25-26
          authority:
            - source: Do Not Grieve Jehovah’s Holy Spirit (The Watchtower)
              tier: watch-tower
              url: https://www.jw.org/en/library/magazines/w20100515/Do-Not-Grieve-Jehovahs-Holy-Spirit/
              quote: Because the holy spirit produces qualities that are expressive of our heavenly Father’s personality, when we grieve it we grieve, or sadden, him
      - name: Blasphemy against
        value: The unforgivable sin, committed when someone maliciously rejects the obvious operation of God's active force and attributes its power to Satan the Devil
        topics:
          - holy-spirit
        citations:
          scripture:
            bible:
              - Mark 3:22
              - Mark 3:28-30
              - Heb 10:26-27
          authority:
            - source: What Is the Unforgivable Sin? (jw.org)
              tier: watch-tower
              url: https://www.jw.org/en/bible-teachings/questions/unforgivable-sin/
              quote: Some Jewish religious leaders in Jesus’ day committed the unforgivable sin. They knew that God’s holy spirit was the force behind Jesus’ miracles, yet they maliciously said that he got his power from Satan the Devil
    citations:
      scripture: { bible: [Mic 3:8, Luke 1:35] }
      authority:
        - source: What Is the Holy Spirit? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/what-is-the-holy-spirit/
          quote: The holy spirit is God's power in action, his active force.

  - id: jw.mary
    label: Mary
    category: Soul
    referent: ref.mary
    description: A virgin when she conceived and bore Jesus. Not the "Immaculate Conception".
    citations:
      scripture: { bible: [{ ref: Luke 1:26-27, highlight: "a virgin promised in marriage" }, Luke 1:34] }
      authority:
        - source: The Virgin Mary (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/virgin-mary-immaculate-conception/
    attributes:
      - name: Inherited imperfection
        value: Inherited sin and imperfection from Adam; presented a Mosaic sin offering at the temple after childbirth for purification from uncleanness
        topics:
          - evil
          - soul
        citations:
          scripture:
            bible:
              - Rom 5:12
              - Lev 12:1-8
              - Luke 2:22-24
          authority:
            - source: Mary (Jesus’ Mother) (Reasoning From the Scriptures)
              tier: watch-tower
              url: https://www.jw.org/en/library/books/Reasoning-From-the-Scriptures/Mary-Jesus-Mother/
              quote: The Bible reports that in accord with the requirement of the Mosaic Law, 40 days after Jesus’ birth Mary offered at the temple in Jerusalem a sin offering for purification from uncleanness. She, too, had inherited sin and imperfection from Adam.

  - id: jw.universe
    label: The heavens and the earth (physical universe)
    category: Universe
    referent: ref.heavens-earth
    citations:
      scripture: { bible: [Ps 33:6, Col 1:16] }
      authority:
        - source: Why Is Jesus Called the Son of God? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/jesus-son-of-god/


  - id: jw.adam
    label: Adam
    category: Soul
    referent: ref.adam
    description: The first human. He "was not given a soul—he became a living soul, or person".
    attributes:
      - name: Original sin
        topics: [evil]
        value: Eating from "the tree of the knowledge of good and bad", which rejected God's moral authority
        citations:
          scripture: { bible: [Gen 2:16-17, Gen 3:6, Rom 5:19] }
          authority:
            - source: What Was the Original Sin? (jw.org)
              tier: watch-tower
              url: https://www.jw.org/en/bible-teachings/questions/original-sin/
              quote: By eating from the tree, Adam and Eve took matters into their own hands, choosing to decide for themselves what is right and wrong.
      - name: What descendants inherit
        topics: [evil]
        value: Their "sinful condition", like "genetic defects". "God does not blame us for what Adam and Eve did"
        citations:
          scripture: { bible: [Rom 5:12, Ps 51:5, Ps 103:14] }
          authority:
            - source: What Was the Original Sin? (jw.org)
              tier: watch-tower
              url: https://www.jw.org/en/bible-teachings/questions/original-sin/
              quote: Adam and Eve passed on their sinful condition to all their descendants. This is similar to the way human parents pass on genetic defects.
      - name: At death
        topics: [death, soul]
        value: He died; the soul is mortal and does not survive the body
        citations:
          scripture: { bible: [Gen 3:19, Ezek 18:4] }
          authority:
            - source: What Is the Soul? (jw.org)
              tier: watch-tower
              url: https://www.jw.org/en/bible-teachings/questions/what-is-a-soul/
              quote: The soul, then, is the entire creature, not something inside that survives the death of the body.
    citations:
      scripture: { bible: [Gen 2:7] }
      authority:
        - source: What Is the Soul? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/what-is-a-soul/
          quote: Adam was not given a soul—he became a living soul, or person.

  - id: jw.eve
    label: Eve
    category: Soul
    referent: ref.eve
    description: The first woman. God did not curse women because Eve ate first.
    citations:
      scripture: { bible: [Gen 3:6, Gen 3:14] }
      authority:
        - source: What Was the Original Sin? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/original-sin/

edges:
  - id: jw.e.jehovah-creates-jesus
    source: jw.jehovah
    rel: creates
    target: jw.jesus
    note: First, before anything else. "The firstborn of all creation", "the beginning of the creation by God".
    citations:
      scripture: { bible: [Col 1:15, Rev 3:14, Mic 5:2] }
      authority:
        - source: Why Is Jesus Called the Son of God? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/jesus-son-of-god/
          quote: God created Jesus before he created anything else.

  - id: jw.e.jehovah-creates-universe
    source: jw.jehovah
    rel: creates
    target: jw.universe
    note: Through his Son, "by means of him", and employing his holy spirit as his active force like a craftsman uses his hands.
    citations:
      scripture:
        bible:
          - Gen 1:2
          - Ps 33:6
          - Isa 66:1-2
          - Col 1:16
          - Rev 4:11
      authority:
        - source: Why Is Jesus Called the Son of God? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/jesus-son-of-god/
          quote: God worked through Jesus to bring every other creation into existence.
        - source: What Is the Holy Spirit? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/what-is-the-holy-spirit/
          quote: Just as a craftsman uses his hands and fingers to do his work, God has used his spirit to produce such results as the following... The universe

  - id: jw.e.jesus-builds-universe
    source: jw.jesus
    rel: builds
    target: jw.universe
    citations:
      scripture: { bible: [Prov 8:30, Col 1:16] }
      authority:
        - source: Why Is Jesus Called the Son of God? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/jesus-son-of-god/
          quote: He helped his Father create all other things. Jesus worked alongside God "as a master worker."

  - id: jw.e.jehovah-projects-spirit
    source: jw.jehovah
    rel: projects
    target: jw.holy-spirit
    note: God is not present everywhere at all times; he dwells in the spirit realm in heaven and projects his active force to any corner of creation to accomplish his will.
    citations:
      scripture:
        bible:
          - 1 Kgs 8:39
          - Ps 104:30
          - Ps 139:7
          - Luke 11:13
      authority:
        - source: What Is the Holy Spirit? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/what-is-the-holy-spirit/
          quote: The holy spirit is God’s power in action, his active force... God sends out his spirit by projecting his energy to any place to accomplish his will
        - source: Is the Holy Spirit a Person? (The Bible's Viewpoint)
          tier: watch-tower
          url: https://www.jw.org/en/library/magazines/g200607/Is-the-Holy-Spirit-a-Person/
          quote: Contrary to popular belief, God is not present everywhere at all times. Rather, he dwells in the spirit realm, in an “established place of dwelling,” or residence... from his “established place of dwelling,” he can use his active force to reach out into every corner of both the spirit realm and the physical realm

  - id: jw.e.spirit-overshadows-mary
    source: jw.holy-spirit
    rel: overshadows
    target: jw.mary
    citations:
      scripture: { bible: [{ ref: Luke 1:35, highlight: "power of the Most High will overshadow you" }, Matt 1:18] }
      authority:
        - source: The Virgin Mary (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/virgin-mary-immaculate-conception/
          quote: Mary's pregnancy came about by means of holy spirit, which is God's power in action.

  - id: jw.e.jehovah-transfers-jesus
    source: jw.jehovah
    rel: transfers
    target: jw.jesus
    note: '"God miraculously transferred his Son''s life to the womb of Mary."'
    citations:
      scripture: { bible: [Luke 1:35, Heb 10:5] }
      authority:
        - source: The Virgin Mary (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/virgin-mary-immaculate-conception/

  - id: jw.e.jesus-becomes-human
    source: jw.jesus
    rel: becomes
    targetKind: Soul
    quantifier: some
    note: '"Born a perfect human, an equal to what Adam had been before he sinned."'
    citations:
      scripture: { bible: [John 6:38, Heb 10:5, 1 Pet 2:22] }
      authority:
        - source: The Virgin Mary (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/virgin-mary-immaculate-conception/
          quote: Jesus was thus born a perfect human, an equal to what Adam had been before he sinned.

  - id: jw.e.jesus-becomes-spirit
    source: jw.jesus
    rel: becomes
    targetKind: SpiritCreature
    quantifier: some
    note: At his resurrection. "Made alive in the spirit."
    citations:
      scripture: { bible: [{ ref: 1 Pet 3:18, highlight: "made alive in the spirit" }, 1 Cor 15:45] }
      authority:
        - source: After Jesus' Resurrection, Was His Body Flesh or Spirit? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/jesus-body/
          quote: The Bible says that Jesus "was put to death in the flesh but made alive [resurrected] in the spirit."

  - id: jw.e.mary-bears-jesus
    source: jw.mary
    rel: bears
    target: jw.jesus
    asTo: Soul
    note: Mary gave birth to the Son of God rather than God himself, and never claimed to be the mother of God.
    citations:
      scripture:
        bible:
          - together:
              - Isa 7:14
              - Matt 1:23
            note: The article reads Isaiah's prophecy together with Matthew's application of it to Mary.
          - Luke 1:31
          - Mark 1:1
          - Luke 1:32
      authority:
        - source: The Virgin Mary (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/virgin-mary-immaculate-conception/
          quote: Under divine inspiration, the Gospel writer Matthew applied Isaiah's prophecy to Mary's conception of Jesus.
        - source: Is Mary the Mother of God? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/mother-mary-theotokos/
          quote: Mary never claimed that she was the mother of God. The Bible explains that she gave birth to “the Son of God,” not God himself.


  - id: jw.e.jehovah-creates-adam
    source: jw.jehovah
    rel: creates
    target: jw.adam
    citations:
      scripture: { bible: [Gen 2:7] }
      authority:
        - source: What Is the Soul? (jw.org)
          tier: watch-tower
          url: https://www.jw.org/en/bible-teachings/questions/what-is-a-soul/
          quote: When Jehovah God created the first man, Adam, the Bible says that "man became a living soul."

  - id: jw.e.eve-from-adam
    source: jw.eve
    rel: formedFrom
    target: jw.adam
    citations:
      scripture: { bible: [Gen 2:21-22] }
      authority:
        - source: New World Translation (Watch Tower)
          ref: Genesis 2:21-22
          tier: watch-tower
          url: https://wol.jw.org/en/wol/b/r1/lp-e/nwtsty/1/2
  - id: jw.e.jehovah-anoints-jesus
    source: jw.jehovah
    rel: anoints
    target: jw.jesus
    note: At his baptism, accompanied by the holy spirit descending like a dove, God anointed Jesus with holy spirit and power to be King and High Priest.
    citations:
      scripture:
        bible:
          - Matt 3:16-17
