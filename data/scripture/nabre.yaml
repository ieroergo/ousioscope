verses:
  1 Cor 2:8: and which none of the rulers of this age knew; for if they had known it, they would not have crucified the Lord of glory.
  1 Cor 6:19: Do you not know that your body is a temple of the holy Spirit within you, whom you have from God, and that you are not your own?
  1 Cor 6:20: For you have been purchased at a price. Therefore, glorify God in your body.
  1 Cor 15:21: For since death came through a human being, the resurrection of the dead came also through a human being.
  1 Cor 15:22: For just as in Adam all die, so too in Christ shall all be brought to life,
  1 Cor 15:35: But someone may say, “How are the dead raised? With what kind of body will they come back?”
  1 Cor 15:36: You fool! What you sow is not brought to life unless it dies.
  1 Cor 15:37: And what you sow is not the body that is to be but a bare kernel of wheat, perhaps, or of some other kind;
  1 Cor 15:38: but God gives it a body as he chooses, and to each of the seeds its own body.
  1 Cor 15:39: Not all flesh is the same, but there is one kind for human beings, another kind of flesh for animals, another kind of flesh for birds, and another for fish.
  1 Cor 15:40: There are both heavenly bodies and earthly bodies, but the brightness of the heavenly is one kind and that of the earthly another.
  1 Cor 15:41: The brightness of the sun is one kind, the brightness of the moon another, and the brightness of the stars another. For star differs from star in brightness.
  1 Cor 15:42: So also is the resurrection of the dead. It is sown corruptible; it is raised incorruptible.
  1 Cor 15:43: It is sown dishonorable; it is raised glorious. It is sown weak; it is raised powerful.
  1 Cor 15:44: It is sown a natural body; it is raised a spiritual body. If there is a natural body, there is also a spiritual one.
  1 Cor 15:45: So, too, it is written, “The first man, Adam, became a living being,” the last Adam a life-giving spirit.
  1 Cor 15:46: But the spiritual was not first; rather the natural and then the spiritual.
  1 Cor 15:47: The first man was from the earth, earthly; the second man, from heaven.
  1 Cor 15:48: As was the earthly one, so also are the earthly, and as is the heavenly one, so also are the heavenly.
  1 Cor 15:49: Just as we have borne the image of the earthly one, we shall also bear the image of the heavenly one.
  1 Cor 15:50: "This I declare, brothers: flesh and blood cannot inherit the kingdom of God, nor does corruption inherit incorruption."
  1 Thess 4:14: For if we believe that Jesus died and rose, so too will God, through Jesus, bring with him those who have fallen asleep.
  2 Macc 7:28: I beg you, child, to look at the heavens and the earth and see all that is in them; then you will know that God did not make them out of existing things. In the same way humankind came into existence.
  Acts 2:42: They devoted themselves to the teaching of the apostles and to the communal life, to the breaking of the bread and to the prayers.
  Col 1:15: He is the image of the invisible God, the firstborn of all creation.
  Col 1:16: For in him were created all things in heaven and on earth, the visible and the invisible, whether thrones or dominions or principalities or powers; all things were created through him and for him.
  Col 1:17: He is before all things, and in him all things hold together.
  Deut 6:4: Hear, O Israel! The LORD is our God, the LORD alone!
  Ex 3:14: "God replied to Moses: I am who I am. Then he added: This is what you will tell the Israelites: I AM has sent me to you."
  Gal 4:4: But when the fullness of time had come, God sent his Son, born of a woman, born under the law,
  Gen 1:1: In the beginning, when God created the heavens and the earth—
  Gen 1:2: and the earth was without form or shape, with darkness over the abyss and a mighty wind sweeping over the waters—
  Gen 1:27: God created mankind in his image; in the image of God he created them; male and female he created them.
  Gen 2:7: then the LORD God formed the man out of the dust of the ground and blew into his nostrils the breath of life, and the man became a living being.
  Gen 2:18: "The LORD God said: It is not good for the man to be alone. I will make a helper suited to him."
  Gen 2:23: "the man said: “This one, at last, is bone of my bones and flesh of my flesh; This one shall be called ‘woman,’ for out of man this one has been taken.”"
  Gen 2:25: The man and his wife were both naked, yet they felt no shame.
  Gen 3:15: I will put enmity between you and the woman, and between your offspring and hers; They will strike at your head, while you strike at their heel.
  Heb 1:3: who is the refulgence of his glory, the very imprint of his being, and who sustains all things by his mighty word. When he had accomplished purification from sins, he took his seat at the right hand of the Majesty on high,
  Heb 4:15: For we do not have a high priest who is unable to sympathize with our weaknesses, but one who has similarly been tested in every way, yet without sin.
  Heb 10:5: "For this reason, when he came into the world, he said: “Sacrifice and offering you did not desire, but a body you prepared for me;"
  Isa 7:14: Therefore the Lord himself will give you a sign; the young woman, pregnant and about to bear a son, shall name him Emmanuel.
  John 1:1: In the beginning was the Word, and the Word was with God, and the Word was God.
  John 1:2: He was in the beginning with God.
  John 1:3: All things came to be through him, and without him nothing came to be. What came to be
  John 1:14: And the Word became flesh and made his dwelling among us, and we saw his glory, the glory as of the Father’s only Son, full of grace and truth.
  John 1:18: No one has ever seen God. The only Son, God, who is at the Father’s side, has revealed him.
  John 4:24: God is Spirit, and those who worship him must worship in Spirit and truth.”
  John 5:29: and will come out, those who have done good deeds to the resurrection of life, but those who have done wicked deeds to the resurrection of condemnation.
  John 6:38: because I came down from heaven not to do my own will but the will of the one who sent me.
  John 10:17: This is why the Father loves me, because I lay down my life in order to take it up again.
  John 10:18: No one takes it from me, but I lay it down on my own. I have power to lay it down, and power to take it up again. This command I have received from my Father.”
  John 14:17: the Spirit of truth, which the world cannot accept, because it neither sees nor knows it. But you know it, because it remains with you, and will be in you.
  John 14:26: The Advocate, the holy Spirit that the Father will send in my name—he will teach you everything and remind you of all that [I] told you.
  John 15:26: “When the Advocate comes whom I will send you from the Father, the Spirit of truth that proceeds from the Father, he will testify to me.
  John 16:13: But when he comes, the Spirit of truth, he will guide you to all truth. He will not speak on his own, but he will speak what he hears, and will declare to you the things that are coming.
  John 16:14: He will glorify me, because he will take from what is mine and declare it to you.
  John 20:27: Then he said to Thomas, “Put your finger here and see my hands, and bring your hand and put it into my side, and do not be unbelieving, but believe.”
  Luke 1:26: In the sixth month, the angel Gabriel was sent from God to a town of Galilee called Nazareth,
  Luke 1:27: to a virgin betrothed to a man named Joseph, of the house of David, and the virgin’s name was Mary.
  Luke 1:28: And coming to her, he said, “Hail, favored one! The Lord is with you.”
  Luke 1:34: But Mary said to the angel, “How can this be, since I have no relations with a man?”
  Luke 1:35: And the angel said to her in reply, “The holy Spirit will come upon you, and the power of the Most High will overshadow you. Therefore the child to be born will be called holy, the Son of God.
  Luke 1:43: And how does this happen to me, that the mother of my Lord should come to me?
  Luke 2:11: For today in the city of David a savior has been born for you who is Messiah and Lord.
  Luke 2:52: And Jesus advanced [in] wisdom and age and favor before God and man.
  Luke 24:39: Look at my hands and my feet, that it is I myself. Touch me and see, because a ghost does not have flesh and bones as you can see I have.”
  Mark 12:29: "Jesus replied, “The first is this: ‘Hear, O Israel! The Lord our God is Lord alone!"
  Matt 1:20: Such was his intention when, behold, the angel of the Lord appeared to him in a dream and said, “Joseph, son of David, do not be afraid to take Mary your wife into your home. For it is through the holy Spirit that this child has been conceived in her.
  Matt 1:21: She will bear a son and you are to name him Jesus, because he will save his people from their sins.”
  Matt 1:23: “Behold, the virgin shall be with child and bear a son, and they shall name him Emmanuel,” which means “God is with us.”
  Matt 10:28: And do not be afraid of those who kill the body but cannot kill the soul; rather, be afraid of the one who can destroy both soul and body in Gehenna.
  Matt 11:27: All things have been handed over to me by my Father. No one knows the Son except the Father, and no one knows the Father except the Son and anyone to whom the Son wishes to reveal him.
  Matt 16:16: Simon Peter said in reply, “You are the Messiah, the Son of the living God.”
  Matt 28:19: Go, therefore, and make disciples of all nations, baptizing them in the name of the Father, and of the Son, and of the holy Spirit,
  Phil 2:5: Have among yourselves the same attitude that is also yours in Christ Jesus,
  Phil 2:6: Who, though he was in the form of God, did not regard equality with God something to be grasped.
  Phil 2:7: Rather, he emptied himself, taking the form of a slave, coming in human likeness; and found human in appearance,
  Phil 2:8: he humbled himself, becoming obedient to death, even death on a cross.
  Ps 33:6: By the LORD’s word the heavens were made; by the breath of his mouth all their host.
  Ps 104:30: Send forth your spirit, they are created and you renew the face of the earth.
  Rom 4:17: as it is written, “I have made you father of many nations.” He is our father in the sight of God, in whom he believed, who gives life to the dead and calls into being what does not exist.
  Rom 5:12: Therefore, just as through one person sin entered the world, and through sin, death, and thus death came to all, inasmuch as all sinned—
  Rom 5:19: For just as through the disobedience of one person the many were made sinners, so through the obedience of one the many will be made righteous.
