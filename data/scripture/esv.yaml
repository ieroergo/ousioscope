verses:
  1 Cor 2:10: these things God has revealed to us through the Spirit. For the Spirit searches everything, even the depths of God.
  1 Cor 2:11: For who knows a person's thoughts except the spirit of that person, which is in him? So also no one comprehends the thoughts of God except the Spirit of God.
  1 Cor 8:4: Therefore, as to the eating of food offered to idols, we know that “an idol has no real existence,” and that “there is no God but one.”
  1 Cor 15:3: "For I delivered to you as of first importance what I also received: that Christ died for our sins in accordance with the Scriptures,"
  1 Cor 15:4: that he was buried, that he was raised on the third day in accordance with the Scriptures,
  1 Cor 15:21: For as by a man came death, by a man has come also the resurrection of the dead.
  1 Cor 15:22: For as in Adam all die, so also in Christ shall all be made alive.
  1 Cor 15:42: So is it with the resurrection of the dead. What is sown is perishable; what is raised is imperishable.
  1 Cor 15:43: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
  1 Cor 15:44: It is sown a natural body; it is raised a spiritual body. If there is a natural body, there is also a spiritual body.
  1 Cor 15:45: Thus it is written, “The first man Adam became a living being”; the last Adam became a life-giving spirit.
  1 Cor 15:49: Just as we have borne the image of the man of dust, we shall also bear the image of the man of heaven.
  1 John 5:20: And we know that the Son of God has come and has given us understanding, so that we may know him who is true; and we are in him who is true, in his Son Jesus Christ. He is the true God and eternal life.
  1 Pet 3:18: For Christ also suffered once for sins, the righteous for the unrighteous, that he might bring us to God, being put to death in the flesh but made alive in the spirit,
  1 Tim 3:16: "Great indeed, we confess, is the mystery of godliness: He was manifested in the flesh, vindicated by the Spirit, seen by angels, proclaimed among the nations, believed on in the world, taken up in glory. <div"
  2 Cor 11:3: But I am afraid that as the serpent deceived Eve by his cunning, your thoughts will be led astray from a sincere and pure devotion to Christ.
  2 Cor 13:14: The grace of the Lord Jesus Christ and the love of God and the fellowship of the Holy Spirit be with you all. <div
  Acts 5:3: But Peter said, “Ananias, why has Satan filled your heart to lie to the Holy Spirit and to keep back for yourself part of the proceeds of the land?
  Acts 5:4: While it remained unsold, did it not remain your own? And after it was sold, was it not at your disposal? Why is it that you have contrived this deed in your heart? You have not lied to man but to God.”
  Acts 17:24: The God who made the world and everything in it, being Lord of heaven and earth, does not live in temples made by man,
  Acts 17:26: And he made from one man every nation of mankind to live on all the face of the earth, having determined allotted periods and the boundaries of their dwelling place,
  Col 1:16: For by him all things were created, in heaven and on earth, visible and invisible, whether thrones or dominions or rulers or authorities—all things were created through him and for him.
  Col 2:9: For in him the whole fullness of deity dwells bodily,
  Deut 4:15: “Therefore watch yourselves very carefully. Since you saw no form on the day that the Lord spoke to you at Horeb out of the midst of the fire,
  Deut 4:16: beware lest you act corruptly by making a carved image for yourselves, in the form of any figure, the likeness of male or female,
  Deut 6:4: "“Hear, O Israel: The Lord our God, the Lord is one."
  Eccl 12:7: and the dust returns to the earth as it was, and the spirit returns to God who gave it.
  Gal 3:12: But the law is not of faith, rather “The one who does them shall live by them.”
  Gal 4:4: But when the fullness of time had come, God sent forth his Son, born of woman, born under the law,
  Gal 4:6: And because you are sons, God has sent the Spirit of his Son into our hearts, crying, “Abba! Father!”
  Gen 1:1: In the beginning, God created the heavens and the earth.
  Gen 1:2: The earth was without form and void, and darkness was over the face of the deep. And the Spirit of God was hovering over the face of the waters.
  Gen 1:27: So God created man in his own image, in the image of God he created him; male and female he created them.
  Gen 1:28: And God blessed them. And God said to them, “Be fruitful and multiply and fill the earth and subdue it, and have dominion over the fish of the sea and over the birds of the heavens and over every living thing that moves on the earth.”
  Gen 2:7: then the Lord God formed the man of dust from the ground and breathed into his nostrils the breath of life, and the man became a living creature.
  Gen 2:16: And the Lord God commanded the man, saying, “You may surely eat of every tree of the garden,
  Gen 2:17: but of the tree of the knowledge of good and evil you shall not eat, for in the day that you eat of it you shall surely die.”
  Gen 2:22: And the rib that the Lord God had taken from the man he made into a woman and brought her to the man.
  Gen 3:13: Then the Lord God said to the woman, “What is this that you have done?” The woman said, “The serpent deceived me, and I ate.”
  Gen 5:3: When Adam had lived 130 years, he fathered a son in his own likeness, after his image, and named him Seth.
  Gen 6:5: The Lord saw that the wickedness of man was great in the earth, and that every intention of the thoughts of his heart was only evil continually.
  Heb 1:2: but in these last days he has spoken to us by his Son, whom he appointed the heir of all things, through whom also he created the world.
  Heb 1:5: For to which of the angels did God ever say, “You are my Son, today I have begotten you”? Or again, “I will be to him a father, and he shall be to me a son”?
  Heb 1:6: And again, when he brings the firstborn into the world, he says, “Let all God's angels worship him.”
  Heb 2:14: Since therefore the children share in flesh and blood, he himself likewise partook of the same things, that through death he might destroy the one who has the power of death, that is, the devil,
  Heb 4:15: For we do not have a high priest who is unable to sympathize with our weaknesses, but one who in every respect has been tempted as we are, yet without sin.
  Heb 11:3: By faith we understand that the universe was created by the word of God, so that what is seen was not made out of things that are visible.
  Jer 17:9: The heart is deceitful above all things, and desperately sick; who can understand it?
  Job 14:4: Who can bring a clean thing out of an unclean? There is not one.
  Job 15:14: What is man, that he can be pure? Or he who is born of a woman, that he can be righteous?
  Job 19:26: And after my skin has been thus destroyed, yet in my flesh I shall see God,
  Job 19:27: whom I shall see for myself, and my eyes shall behold, and not another. My heart faints within me!
  Job 26:13: By his wind the heavens were made fair; his hand pierced the fleeing serpent.
  Job 33:4: The Spirit of God has made me, and the breath of the Almighty gives me life.
  John 1:1: In the beginning was the Word, and the Word was with God, and the Word was God.
  John 1:2: He was in the beginning with God.
  John 1:3: All things were made through him, and without him was not any thing made that was made.
  John 1:14: And the Word became flesh and dwelt among us, and we have seen his glory, glory as of the only Son from the Father, full of grace and truth.
  John 1:18: No one has ever seen God; God the only Son, who is at the Father's side, he has made him known.
  John 4:24: God is spirit, and those who worship him must worship in spirit and truth.”
  John 10:30: I and the Father are one.”
  John 15:26: “But when the Helper comes, whom I will send to you from the Father, the Spirit of truth, who proceeds from the Father, he will bear witness about me.
  John 20:25: So the other disciples told him, “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and place my finger into the mark of the nails, and place my hand into his side, I will never believe.”
  John 20:27: Then he said to Thomas, “Put your finger here, and see my hands; and put out your hand, and place it in my side. Do not disbelieve, but believe.”
  Luke 1:27: to a virgin betrothed to a man whose name was Joseph, of the house of David. And the virgin's name was Mary.
  Luke 1:31: And behold, you will conceive in your womb and bear a son, and you shall call his name Jesus.
  Luke 1:35: And the angel answered her, “The Holy Spirit will come upon you, and the power of the Most High will overshadow you; therefore the child to be born will be called holy—the Son of God.
  Luke 1:42: and she exclaimed with a loud cry, “Blessed are you among women, and blessed is the fruit of your womb!
  Luke 23:43: And he said to him, “Truly, I say to you, today you will be with me in paradise.”
  Luke 24:39: See my hands and my feet, that it is I myself. Touch me, and see. For a spirit does not have flesh and bones as you see that I have.”
  Matt 3:16: And when Jesus was baptized, immediately he went up from the water, and behold, the heavens were opened to him, and he saw the Spirit of God descending like a dove and coming to rest on him;
  Matt 3:17: and behold, a voice from heaven said, “This is my beloved Son, with whom I am well pleased.” <div
  Matt 10:28: And do not fear those who kill the body but cannot kill the soul. Rather fear him who can destroy both soul and body in hell.
  Matt 26:38: Then he said to them, “My soul is very sorrowful, even to death; remain here, and watch with me.”
  Matt 28:19: Go therefore and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit,
  Phil 2:6: who, though he was in the form of God, did not count equality with God a thing to be grasped,
  Ps 51:5: Behold, I was brought forth in iniquity, and in sin did my mother conceive me.
  Rom 3:10: "as it is written: “None is righteous, no, not one;"
  Rom 3:11: no one understands; no one seeks for God.
  Rom 3:12: All have turned aside; together they have become worthless; no one does good, not even one.”
  Rom 3:13: “Their throat is an open grave; they use their tongues to deceive.” “The venom of asps is under their lips.”
  Rom 3:14: “Their mouth is full of curses and bitterness.”
  Rom 3:15: “Their feet are swift to shed blood;
  Rom 3:16: in their paths are ruin and misery,
  Rom 3:17: and the way of peace they have not known.”
  Rom 3:18: “There is no fear of God before their eyes.”
  Rom 3:19: Now we know that whatever the law says it speaks to those who are under the law, so that every mouth may be stopped, and the whole world may be held accountable to God.
  Rom 5:12: Therefore, just as sin came into the world through one man, and death through sin, and so death spread to all men because all sinned—
  Rom 5:13: for sin indeed was in the world before the law was given, but sin is not counted where there is no law.
  Rom 5:14: Yet death reigned from Adam to Moses, even over those whose sinning was not like the transgression of Adam, who was a type of the one who was to come.
  Rom 5:15: But the free gift is not like the trespass. For if many died through one man's trespass, much more have the grace of God and the free gift by the grace of that one man Jesus Christ abounded for many.
  Rom 5:16: And the free gift is not like the result of that one man's sin. For the judgment following one trespass brought condemnation, but the free gift following many trespasses brought justification.
  Rom 5:17: For if, because of one man's trespass, death reigned through that one man, much more will those who receive the abundance of grace and the free gift of righteousness reign in life through the one man Jesus Christ.
  Rom 5:18: Therefore, as one trespass led to condemnation for all men, so one act of righteousness leads to justification and life for all men.
  Rom 5:19: For as by the one man's disobedience the many were made sinners, so by the one man's obedience the many will be made righteous.
  Rom 5:20: Now the law came in to increase the trespass, but where sin increased, grace abounded all the more,
  Rom 9:5: To them belong the patriarchs, and from their race, according to the flesh, is the Christ, who is God over all, blessed forever. Amen.
