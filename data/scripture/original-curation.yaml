# Hand-curated list of verses where a claim depends on the original wording.
# `focus` = lemmas to highlight (Greek lemma or Hebrew Strong's number). `why` explains the relevance and
# must cite where each tradition makes the argument. Everything else (text, morphology, glosses, Textus
# Receptus comparison, Nova Vulgata) is generated by scripts/fetch-original.ts into original.yaml.
entries:
  - ref: Gen 1:1
    lang: hbo
    focus: ["1254"]
    why: >-
      CCC 290 argues from the verb: "the verb 'create' - Hebrew bara - always has God for its subject."
      Abraham 4:1 describes the same event as the Gods who "organized and formed the heavens and the earth".

  - ref: Gen 2:7
    lang: hbo
    focus: ["5315", "2416"]
    why: >-
      Both traditions cite this verse for the human soul. "Living being" (NABRE) and "living soul" (KJV)
      both translate nephesh chayyah. CCC 362-363 notes that "soul" often means "the entire human person".

  - ref: Isa 7:14
    lang: hbo
    focus: ["5959"]
    why: >-
      The Hebrew is ʻalmah ("young woman"). The Greek Septuagint, which Matthew 1:23 quotes, reads
      parthenos ("virgin"). CCC 497 cites "Is 7:14 (LXX), quoted in Mt 1:23". The KJV translates the Hebrew as "a virgin".

  - ref: Matt 1:23
    lang: grc
    focus: [παρθένος]
    quotes: Isa 7:14 (Septuagint)
    why: >-
      Matthew quotes Isaiah 7:14 in its Septuagint form, with parthenos ("virgin") for the Hebrew ʻalmah.

  - ref: Luke 1:35
    lang: grc
    focus: [ἐπισκιάζω, πνεῦμα]
    why: >-
      Episkiazō ("overshadow") is the verb both traditions use for the Holy Spirit's role in the conception
      (CCC 484; Alma 7:10 "overshadowed").

  - ref: John 1:1
    lang: grc
    focus: [θεός, λόγος]
    why: >-
      "The Word was God" (theos ēn ho logos). CCC 241 cites this verse for the apostolic confession of
      the Son's divinity. The Living Christ applies John 1:3 in the same prologue to Christ as creator.

  - ref: John 1:14
    lang: grc
    focus: [σάρξ, γίνομαι]
    why: >-
      "The Word became flesh" (sarx egeneto). CCC 461 takes the term "Incarnation" from this expression.

  - ref: John 10:30
    lang: grc
    focus: [εἷς]
    why: >-
      "One" is the neuter form hen, not the masculine heis ("one person"). The footnote to D&C 93:3 cites
      this verse with John 17:22, where the same neuter hen describes the disciples' unity.

  - ref: John 17:22
    lang: grc
    focus: [εἷς]
    why: >-
      The same neuter hen ("one") used of the Father and the Son is used of the disciples ("that they may
      be one, even as we are one"). The footnote to D&C 93:3 groups this verse with John 10:30.

  - ref: Col 1:15
    lang: grc
    focus: [πρωτότοκος, εἰκών]
    why: >-
      Prōtotokos ("firstborn"). CCC 241 cites the verse for the Son as "the image of the invisible God".
      Latter-day Saint sources cite it for Christ as the Firstborn spirit child of the Father (TG "Jesus Christ, Firstborn").

  - ref: Heb 1:3
    lang: grc
    focus: [χαρακτήρ, ὑπόστασις]
    why: >-
      Charaktēr tēs hypostaseōs. CCC 241 renders it "the very stamp of his nature" and cites it for the Son's
      divinity. The KJV reads "the express image of his person", and the footnote to D&C 130:22 cites it for the Father's body.
      The Nova Vulgata has "figura substantiae eius".

  - ref: Phil 2:6
    lang: grc
    focus: [μορφή, θεός]
    why: >-
      "In the form (morphē) of God". CCC 461 quotes this hymn for the mystery of the Incarnation.

  - ref: Phil 2:7
    lang: grc
    focus: [κενόω, μορφή, δοῦλος]
    why: >-
      Ekenōsen ("emptied himself"), "taking the form (morphē) of a slave". CCC 461 and 472 cite this
      verse for the Son assuming a human nature.
