verses:
  1 Cor 15:22: For as in Adam all die, even so in Christ shall all be made alive.
  1 Ne 10:6: Wherefore, all mankind were in a lost and in a fallen state, and ever would be save they should rely on this Redeemer.
  1 Ne 11:13: And it came to pass that I looked and beheld the great city of Jerusalem, and also other cities. And I beheld the city of Nazareth; and in the city of Nazareth I beheld a virgin, and she was exceedingly fair and white.
  1 Ne 11:14: "And it came to pass that I saw the heavens open; and an angel came down and stood before me; and he said unto me: Nephi, what beholdest thou?"
  1 Ne 11:15: "And I said unto him: A virgin, most beautiful and fair above all other virgins."
  1 Ne 11:16: "And he said unto me: Knowest thou the condescension of God?"
  1 Ne 11:17: "And I said unto him: I know that he loveth his children; nevertheless, I do not know the meaning of all things."
  1 Ne 11:18: "And he said unto me: Behold, the virgin whom thou seest is the mother of the Son of God, after the manner of the flesh."
  1 Ne 11:19: "And it came to pass that I beheld that she was carried away in the Spirit; and after she had been carried away in the Spirit for the space of a time the angel spake unto me, saying: Look!"
  1 Ne 11:20: And I looked and beheld the virgin again, bearing a child in her arms.
  1 Ne 11:21: "And the angel said unto me: Behold the Lamb of God, yea, even the Son of the Eternal Father! Knowest thou the meaning of the tree which thy father saw?"
  2 Ne 2:4: And thou hast beheld in thy youth his glory; wherefore, thou art blessed even as they unto whom he shall minister in the flesh; for the Spirit is the same, yesterday, today, and forever. And the way is prepared from the fall of man, and salvation is free.
  2 Ne 2:25: Adam fell that men might be; and men are, that they might have joy.
  2 Tim 2:8: "Remember that Jesus Christ of the seed of David was raised from the dead according to my gospel:"
  A of F 1:1: We believe in God, the Eternal Father, and in His Son, Jesus Christ, and in the Holy Ghost.
  A of F 1:2: We believe that men will be punished for their own sins, and not for Adam’s transgression.
  A of F 1:8: We believe the Bible to be the word of God as far as it is translated correctly; we also believe the Book of Mormon to be the word of God.
  A of F 1:9: We believe all that God has revealed, all that He does now reveal, and we believe that He will yet reveal many great and important things pertaining to the Kingdom of God.
  Abr 3:18: Howbeit that he made the greater star; as, also, if there be two spirits, and one shall be more intelligent than the other, yet these two spirits, notwithstanding one is more intelligent than the other, have no beginning; they existed before, they shall have no end, they shall exist after, for they are gnolaum, or eternal.
  Abr 3:22: Now the Lord had shown unto me, Abraham, the intelligences that were organized before the world was; and among all these there were many of the noble and great ones;
  Abr 3:23: "And God saw these souls that they were good, and he stood in the midst of them, and he said: These I will make my rulers; for he stood among those that were spirits, and he saw that they were good; and he said unto me: Abraham, thou art one of them; thou wast chosen before thou wast born."
  Abr 3:24: "And there stood one among them that was like unto God, and he said unto those who were with him: We will go down, for there is space there, and we will take of these materials, and we will make an earth whereon these may dwell;"
  Abr 3:27: "And the Lord said: Whom shall I send? And one answered like unto the Son of Man: Here am I, send me. And another answered and said: Here am I, send me. And the Lord said: I will send the first."
  Abr 4:1: "And then the Lord said: Let us go down. And they went down at the beginning, and they, that is the Gods, organized and formed the heavens and the earth."
  Abr 4:27: So the Gods went down to organize man in their own image, in the image of the Gods to form they him, male and female to form they them.
  Acts 2:30: Therefore being a prophet, and knowing that God had sworn with an oath to him, that of the fruit of his loins, according to the flesh, he would raise up Christ to sit on his throne;
  Acts 17:28: For in him we live, and move, and have our being; as certain also of your own poets have said, For we are also his offspring.
  Acts 17:29: Forasmuch then as we are the offspring of God, we ought not to think that the Godhead is like unto gold, or silver, or stone, graven by art and man’s device.
  Alma 7:8: Behold, I do not say that he will come among us at the time of his dwelling in his mortal tabernacle; for behold, the Spirit hath not said unto me that this should be the case. Now as to this thing I do not know; but this much I do know, that the Lord God hath power to do all things which are according to his word.
  Alma 7:10: And behold, he shall be born of Mary, at Jerusalem which is the land of our forefathers, she being a virgin, a precious and chosen vessel, who shall be overshadowed and conceive by the power of the Holy Ghost, and bring forth a son, yea, even the Son of God.
  Alma 11:42: Now, there is a death which is called a temporal death; and the death of Christ shall loose the bands of this temporal death, that all shall be raised from this temporal death.
  Alma 11:44: Now, this restoration shall come to all, both old and young, both bond and free, both male and female, both the wicked and the righteous; and even there shall not so much as a hair of their heads be lost; but every thing shall be restored to its perfect frame, as it is now, or in the body, and shall be brought and be arraigned before the bar of Christ the Son, and God the Father, and the Holy Spirit, which is one Eternal God, to be judged according to their works, whether they be good or whether they be evil.
  Alma 11:45: Now, behold, I have spoken unto you concerning the death of the mortal body, and also concerning the resurrection of the mortal body. I say unto you that this mortal body is raised to an immortal body, that is from death, even from the first death unto life, that they can die no more; their spirits uniting with their bodies, never to be divided; thus the whole becoming spiritual and immortal, that they can no more see corruption.
  Col 1:15: "Who is the image of the invisible God, the firstborn of every creature:"
  D&C 17:1: Behold, I say unto you, that you must rely upon my word, which if you do with full purpose of heart, you shall have a view of the plates, and also of the breastplate, the sword of Laban, the Urim and Thummim, which were given to the brother of Jared upon the mount, when he talked with the Lord face to face, and the miraculous directors which were given to Lehi while in the wilderness, on the borders of the Red Sea.
  D&C 27:11: And also with Michael, or Adam, the father of all, the prince of all, the ancient of days;
  D&C 76:23: For we saw him, even on the right hand of God; and we heard the voice bearing record that he is the Only Begotten of the Father—
  D&C 76:24: That by him, and through him, and of him, the worlds are and were created, and the inhabitants thereof are begotten sons and daughters unto God.
  D&C 88:15: And the spirit and the body are the soul of man.
  D&C 88:16: And the resurrection from the dead is the redemption of the soul.
  D&C 93:3: And that I am in the Father, and the Father in me, and the Father and I are one—
  D&C 93:4: The Father because he gave me of his fulness, and the Son because I was in the world and made flesh my tabernacle, and dwelt among the sons of men.
  D&C 93:21: And now, verily I say unto you, I was in the beginning with the Father, and am the Firstborn;
  D&C 93:23: Ye were also in the beginning with the Father; that which is Spirit, even the Spirit of truth;
  D&C 93:29: Man was also in the beginning with God. Intelligence, or the light of truth, was not created or made, neither indeed can be.
  D&C 93:33: For man is spirit. The elements are eternal, and spirit and element, inseparably connected, receive a fulness of joy;
  D&C 107:54: And the Lord appeared unto them, and they rose up and blessed Adam, and called him Michael, the prince, the archangel.
  D&C 110:3: "His eyes were as a flame of fire; the hair of his head was white like the pure snow; his countenance shone above the brightness of the sun; and his voice was as the sound of the rushing of great waters, even the voice of Jehovah, saying:"
  D&C 110:4: I am the first and the last; I am he who liveth, I am he who was slain; I am your advocate with the Father.
  D&C 130:22: The Father has a body of flesh and bones as tangible as man’s; the Son also; but the Holy Ghost has not a body of flesh and bones, but is a personage of Spirit. Were it not so, the Holy Ghost could not dwell in us.
  D&C 131:7: There is no such thing as immaterial matter. All spirit is matter, but it is more fine or pure, and can only be discerned by purer eyes;
  D&C 131:8: We cannot see it; but when our bodies are purified we shall see that it is all matter.
  Dan 7:9: "I beheld till the thrones were cast down, and the Ancient of days did sit, whose garment was white as snow, and the hair of his head like the pure wool: his throne was like the fiery flame, and his wheels as burning fire."
  Dan 10:13: "But the prince of the kingdom of Persia withstood me one and twenty days: but, lo, Michael, one of the chief princes, came to help me; and I remained there with the kings of Persia."
  Ether 3:16: Behold, this body, which ye now behold, is the body of my spirit; and man have I created after the body of my spirit; and even as I appear unto thee to be in the spirit will I appear unto my people in the flesh.
  Ex 6:3: And I appeared unto Abraham, unto Isaac, and unto Jacob, by the name of God Almighty, but by my name Jehovah was I not known to them.
  Ezek 37:14: "And shall put my spirit in you, and ye shall live, and I shall place you in your own land: then shall ye know that I the Lord have spoken it, and performed it, saith the Lord."
  Gal 1:19: But other of the apostles saw I none, save James the Lord’s brother.
  Gen 1:1: In the beginning God created the heaven and the earth.
  Gen 1:26: "And God said, Let us make man in our image, after our likeness: and let them have dominion over the fish of the sea, and over the fowl of the air, and over the cattle, and over all the earth, and over every creeping thing that creepeth upon the earth."
  Gen 1:27: So God created man in his own image, in the image of God created he him; male and female created he them.
  Gen 2:7: And the Lord God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul.
  Gen 2:17: "But of the tree of the knowledge of good and evil, thou shalt not eat of it: for in the day that thou eatest thereof thou shalt surely die."
  Gen 2:21: "And the Lord God caused a deep sleep to fall upon Adam, and he slept: and he took one of his ribs, and closed up the flesh instead thereof;"
  Gen 2:22: And the rib, which the Lord God had taken from man, made he a woman, and brought her unto the man.
  Gen 3:6: And when the woman saw that the tree was good for food, and that it was pleasant to the eyes, and a tree to be desired to make one wise, she took of the fruit thereof, and did eat, and gave also unto her husband with her; and he did eat.
  Gen 3:7: And the eyes of them both were opened, and they knew that they were naked; and they sewed fig leaves together, and made themselves aprons.
  Gen 3:20: And Adam called his wife’s name Eve; because she was the mother of all living.
  Heb 1:2: Hath in these last days spoken unto us by his Son, whom he hath appointed heir of all things, by whom also he made the worlds;
  Heb 1:3: Who being the brightness of his glory, and the express image of his person, and upholding all things by the word of his power, when he had by himself purged our sins, sat down on the right hand of the Majesty on high;
  Heb 1:6: And again, when he bringeth in the firstbegotten into the world, he saith, And let all the angels of God worship him.
  Heb 12:9: "Furthermore we have had fathers of our flesh which corrected us, and we gave them reverence: shall we not much rather be in subjection unto the Father of spirits, and live?"
  Isa 7:14: Therefore the Lord himself shall give you a sign; Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel.
  Isa 12:2: "Behold, God is my salvation; I will trust, and not be afraid: for the Lord Jehovah is my strength and my song; he also is become my salvation."
  JS-H 1:17: It no sooner appeared than I found myself delivered from the enemy which held me bound. When the light rested upon me I saw two Personages, whose brightness and glory defy all description, standing above me in the air. One of them spake unto me, calling me by name and said, pointing to the other— This is My Beloved Son. Hear Him!
  JS-H 1:19: "I was answered that I must join none of them, for they were all wrong; and the Personage who addressed me said that all their creeds were an abomination in his sight; that those professors were all corrupt; that: “they draw near to me with their lips, but their hearts are far from me, they teach for doctrines the commandments of men, having a form of godliness, but they deny the power thereof.”"
  John 1:1: In the beginning was the Word, and the Word was with God, and the Word was God.
  John 1:3: All things were made by him; and without him was not any thing made that was made.
  John 4:24: "God is a Spirit: and they that worship him must worship him in spirit and in truth."
  John 8:58: Jesus said unto them, Verily, verily, I say unto you, Before Abraham was, I am.
  John 10:17: Therefore doth my Father love me, because I lay down my life, that I might take it again.
  John 10:18: No man taketh it from me, but I lay it down of myself. I have power to lay it down, and I have power to take it again. This commandment have I received of my Father.
  John 10:30: I and my Father are one.
  John 14:9: Jesus saith unto him, Have I been so long time with you, and yet hast thou not known me, Philip? he that hath seen me hath seen the Father; and how sayest thou then, Shew us the Father?
  John 14:10: "Believest thou not that I am in the Father, and the Father in me? the words that I speak unto you I speak not of myself: but the Father that dwelleth in me, he doeth the works."
  John 14:26: But the Comforter, which is the Holy Ghost, whom the Father will send in my name, he shall teach you all things, and bring all things to your remembrance, whatsoever I have said unto you.
  John 17:5: And now, O Father, glorify thou me with thine own self with the glory which I had with thee before the world was.
  John 17:22: "And the glory which thou gavest me I have given them; that they may be one, even as we are one:"
  Jude 1:9: Yet Michael the archangel, when contending with the devil he disputed about the body of Moses, durst not bring against him a railing accusation, but said, The Lord rebuke thee.
  Luke 1:27: To a virgin espoused to a man whose name was Joseph, of the house of David; and the virgin’s name was Mary.
  Luke 1:28: "And the angel came in unto her, and said, Hail, thou that art highly favoured, the Lord is with thee: blessed art thou among women."
  Luke 1:32: "He shall be great, and shall be called the Son of the Highest: and the Lord God shall give unto him the throne of his father David:"
  Luke 1:34: Then said Mary unto the angel, How shall this be, seeing I know not a man?
  Luke 1:35: "And the angel answered and said unto her, The Holy Ghost shall come upon thee, and the power of the Highest shall overshadow thee: therefore also that holy thing which shall be born of thee shall be called the Son of God."
  Luke 3:22: And the Holy Ghost descended in a bodily shape like a dove upon him, and a voice came from heaven, which said, Thou art my beloved Son; in thee I am well pleased.
  Luke 3:38: Which was the son of Enos, which was the son of Seth, which was the son of Adam, which was the son of God.
  Luke 22:42: "Saying, Father, if thou be willing, remove this cup from me: nevertheless not my will, but thine, be done."
  Luke 24:39: "Behold my hands and my feet, that it is I myself: handle me, and see; for a spirit hath not flesh and bones, as ye see me have."
  Mark 6:3: Is not this the carpenter, the son of Mary, the brother of James, and Joses, and of Juda, and Simon? and are not his sisters here with us? And they were offended at him.
  Matt 1:16: And Jacob begat Joseph the husband of Mary, of whom was born Jesus, who is called Christ.
  Matt 1:20: "But while he thought on these things, behold, the angel of the Lord appeared unto him in a dream, saying, Joseph, thou son of David, fear not to take unto thee Mary thy wife: for that which is conceived in her is of the Holy Ghost."
  Matt 3:17: And lo a voice from heaven, saying, This is my beloved Son, in whom I am well pleased.
  Matt 6:9: "After this manner therefore pray ye: Our Father which art in heaven, Hallowed be thy name."
  Matt 13:55: Is not this the carpenter’s son? is not his mother called Mary? and his brethren, James, and Joses, and Simon, and Judas?
  Matt 13:56: And his sisters, are they not all with us? Whence then hath this man all these things?
  Matt 28:19: "Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:"
  Moses 1:33: And worlds without number have I created; and I also created them for mine own purpose; and by the Son I created them, which is mine Only Begotten.
  Moses 3:21: And I, the Lord God, caused a deep sleep to fall upon Adam; and he slept, and I took one of his ribs and closed up the flesh in the stead thereof;
  Moses 3:22: And the rib which I, the Lord God, had taken from man, made I a woman, and brought her unto the man.
  Moses 4:2: But, behold, my Beloved Son, which was my Beloved and Chosen from the beginning, said unto me— Father, thy will be done, and the glory be thine forever.
  Moses 4:26: And Adam called his wife’s name Eve, because she was the mother of all living; for thus have I, the Lord God, called the first of all women, which are many.
  Moses 5:11: "And Eve, his wife, heard all these things and was glad, saying: Were it not for our transgression we never should have had seed, and never should have known good and evil, and the joy of our redemption, and the eternal life which God giveth unto all the obedient."
  Moses 7:39: And that which I have chosen hath pled before my face. Wherefore, he suffereth for their sins; inasmuch as they will repent in the day that my Chosen shall return unto me, and until that day they shall be in torment;
  Mosiah 3:8: And he shall be called Jesus Christ, the Son of God, the Father of heaven and earth, the Creator of all things from the beginning; and his mother shall be called Mary.
  Mosiah 3:19: For the natural man is an enemy to God, and has been from the fall of Adam, and will be, forever and ever, unless he yields to the enticings of the Holy Spirit, and putteth off the natural man and becometh a saint through the atonement of Christ the Lord, and becometh as a child, submissive, meek, humble, patient, full of love, willing to submit to all things which the Lord seeth fit to inflict upon him, even as a child doth submit to his father.
  Num 16:22: And they fell upon their faces, and said, O God, the God of the spirits of all flesh, shall one man sin, and wilt thou be wroth with all the congregation?
  Prov 8:23: I was set up from everlasting, from the beginning, or ever the earth was.
  Ps 83:18: That men may know that thou, whose name alone is Jehovah, art the most high over all the earth.
  Rev 12:7: "And there was war in heaven: Michael and his angels fought against the dragon; and the dragon fought and his angels,"
  Rom 1:3: Concerning his Son Jesus Christ our Lord, which was made of the seed of David according to the flesh;
  Rom 5:12: "Wherefore, as by one man sin entered into the world, and death by sin; and so death passed upon all men, for that all have sinned:"
  Rom 8:16: "The Spirit itself beareth witness with our spirit, that we are the children of God:"
  Rom 8:29: For whom he did foreknow, he also did predestinate to be conformed to the image of his Son, that he might be the firstborn among many brethren.
